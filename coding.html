 {title:"繰り返し",body:"同じ処理を何度も行うときは繰り返しを使います。回数が決まっているなら `for` 文、配列の中身を1つずつ処理するなら `forEach`、条件が成り立つ間くり返すなら `while` が便利です。\n`break` でループを途中で抜け、`continue` でその回だけ飛ばせます。条件が終わらないと無限ループになるので注意します。",
  code:`for (let i = 1; i <= 3; i++) {
  console.log(i + "回目");
}

const menu = ["コーヒー", "紅茶"];
menu.forEach((item) => {
  console.log(item);
});`,
  quiz:[
   {id:"js-3-0",q:"`for (let i = 0; i < 3; i++)` は何回繰り返す？",c:["2回","3回","4回","無限"],a:1,e:"i が 0, 1, 2 の3回です。"},
   {id:"js-3-1",q:"`i++` の意味は？",c:["i を2倍にする","i に1を足す","i を0に戻す","i を表示する","i から1を引く","i を10にする","i を削除する"],a:1,e:"`i = i + 1` の省略形です。",w:{4:"1を引くのは `i--` です。"}},
   {id:"js-3-2",q:"`[\"A\",\"B\"].forEach((x) => console.log(x))` で表示されるのは？",c:["A と B が順に","\"A,B\" が1回","2 が1回","何も表示されない","B と A の順","A だけ","エラー"],a:0,e:"forEach は配列の要素を前から1つずつ取り出して処理します。"},
   {id:"js-3-3",q:"条件が成り立つ間ずっと繰り返す文は？",c:["`while`","`repeat`","`loop`","`until`","`if`","`forEach`","`do` だけ"],a:0,e:"`while (条件) { … }` は条件が true の間くり返します。",w:{4:"`if` は1回だけ判定して分岐します。くり返しません。",5:"`forEach` は配列の要素の数だけくり返します。"}},
   {id:"js-3-4",q:"繰り返しを途中でやめるキーワードは？",c:["`break`","`stop`","`exit`","`continue`","`end`","`quit`","`pause`"],a:0,e:"`break` でループをその場で抜けます。",w:{3:"`continue` は今回だけ飛ばして、次の繰り返しへ進みます。"}}
  ]},
 {title:"関数",body:"関数は処理をひとまとめにして名前をつけたものです。引数（ひきすう）で値を受け取り、`return` で結果を返します。作っただけでは実行されず、`関数名()` で呼び出したときに実行されます。\nアロー関数 `() => {}` という短い書き方もよく使われます。",
  code:`function addTax(price) {
  return price * 1.1;
}
console.log(addTax(500)); // 550

const greet = (name) => {
  return name + "さん、こんにちは";
};
console.log(greet("田中"));`,
  quiz:[
   {id:"js-4-0",q:"関数から結果を返すキーワードは？",c:["`return`","`output`","`back`","`give`","`send`","`result`","`end`"],a:0,e:"`return` の後ろの値が、関数を呼んだ場所に返されます。"},
   {id:"js-4-1",q:"`addTax(500)` の `500` のように、関数に渡す値を何と呼ぶ？",c:["戻り値","引数","変数名","プロパティ","関数名","演算子","メソッド"],a:1,e:"関数に渡す値を引数、関数が返す値を戻り値と言います。",w:{0:"戻り値は関数が返す値です。"}},
   {id:"js-4-2",q:"`const double = (n) => n * 2;` のとき `double(4)` は？",c:["4","6","8","エラー"],a:2,e:"4 × 2 = 8 です。"},
   {id:"js-4-3",q:"関数を作っただけで、呼び出さないとどうなる？",c:["中の処理は実行されない","自動で1回実行される","エラーになる","ページを開くたびに実行される","2回実行される","中身が消える","return の値だけ表示される"],a:0,e:"関数は `関数名()` で呼び出したときにはじめて実行されます。"},
   {id:"js-4-4",q:"次のコードで表示されるのは？",c:["5","6","23","undefined"],a:0,e:"a + b を返します。"}
  ]},
 {title:"配列の操作",body:"配列には便利な機能（メソッド）がたくさんあります。`push()` で最後に追加、`length` で個数、`includes()` で入っているかを確認できます。\n`filter()` は条件に合う要素だけを集めた新しい配列を、`map()` は各要素を変換した新しい配列を作ります。`join()` は要素をつなげて1つの文字列にします。",
  code:`const prices = [300, 800, 1200];
prices.push(500);          // [300, 800, 1200, 500]
const cheap = prices.filter((p) => p < 1000); // [300, 800, 500]
const ten = prices.map((p) => p * 10);       // [3000, 8000, 12000, 5000]
console.log(prices.includes(800));           // true
console.log(["A", "B"].join(" / "));          // "A / B"`,
  quiz:[
   {id:"js-6-0",q:"配列の最後に要素を追加するメソッドは？",c:["`push()`","`add()`","`append()`","`insert()`","`put()`","`plus()`","`end()`"],a:0,e:"`push()` は配列の末尾に要素を追加します。"},
   {id:"js-6-1",q:"`[1, 2, 3].map((n) => n * 10)` の結果は？",c:["`[10, 20, 30]`","`60`","`[1, 2, 3, 10]`","`[10]`"],a:0,e:"map は各要素を変換した新しい配列を返します。"},
   {id:"js-6-2",q:"条件に合う要素だけを取り出すメソッドは？",c:["`map()`","`filter()`","`forEach()`","`push()`","`pick()`","`select()`","`length`"],a:1,e:"`filter()` は条件が true になった要素だけを集めます。"},
   {id:"js-6-3",q:"配列の中に特定の値が入っているか調べるメソッドは？",c:["`includes()`","`has()`","`contains()`","`exists()`","`check()`","`push()`","`join()`"],a:0,e:"`[\"A\",\"B\"].includes(\"A\")` は true を返します。"},
   {id:"js-6-4",q:"`[\"コーヒー\", \"紅茶\"].join(\" / \")` の結果は？",c:["`\"コーヒー / 紅茶\"`","`[\"コーヒー / 紅茶\"]`","`\"コーヒー紅茶\"`","`2`","`\"コーヒー\"`","エラー","`[\"コーヒー\", \" / \", \"紅茶\"]`"],a:0,e:"`join()` は要素を指定した文字でつなげて、1つの文字列にします。",w:{1:"join の結果は配列ではなく文字列です。"}}
  ]}
],
/* 上級 */
[
 {title:"オブジェクト",body:"オブジェクトは、関係のあるデータを「名前（キー）: 値」の組でまとめたものです。`{ }` で作り、値は `オブジェクト.キー` で取り出します。\n配列の中にオブジェクトを入れると、商品一覧や会員一覧のようなデータを表せます。実際のWebサイトで扱うデータは、ほとんどがこの形です。",
  code:`const user = { name: "佐藤", age: 28 };
console.log(user.name); // 佐藤
user.age = 29;          // 値を書き換える
user.city = "東京";     // キーを追加する

const products = [
  { name: "コーヒー", price: 500 },
  { name: "ケーキ", price: 450 }
];
console.log(products[1].name); // ケーキ`,
  quiz:[
   {id:"js-7-0",q:"`const user = { name: \"佐藤\", age: 28 };` で年齢を取り出すのは？",c:["`user.age`","`user[age]`（引用符なし）","`user(age)`","`age.user`","`user->age`","`user:age`","`user[1]`"],a:0,e:"`オブジェクト.キー` で値を取り出します。`user[\"age\"]` でも同じです。",w:{1:"`[]` で書く場合は `user[\"age\"]` のように引用符が必要です。",6:"オブジェクトには番号はないので、キーで取り出します。"}},
   {id:"js-7-1",q:"次のコードで表示されるのは？",c:["ケーキ","コーヒー","450","undefined"],a:0,e:"products[1] は2番目のオブジェクトです。"},
   {id:"js-7-2",q:"オブジェクトに新しいキー `city` を追加する書き方は？",c:["`user.city = \"東京\";`","`user.push(\"東京\");`","`user + city = \"東京\";`","`add(user, city);`","`user[city] = 東京;`","`user.city(\"東京\");`","`city.user = \"東京\";`"],a:0,e:"存在しないキーに代入すると、新しく追加されます。",w:{1:"`push()` は配列のメソッドです。"}},
   {id:"js-7-3",q:"オブジェクトを作る括弧は？",c:["`{ }`","`[ ]`","`( )`","`< >`","`\" \"`","`/ /`","`| |`"],a:0,e:"オブジェクトは `{ }`、配列は `[ ]` で作ります。",w:{1:"`[ ]` は配列です。"}},
   {id:"js-7-4",q:"商品オブジェクトの配列 `products` の価格を合計するのに使いやすいのは？",c:["`forEach` で `price` を足していく","`push` で足す","`join` でつなぐ","`includes` で調べる","`length` を使う","`querySelector` を使う","`typeof` を使う"],a:0,e:"`forEach` で1つずつ `item.price` を合計用の変数に足します。",w:{2:"join は文字列としてつなぐだけで、足し算はしません。",4:"length は個数です。"}}
  ]},
 {title:"DOM操作",body:"JavaScriptでHTMLの要素を取得して書き換えることをDOM操作と言います。`document.querySelector()` にCSSと同じセレクタを書いて要素を取ります。当てはまる要素を全部取るなら `querySelectorAll()` です。\n取った要素の `textContent` で文字を、`classList` でクラスを、`style` で見た目を変えられます。見た目の変更は、CSSにクラスを用意しておき `classList` で付け外しするのがおすすめです。",
  code:`const title = document.querySelector("h1");
title.textContent = "ようこそ";

const nav = document.querySelector(".nav");
nav.classList.add("is-open");     // クラスを付ける
nav.classList.remove("is-open");  // クラスを外す
nav.classList.toggle("is-open");  // 付け外しを切り替える`,
  quiz:[
   {id:"js-5-0",q:"`class=\"title\"` の要素を1つ取得する書き方は？",c:["`document.querySelector(\"title\")`","`document.querySelector(\".title\")`","`document.getClass(\"title\")`","`document.select(\"#title\")`","`document.querySelector(\"#title\")`","`document.getElement(\".title\")`","`document.query(\".title\")`"],a:1,e:"CSSと同じく、クラスにはドットをつけます。",w:{0:"ドットがないと title というタグを探してしまいます。",4:"`#` は id を探す書き方です。"}},
   {id:"js-5-1",q:"クラスがあれば外し、なければつけるメソッドは？",c:["`classList.add()`","`classList.remove()`","`classList.toggle()`","`classList.switch()`","`classList.change()`","`classList.flip()`","`classList.replace()`"],a:2,e:"`toggle` は切り替えです。ハンバーガーメニューの開閉でよく使います。"},
   {id:"js-5-2",q:"要素の中の文字を書き換えるプロパティは？",c:["`textContent`","`value`","`style`","`src`","`href`","`className`","`id`"],a:0,e:"`textContent` に代入すると、中の文字が置き換わります。",w:{1:"`value` は入力欄の値です。"}},
   {id:"js-5-3",q:"同じクラスの要素をすべて取得するメソッドは？",c:["`document.querySelectorAll(\".item\")`","`document.querySelector(\".item\")`","`document.getAll(\".item\")`","`document.querySelector(\".item\").all`","`document.items`","`document.querySelectorEvery(\".item\")`","`document.find(\".item\")`"],a:0,e:"`querySelectorAll` は当てはまる要素を全部集めて返します。",w:{1:"`querySelector` は最初の1つだけを返します。"}},
   {id:"js-5-4",q:"要素が見つからないとき `document.querySelector()` が返す値は？",c:["`null`","`0`","`false`","空の文字列","エラーで止まる","`[]`","`-1`"],a:0,e:"見つからないと `null` が返ります。そのまま `.textContent` などを使うとエラーになるので、セレクタの書き間違いに注意します。"}
  ]},
 {title:"イベント",body:"クリックや入力などの「できごと」をイベントと言います。`要素.addEventListener(\"click\", 関数)` と書くと、そのイベントが起きたときに関数が実行されます。\nよく使うイベントは `click`（クリック）、`input`（入力されるたび）、`submit`（フォーム送信）、`scroll`（スクロール）などです。入力欄の値は `value` で取り出します。フォーム送信で再読み込みを止めるには `event.preventDefault()` を使います。",
  code:`const btn = document.querySelector(".menu-btn");
const nav = document.querySelector(".nav");

btn.addEventListener("click", () => {
  nav.classList.toggle("is-open");
});

const input = document.querySelector("#name");
input.addEventListener("input", () => {
  console.log(input.value);
});`,
  quiz:[
   {id:"js-8-0",q:"クリックされたときの処理を登録するメソッドは？",c:["`addEventListener(\"click\", …)`","`onClick(…)`","`addEvent(\"click\")`","`listen(\"click\", …)`","`click.add(…)`","`addListener(\"onclick\")`","`event(\"click\", …)`"],a:0,e:"`要素.addEventListener(\"イベント名\", 関数)` で登録します。"},
   {id:"js-8-1",q:"入力欄に1文字入力されるたびに起きるイベントは？",c:["`input`","`click`","`submit`","`load`","`scroll`","`type`","`key`"],a:0,e:"`input` イベントは値が変わるたびに起きます。",w:{1:"`click` はクリックされたときです。",2:"`submit` はフォームが送信されたときです。",3:"`load` は読み込みが終わったときです。",4:"`scroll` はスクロールしたときです。"}},
   {id:"js-8-2",q:"入力欄に入力された文字を取り出すプロパティは？",c:["`value`","`textContent`","`text`","`input`","`innerValue`","`content`","`data`"],a:0,e:"`<input>` や `<textarea>` の中身は `value` で取り出します。",w:{1:"`textContent` は要素の中の文字で、入力欄に入力された値は取れません。"}},
   {id:"js-8-3",q:"フォーム送信時に、ページが再読み込みされないように止めるのは？",c:["`event.preventDefault()`","`event.stop()`","`form.cancel()`","`event.reload(false)`","`submit = false`","`event.pause()`","`form.noReload()`"],a:0,e:"`addEventListener(\"submit\", (event) => { event.preventDefault(); … })` で、ブラウザの標準の動き（送信）を止めます。"},
   {id:"js-8-4",q:"ボタンを3回押したとき、最後に表示される数は？",c:["3","1","0","4"],a:0,e:"押すたびに1ずつ増えます。"}
  ]}
]];

 {id:"js-1",t:"単価 price が 250、個数 count が 3 のときの合計金額を表示しよう。",h:"変数を2つ作り、掛け算 `*` で計算します。",a:"const price = 250;\nconst count = 3;\nconsole.log(price * count);",ae:"掛け算は `*`、割り算は `/` です。",must:[[/\bprice\b/,"変数 price を使いましょう。"],[/\bcount\b/,"変数 count を使いましょう。"]]},

 {id:"js-11",t:"配列 products = [{ name: \"コーヒー\", price: 500 }, { name: \"ケーキ\", price: 450 }, { name: \"紅茶\", price: 400 }] の、価格の合計を表示しよう。",h:"`let total = 0;` を作り、`products.forEach((p) => { total = total + p.price; });` で足していきます。",a:"const products = [\n  { name: \"コーヒー\", price: 500 },\n  { name: \"ケーキ\", price: 450 },\n  { name: \"紅茶\", price: 400 }\n];\nlet total = 0;\nproducts.forEach((p) => {\n  total = total + p.price;\n});\nconsole.log(total);",ae:"配列の中のオブジェクトを1つずつ取り出し、その price を足しています。",must:[[/\.price/,"各商品の price を使いましょう。"]]},
 {id:"js-12",t:"id が title の見出しの文字を、JavaScriptで「ようこそ」に書き換えよう。",html:"<h1 id=\"title\">こんにちは</h1>",starter:"",h:"`document.querySelector(\"#title\")` で取得して、`textContent` に代入します。",a:"const title = document.querySelector(\"#title\");\ntitle.textContent = \"ようこそ\";",ae:"id は `#`、class は `.` を付けて探します。",

 {id:"js-14",t:"ボタン（.menu-btn）を押すたびに、.nav に is-open クラスが付いたり外れたりするようにしよう。（is-open が付くとメニューが表示されます）",html:"<button class=\"menu-btn\">メニュー</button>\n<nav class=\"nav\">ホーム / メニュー / アクセス</nav>\n<style>.nav{display:none;margin-top:8px}.nav.is-open{display:block}</style>",starter:"",h:"クリックされたら `nav.classList.toggle(\"is-open\")` を実行します。",a:"const btn = document.querySelector(\".menu-btn\");\nconst nav = document.querySelector(\".nav\");\nbtn.addEventListener(\"click\", () => {\n  nav.classList.toggle(\"is-open\");\n});",ae:"toggle は「付いていたら外す、なければ付ける」です。ハンバーガーメニューと同じしくみです。",

 {title:"データベースとは",body:"データベースはデータを整理してためておく場所です。MySQLでは、データを表（テーブル）の形で保存します。このように表でデータを管理するものをリレーショナルデータベース（RDB）と言い、命令には SQL という言語を使います。\n表の横1行を「レコード（行）」、縦1列を「カラム（列）」と呼びます。各行を区別するための、重複しない列を「主キー（PRIMARY KEY）」と言います。列ごとに、整数（INT）や文字列（VARCHAR）などのデータ型を決めます。",
  code:`members テーブル
+----+--------+-----+
| id | name   | age |   ← カラム（列）

|  1 | 佐藤   |  28 |   ← レコード（行）
|  2 | 鈴木   |  35 |
+----+--------+-----+
  ↑ 主キー（同じ値は入らない）`,
  quiz:[
   {id:"db-0-0",q:"テーブルの横1行を何と呼ぶ？",c:["カラム","レコード","フィールド名","スキーマ","テーブル名","データ型","インデックス"],a:1,e:"横1行がレコード（行）、縦1列がカラム（列）です。",w:{0:"カラムは縦1列です。"}},
   {id:"db-0-1",q:"主キー（PRIMARY KEY）の特徴は？",c:["同じ値を何度でも入れられる","空でもよい","各行を区別できる重複しない値","テーブルの名前","自動で必ず文字列になる","一番最後の列のこと","データベースの名前"],a:2,e:"主キーは重複せず、空（NULL）にもできません。",w:{0:"主キーには同じ値を入れられません。",1:"主キーは空（NULL）にできません。"}},
   {id:"db-0-2",q:"データベースに命令するための言語は？",c:["HTML","SQL","CSS","PHP","JavaScript","Python","JSON"],a:1,e:"SQLはデータベースを操作する言語です。MySQLはSQLで操作するデータベースソフトです。",w:{3:"PHPはプログラミング言語です。PHPの中からSQLを使ってDBを操作することはできます。",6:"JSONはデータを書き表す形式で、命令の言語ではありません。"}},
   {id:"db-0-3",q:"MySQL のように、表（テーブル）でデータを管理するデータベースを何と呼ぶ？",c:["リレーショナルデータベース","スプレッドシート","テキストデータベース","CSSデータベース","ファイルサーバー","キャッシュ","クラウドストレージ"],a:0,e:"テーブル同士を関連（リレーション）させて管理するので、リレーショナルデータベース（RDB）と呼びます。"},
   {id:"db-0-4",q:"「年齢」の列に向いているデータ型は？",c:["`INT`","`VARCHAR`","`DATE`","`TEXT`","`BOOLEAN`","`TIME`","`BLOB`"],a:0,e:"年齢は整数なので `INT` が向いています。数値で持つと計算や並べ替えが正しくできます。",w:{1:"VARCHAR は文字列用です。数値としての計算や比較がしにくくなります。",2:"DATE は日付用です。"}}
  ]},
 {title:"MySQLに入る・DBを選ぶ",body:"DockerでMySQLを動かしている場合は、`docker exec` でコンテナに入り、`mysql` コマンドでログインします。\nログインしたら `SHOW DATABASES;` で一覧を見て、`USE データベース名;` で使うDBを選びます。課題用と練習用でDBを分けておくと、課題のデータを壊さずに試せます。SQLの文の終わりには必ず `;` をつけます。`--` の後ろはコメントになります。",
  code:`$ docker exec -it コンテナ名 mysql -u root -p

mysql> SHOW DATABASES;
mysql> CREATE DATABASE practice;
mysql> USE practice;
mysql> SHOW TABLES;
mysql> DESC members;   -- テーブルの列を確認`,
  quiz:[
   {id:"db-1-0",q:"使うデータベースを切り替えるSQLは？",c:["`SELECT practice;`","`USE practice;`","`OPEN practice;`","`CHANGE practice;`","`GO practice;`","`SWITCH practice;`","`LOAD practice;`"],a:1,e:"`USE データベース名;` で操作対象のDBを選びます。",w:{0:"SELECT はデータを取り出すSQLです。"}},
   {id:"db-1-1",q:"SQLを入力してEnterを押したのに `->` と表示されて実行されない。原因は？",c:["`;` をつけ忘れた","大文字で書いていない","DBが壊れた","Dockerが止まった","テーブルがない","パスワードが違う","日本語を使った"],a:0,e:"`;` がないと文が続くと判断されます。`;` を入力してEnterすれば実行されます。",w:{1:"SQLは大文字・小文字どちらでも動きます。"}},
   {id:"db-1-2",q:"テーブルの列の構成（型など）を確認するSQLは？",c:["`SHOW TABLES;`","`DESC テーブル名;`","`SELECT TABLE;`","`LIST テーブル名;`","`SHOW DATABASES;`","`CHECK テーブル名;`","`OPEN テーブル名;`"],a:1,e:"`DESC`（DESCRIBE）で列名・型・主キーなどが見られます。",w:{0:"`SHOW TABLES;` はテーブルの一覧です。",4:"`SHOW DATABASES;` はデータベースの一覧です。"}},
   {id:"db-1-3",q:"新しいデータベース shop を作るSQLは？",c:["`CREATE DATABASE shop;`","`NEW DATABASE shop;`","`MAKE shop;`","`CREATE TABLE shop;`","`INSERT DATABASE shop;`","`ADD DATABASE shop;`","`USE shop;`"],a:0,e:"`CREATE DATABASE 名前;` で作ります。",w:{3:"`CREATE TABLE` はテーブルを作るSQLです。",6:"`USE` は作ったDBを選ぶときに使います。"}},
   {id:"db-1-4",q:"SQLの1行コメントの書き方は？",c:["`-- コメント`","`// コメント`","`<!-- コメント -->`","`' コメント`","`** コメント`","`{ コメント }`","`%% コメント`"],a:0,e:"`--`（ハイフン2つとスペース）の後ろはコメントになります。MySQLでは `#` や `/* */` も使えます。",w:{1:"`//` はJavaScriptのコメントです。",2:"`<!-- -->` はHTMLのコメントです。"}}
  ]},
 {title:"データを取り出す",body:"`SELECT 列 FROM テーブル;` でデータを取り出します。`*` は全部の列という意味です。\n`WHERE` で条件をつけ、`ORDER BY` で並べ替え（`ASC` 小さい順 / `DESC` 大きい順）、`LIMIT` で件数を絞ります。`LIKE '%京%'` は「京を含む」、`BETWEEN 20 AND 29` は「20以上29以下」、`IN ('東京', '大阪')` は「どれかに当てはまる」です。",
  code:`SELECT * FROM members;

SELECT name, age FROM members
WHERE age >= 30
ORDER BY age DESC
LIMIT 3;

SELECT * FROM members WHERE name LIKE '佐%';
SELECT DISTINCT city FROM members;  -- 重複を除く`,
  quiz:[
   {id:"db-4-0",q:"年齢が大きい順に並べるのは？",c:["`ORDER BY age ASC`","`ORDER BY age DESC`","`SORT age DESC`","`GROUP BY age`","`ORDER age DESC`","`ORDER BY age UP`","`SORT BY age ASC`"],a:1,e:"DESC が大きい順（降順）、ASC が小さい順（昇順）です。",w:{0:"ASC は小さい順（昇順）です。",3:"GROUP BY はまとめるときに使います。"}},
   {id:"db-4-1",q:"`WHERE name LIKE '佐%'` が見つけるのは？",c:["名前が「佐」だけの人","「佐」で始まる名前","「佐」で終わる名前","「佐」を含まない名前","2文字の名前","「%」が入っている名前","名前が空の人"],a:1,e:"`%` は「何文字でもよい」の意味。'佐%' は「佐」で始まる文字列です。",w:{2:"「佐」で終わるなら `'%佐'` です。",5:"`%` は「何文字でもよい」という記号として働きます。"}},
   {id:"db-4-2",q:"SQLの書く順番として正しいのは？",c:["SELECT → WHERE → FROM → ORDER BY","SELECT → FROM → WHERE → ORDER BY","FROM → SELECT → ORDER BY → WHERE","SELECT → ORDER BY → FROM → WHERE","FROM → WHERE → SELECT → ORDER BY","SELECT → WHERE → ORDER BY → FROM","WHERE → SELECT → FROM → ORDER BY"],a:1,e:"SELECT 列 FROM 表 WHERE 条件 ORDER BY 並び順 LIMIT 件数 の順です。"},
   {id:"db-4-3",q:"年齢が20〜29歳の人を探す条件として正しいのは？",c:["`WHERE age BETWEEN 20 AND 29`","`WHERE age = 20 ~ 29`","`WHERE age IN 20-29`","`WHERE age >= 20 OR age <= 29`","`WHERE age FROM 20 TO 29`","`WHERE 20 < age < 29`","`WHERE age LIKE '2%'`"],a:0,e:"`BETWEEN A AND B` は A 以上 B 以下です。`age >= 20 AND age <= 29` とも書けます。",w:{3:"OR だと全員が当てはまってしまいます。AND にします。",6:"LIKE は文字列の検索用です。"}},
   {id:"db-4-4",q:"重複を除いて、都市（city）の一覧を出すSQLは？",c:["`SELECT DISTINCT city FROM members;`","`SELECT UNIQUE city FROM members;`","`SELECT city FROM members ONLY;`","`SELECT city FROM members NO DUPLICATE;`","`SELECT ONE city FROM members;`","`SELECT * DISTINCT FROM members;`","`SELECT city FROM members LIMIT 1;`"],a:0,e:"`DISTINCT` を付けると、同じ値は1回だけ表示されます。",w:{6:"LIMIT 1 だと1行しか出ません。"}}
  ]}
],
/* 中級 */
[
 {title:"テーブルを作る・変える",body:"`CREATE TABLE` でテーブルを作ります。列ごとに名前とデータ型を決めます。\nよく使う型は、整数の `INT`、文字列の `VARCHAR(文字数)`、日付の `DATE` です。`AUTO_INCREMENT` をつけると番号が自動で1ずつ増え、`NOT NULL` で空を禁止できます。作った後の列の追加は `ALTER TABLE`、テーブルごと削除するのは `DROP TABLE` です。",
  code:`CREATE TABLE members (
  id INT AUTO_INCREMENT PRIMARY KEY,
  name VARCHAR(50) NOT NULL,
  age INT,
  city VARCHAR(20)
);

ALTER TABLE members ADD email VARCHAR(100);  -- 列を追加`,
  quiz:[
   {id:"db-2-0",q:"最大50文字の文字列を入れる型は？",c:["`INT(50)`","`TEXT50`","`VARCHAR(50)`","`CHAR50`","`STRING(50)`","`TEXT(50文字)`","`DATE(50)`"],a:2,e:"`VARCHAR(50)` は最大50文字までの文字列です。",w:{0:"INT は整数の型です。"}},
   {id:"db-2-1",q:"`NOT NULL` の意味は？",c:["空（NULL）を入れられない","0を入れられない","重複できない","自動で番号が入る","マイナスを入れられない","文字列を入れられない","削除できない"],a:0,e:"必ず値が必要な列につけます。",w:{2:"重複を禁止するのは `UNIQUE` です。",3:"自動で番号を入れるのは `AUTO_INCREMENT` です。"}},
   {id:"db-2-2",q:"`AUTO_INCREMENT` をつけた id 列に INSERT するとき、id はどうする？",c:["省略すれば自動で連番が入る","必ず自分で番号を書く","0しか入らない","文字列を入れる","ランダムな番号が入る","NULL が入る","いつも1が入る"],a:0,e:"id を省略すると、前の番号に1を足した値が自動で入ります。"},
   {id:"db-2-3",q:"作ったテーブルに後から列を追加するSQLは？",c:["`ALTER TABLE members ADD email VARCHAR(100);`","`UPDATE TABLE members ADD email;`","`INSERT COLUMN email INTO members;`","`ADD email TO members;`","`CREATE COLUMN email;`","`CHANGE members email;`","`SET members.email;`"],a:0,e:"テーブルの構造を変えるのは `ALTER TABLE` です。",w:{1:"`UPDATE` はデータの中身を書き換えるSQLです。"}},
   {id:"db-2-4",q:"テーブル members を丸ごと削除するSQLは？",c:["`DROP TABLE members;`","`DELETE FROM members;`","`REMOVE TABLE members;`","`DELETE TABLE members;`","`CLEAR members;`","`ERASE members;`","`DROP members;`"],a:0,e:"`DROP TABLE` はテーブルそのものを消します。元に戻せないので注意します。",w:{1:"`DELETE FROM` はデータ（行）を消すだけで、テーブルは残ります。"}}
  ]},
 {title:"追加・更新・削除",body:"データの追加は `INSERT`、変更は `UPDATE`、削除は `DELETE` です。\n`UPDATE` と `DELETE` では、どの行を対象にするか `WHERE` で必ず絞り込みましょう。`WHERE` を忘れると、全部の行が書き換わったり消えたりします。実行前に同じ WHERE で SELECT して、対象の行を確かめると安全です。",
  code:`INSERT INTO members (name, age, city)
VALUES ('佐藤', 28, '東京'), ('鈴木', 35, '大阪');

SELECT * FROM members WHERE id = 1;   -- 先に確認
UPDATE members SET age = 29 WHERE id = 1;

DELETE FROM members WHERE id = 1;`,
  quiz:[
   {id:"db-3-0",q:"`DELETE FROM members;` を実行するとどうなる？",c:["1行目だけ消える","全部の行が消える","エラーになる","テーブル自体が消える","最後の行だけ消える","何も起きない","データベースごと消える"],a:1,e:"WHEREがないと全行が対象です。",w:{3:"テーブル自体を消すのは `DROP TABLE` です。"}},
   {id:"db-3-1",q:"既存のデータを書き換えるSQLは？",c:["`INSERT`","`CHANGE`","`UPDATE`","`ALTER`","`MODIFY`","`SET`","`EDIT`"],a:2,e:"`UPDATE テーブル SET 列 = 値 WHERE 条件;` です。"},
   {id:"db-3-2",q:"`INSERT INTO members (name, age) VALUES ('佐藤', 28);` で文字列を囲んでいる記号は？",c:["`'`（シングルクォート）","`#`","`()`","何も囲まない","`<>`","`[]`","`*`"],a:0,e:"SQLの文字列は `'` で囲みます。数値は囲みません。"},
   {id:"db-3-3",q:"一度に2行を追加する書き方は？",c:["`INSERT INTO members (name, age) VALUES ('山田', 30), ('小林', 25);`","`INSERT INTO members VALUES ('山田', 30) AND ('小林', 25);`","`INSERT 2 INTO members …;`","`INSERT INTO members (name, age) VALUES ('山田', 30); ('小林', 25);`","`ADD INTO members …;`","`INSERT INTO members (name, age) VALUE ['山田', 30], ['小林', 25];`","まとめては追加できない"],a:0,e:"VALUES の後ろに `( )` をカンマで並べると、まとめて追加できます。"},
   {id:"db-3-4",q:"UPDATE や DELETE を実行する前にやると安全なことは？",c:["同じ WHERE で SELECT して対象の行を確認する","必ず DROP TABLE しておく","WHERE を外して試す","テーブル名を変える","USE を2回実行する","すべて大文字で書く","何もしなくてよい"],a:0,e:"先に `SELECT * FROM members WHERE …;` で対象を確かめると、思わぬ行を消したり書き換えたりするのを防げます。"}
  ]},
 {title:"集計する",body:"`COUNT`（数える）、`SUM`（合計）、`AVG`（平均）、`MAX`・`MIN`（最大・最小）などの集計関数を使うと、データをまとめて計算できます。\n`GROUP BY` で「〜ごと」にまとめ、まとめた結果に条件をつけるときは `WHERE` ではなく `HAVING` を使います。`AS` で結果の列に別名をつけられます。",
  code:`SELECT COUNT(*) FROM members;

SELECT city, COUNT(*) AS 人数, AVG(age) AS 平均年齢
FROM members
GROUP BY city
HAVING COUNT(*) >= 2;`,
  quiz:[
   {id:"db-5-0",q:"「都市ごとの人数」を出すときに使う句は？",c:["`ORDER BY city`","`GROUP BY city`","`WHERE city`","`COUNT BY city`","`SUM BY city`","`SPLIT BY city`","`HAVING city`"],a:1,e:"「〜ごと」は GROUP BY です。"},
   {id:"db-5-1",q:"GROUP BY でまとめた結果に条件をつける句は？",c:["`WHERE`","`HAVING`","`LIMIT`","`IF`","`GROUP`","`ON`","`WHEN`"],a:1,e:"WHERE はまとめる前の行、HAVING はまとめた後のグループに条件をつけます。",w:{0:"WHERE はまとめる前の行に条件をつけます。"}},
   {id:"db-5-2",q:"`AS 人数` の役割は？",c:["列に別名をつける","テーブルを作る","条件をつける","並べ替える","列を削除する","列を足し算する","重複を消す"],a:0,e:"結果の列名を見やすい名前にできます。"},
   {id:"db-5-3",q:"注文金額（price）の平均を出す関数は？",c:["`AVG(price)`","`MEAN(price)`","`AVERAGE(price)`","`SUM(price)`","`COUNT(price)`","`MID(price)`","`MAX(price)`"],a:0,e:"平均は AVG、合計は SUM、件数は COUNT、最大は MAX、最小は MIN です。",w:{3:"SUM は合計です。",4:"COUNT は件数です。",6:"MAX は最大値です。"}},
   {id:"db-5-4",q:"price が 300、500、800 のとき `SELECT SUM(price) FROM orders;` の結果は？",c:["1600","800","300","3"],a:0,e:"合計です。"}
  ]}
],

[
 {title:"テーブルをつなぐ（JOIN）",body:"データは複数のテーブルに分けて保存し、必要なときに `JOIN` でつなぎます。`ON` の後に「どの列とどの列が対応しているか」を書きます。\n列名が両方のテーブルにある場合は `テーブル名.列名` と書いて区別します。`AS` でテーブルに短い別名をつけると書きやすくなります。片方にしかない行も残したいときは `LEFT JOIN` を使います。",
  code:`SELECT m.name, o.item, o.price
FROM orders AS o
JOIN members AS m ON o.member_id = m.id;

-- 注文がない会員も表示する
SELECT m.name, o.item
FROM members AS m
LEFT JOIN orders AS o ON o.member_id = m.id;`,
  quiz:[
   {id:"db-6-0",q:"JOINでテーブルをつなぐ条件を書く場所は？",c:["`WHERE` の後","`ON` の後","`AS` の後","`BY` の後","`FROM` の前","`SELECT` の後","`JOIN` の前"],a:1,e:"`JOIN テーブル ON 結合条件` と書きます。"},
   {id:"db-6-1",q:"`orders.member_id = members.id` の意味は？",c:["注文の会員IDと会員のIDが同じ行同士をつなぐ","会員IDを書き換える","IDが同じ行を削除する","IDの合計を出す","2つのテーブルを1つに合体して保存する","member_id を id の順に並べ替える","IDが同じ行だけ残して他を削除する"],a:0,e:"注文テーブルの member_id が、会員テーブルのどの id にあたるかを指定しています。",w:{4:"JOIN は結果を表示するだけで、テーブル自体は変わりません。"}},
   {id:"db-6-2",q:"JOINでつないだとき、`name` 列が両方のテーブルにある場合の書き方は？",c:["`members.name` のようにテーブル名をつける","`name` だけでよい","`name2` と書く","JOINできない","`name(members)` と書く","`members-name` と書く","`AS name` と書く"],a:0,e:"どのテーブルの列かあいまいになるので `テーブル名.列名` と書きます。"},
   {id:"db-6-3",q:"注文がない会員も含めて、全会員を表示したいときの JOIN は？",c:["`LEFT JOIN`","`INNER JOIN`","`JOIN ALL`","`FULL SELECT`","`OUTER WHERE`","`ALL JOIN`","`ONLY JOIN`"],a:0,e:"`members LEFT JOIN orders` とすると、左側（members）の行はすべて残り、注文がない会員は注文の列が NULL になります。",w:{1:"INNER JOIN（JOIN）は両方にデータがある行だけを表示します。"}},
   {id:"db-6-4",q:"テーブルに短い別名をつけて書く方法は？",c:["`FROM members AS m JOIN orders AS o ON o.member_id = m.id`","`FROM members = m`","`FROM m(members)`","`FROM members NAME m`","`FROM members TO m`","`FROM members.m`","別名はつけられない"],a:0,e:"`AS` で別名をつけると `m.name` のように短く書けます。`AS` は省略して `members m` とも書けます。"}
  ]},
 {title:"正規化",body:"正規化とは、データの重複をなくすようにテーブルを分けて整理することです。同じデータをあちこちに書くと、1か所だけ直し忘れてデータが食い違う（更新異常）などの問題が起きます。\n第1正規形：1つのマスに値を1つだけ入れる（「コーヒー, 紅茶」のようにまとめない）。第2正規形：主キーの一部だけで決まる列を別テーブルに分ける。第3正規形：主キー以外の列で決まる列を別テーブルに分ける（例：郵便番号 → 住所）。分けたテーブルは JOIN でつないで取り出します。",
  code:`-- 正規化前：会員の名前や都市が注文ごとに重複している
orders(id, member_name, member_city, item, price)

-- 正規化後：会員を別テーブルに分け、IDでつなぐ
members(id, name, city)
orders(id, member_id, item, price)`,
  quiz:[
   {id:"db-7-0",q:"正規化の主な目的は？",c:["データの重複をなくし、食い違いを防ぐ","データを暗号化する","検索結果を並べ替える","テーブルを1つにまとめる","データを自動でバックアップする","SQLを短く書く","パスワードを守る"],a:0,e:"重複をなくすことで、更新・追加・削除のときにデータが食い違う問題（異常）を防ぎます。",w:{3:"正規化では逆に、テーブルを適切に分けます。"}},
   {id:"db-7-1",q:"第1正規形になっていないのはどれ？",c:["好きな飲み物の列に「コーヒー, 紅茶」と2つ入っている","会員テーブルに id・名前・年齢がある","注文テーブルに member_id がある","商品テーブルに価格の列がある","日付の列が DATE 型","主キーが設定されている","名前の列が VARCHAR 型"],a:0,e:"1つのマスには値を1つだけ入れます。複数ある場合は行を分けるか、別テーブルにします。"},
   {id:"db-7-2",q:"注文テーブルに会員の名前と都市を毎回書くと、どんな問題が起きる？",c:["会員が引っ越したとき全部の注文を直す必要があり、直し忘れると食い違う","注文が保存できなくなる","SELECT が使えなくなる","主キーが作れなくなる","データ型が使えなくなる","問題は起きない","テーブルが削除される"],a:0,e:"これを更新異常と言います。会員情報は会員テーブルに1回だけ書き、注文側は member_id で参照します。"},

 {title:"トランザクションと同時実行制御",body:"トランザクションは、いくつかの処理を「全部成功」か「全部取り消し」のどちらかにまとめる仕組みです。振込で「Aさんから引く」と「Bさんに足す」の片方だけが実行されると困るので、まとめて扱います。`BEGIN`（開始）→ 処理 → `COMMIT`（確定）、途中で問題があれば `ROLLBACK`（取り消し）します。\n同時に何人もが同じデータを操作すると、データが食い違うことがあります。それを防ぐのが同時実行制御で、ロック（使っている間は他の人を待たせる）などの方法があります。お互いが相手のロック解除を待ち続けて止まってしまう状態をデッドロックと言います。",
  code:`BEGIN;
UPDATE accounts SET balance = balance - 1000 WHERE id = 1;
UPDATE accounts SET balance = balance + 1000 WHERE id = 2;
COMMIT;   -- 両方を確定する

-- 途中でやめるとき
ROLLBACK; -- BEGIN の後の変更をすべて取り消す`,
  quiz:[

   {id:"db-8-2",q:"ACID特性の「A（原子性）」の意味は？",c:["処理が全部実行されるか、まったく実行されないかのどちらかになる","確定したデータは消えない","データのルールが守られる","同時に実行しても互いに影響しない","処理が速い","自動でバックアップされる","暗号化される"],a:0,e:"Atomicity（原子性）＝それ以上分けられない1つの単位として扱うこと。ほかに C（一貫性）、I（独立性）、D（永続性）があります。",w:{1:"それは D（永続性）です。",2:"それは C（一貫性）です。",3:"それは I（独立性）です。"}},
   {id:"db-8-3",q:"2人が同時に同じ在庫を「残り1」と読み、両方が購入して在庫がマイナスになった。これを防ぐ仕組みは？",c:["ロック（排他制御）","正規化","インデックス","GROUP BY","ALTER TABLE","DISTINCT","AUTO_INCREMENT"],a:0,e:"一方が操作している間、他方を待たせる（ロックする）ことで、同時更新による食い違いを防ぎます。"},
   {id:"db-8-4",q:"AさんはデータXをロックしてYを待ち、BさんはYをロックしてXを待っている。この状態は？",c:["デッドロック","ロールバック","コミット","ダーティリード","正規化","オートコミット","インデックス"],a:0,e:"お互いが相手の解除を待ち続けて進めなくなる状態をデッドロックと言います。DBはどちらかを ROLLBACK して解消します。",w:{3:"ダーティリードは、まだ確定していない他の人の変更を読んでしまう現象です。"}}
  ]}
]];

const MISTAKES={
 html:[
  {t:"閉じタグを書き忘れる",bad:"<p>こんにちは\n<p>ようこそ</p>",good:"<p>こんにちは</p>\n<p>ようこそ</p>",e:"閉じタグがないと、どこまでが段落かわからなくなります。ブラウザが自動で補うこともありますが、思わぬ表示崩れの原因になります。"},
  {t:"タグを閉じる順番がずれる",bad:"<p><strong>大事なお知らせ</p></strong>",good:"<p><strong>大事なお知らせ</strong></p>",e:"後から開いたタグを先に閉じます。箱の中に箱を入れるイメージです。エディタの字下げをそろえると見つけやすくなります。"},
  {t:"src と href を取り違える",bad:"<img href=\"cat.jpg\" alt=\"ねこ\">\n<a src=\"about.html\">会社概要</a>",good:"<img src=\"cat.jpg\" alt=\"ねこ\">\n<a href=\"about.html\">会社概要</a>",e:"ファイルを読み込んで表示するもの（画像など）は `src`、移動するリンクは `href` です。"},
  {t:"画像の alt を書かない",bad:"<img src=\"logo.png\">",good:"<img src=\"logo.png\" alt=\"My Cafe\">",e:"alt がないと、画像が表示されないときや読み上げソフトで、何の画像か伝わりません。検索エンジンも画像の内容を理解できません。"},
  {t:"ファイルの場所（パス）がずれている",bad:"<!-- 画像は images フォルダの中にある -->\n<img src=\"cat.jpg\" alt=\"ねこ\">",good:"<img src=\"images/cat.jpg\" alt=\"ねこ\">",e:"HTMLファイルから見た場所を書きます。フォルダの中なら「フォルダ名/ファイル名」、1つ上のフォルダなら `../` から始めます。"},
  {t:"ul の直下に li 以外を置く",bad:"<ul>\n  <a href=\"#\">ホーム</a>\n</ul>",good:"<ul>\n  <li><a href=\"#\">ホーム</a></li>\n</ul>",e:"`<ul>`・`<ol>` の直下に置けるのは `<li>` だけです。リンクは `<li>` の中に入れます。"},
  {t:"文字を大きくするために見出しタグを使う",bad:"<h3>※ 価格はすべて税込です</h3>",good:"<p class=\"note\">※ 価格はすべて税込です</p>\n\n/* CSS */\n.note { font-size: 1.25rem; }",e:"見出しタグは「見出しかどうか」という意味で選びます。文字の大きさはCSSで変えます。"},
  {t:"同じ id を何度も使う",bad:"<div id=\"card\">…</div>\n<div id=\"card\">…</div>",good:"<div class=\"card\">…</div>\n<div class=\"card\">…</div>",e:"id は1ページに1つだけです。同じデザインを何度も使うなら class にします。"}
 ],
 css:[
  {t:"; を付け忘れる",bad:"p {\n  color: red\n  font-size: 20px;\n}",good:"p {\n  color: red;\n  font-size: 20px;\n}",e:"`;` を忘れると、次の行まで1つの値として読まれて、両方とも効かなくなります。最後の行にも付ける習慣にしましょう。"},
  {t:"クラス名の . を忘れる",bad:"card {\n  padding: 16px;\n}",good:".card {\n  padding: 16px;\n}",e:"`.` がないと「card というタグ」を探してしまいます。クラスは `.`、id は `#` を付けます。"},
  {t:"HTMLとCSSでクラス名のつづりが違う",bad:"<div class=\"card\">…</div>\n\n.crad { padding: 16px; }",good:"<div class=\"card\">…</div>\n\n.card { padding: 16px; }",e:"1文字違うだけで効きません。大文字・小文字も別のものとして扱われます。効かないときは、まず名前を見比べましょう。"},
  {t:"数値に単位を付け忘れる",bad:".box {\n  width: 200;\n  margin: 20;\n}",good:".box {\n  width: 200px;\n  margin: 20px;\n}",e:"0 以外の長さには `px` や `rem` などの単位が必要です。`line-height: 1.8` のように、単位なしで書くものもあります。"},
  {t:"display: flex を子に書く",bad:".menu li {\n  display: flex;\n}",good:".menu {\n  display: flex;\n}",e:"flex は「並べたい要素の親」に書きます。子に書くと、その子の中身が並ぶだけです。"},
  {t:"全角のスペースや記号が混ざる",bad:".title　{\n  color：red；\n}",good:".title {\n  color: red;\n}",e:"全角のスペース・「：」・「；」は記号として読まれません。CSSを書くときは日本語入力をオフにしましょう。"},
  {t:"width: 100% に padding を付けてはみ出す",bad:".box {\n  width: 100%;\n  padding: 20px;\n}",good:"* {\n  box-sizing: border-box;\n}\n.box {\n  width: 100%;\n  padding: 20px;\n}",e:"初期値では width に padding が足されるので、100% を超えてはみ出します。最初に全体へ `box-sizing: border-box` を書いておくのが定番です。"},
  {t:"強い指定に上書きできない",bad:"#main p { color: black; }\n.note { color: red; }  /* 赤にならない */",good:"#main .note { color: red; }",e:"id を含むセレクタはとても強いので、クラスだけでは上書きできません。見た目の指定には id ではなくクラスを使うと、管理しやすくなります。"}
 ],
 js:[
  {t:"= と === を取り違える",bad:"if (score = 80) {\n  console.log(\"80点\");\n}",good:"if (score === 80) {\n  console.log(\"80点\");\n}",e:"`=` は代入なので、score に 80 が入ってしまい、条件はいつも成り立ちます。比べるときは `===` です。"},
  {t:"const で作った変数を書き換える",bad:"const count = 0;\ncount = count + 1;  // エラー",good:"let count = 0;\ncount = count + 1;",e:"後から値を変える変数は `let` で作ります。"},
  {t:"文字列のまま足し算してしまう",bad:"const a = input.value;  // \"5\"\nconsole.log(a + 3);     // \"53\"",good:"const a = Number(input.value);\nconsole.log(a + 3);     // 8",e:"入力欄の `value` は文字列です。数値として計算するときは `Number()` で変換します。"},
  {t:"配列の番号を1から数える",bad:"const menu = [\"A\", \"B\", \"C\"];\nconsole.log(menu[3]);  // undefined",good:"const menu = [\"A\", \"B\", \"C\"];\nconsole.log(menu[2]);  // \"C\"",e:"配列の番号は0から始まります。3つの要素の番号は 0・1・2 です。"},
  {t:"querySelector の . や # を忘れる",bad:"const btn = document.querySelector(\"btn\");  // null",good:"const btn = document.querySelector(\".btn\");",e:"CSSと同じ書き方です。クラスは `.`、id は `#` を付けます。見つからないと null になり、その後でエラーが出ます。"},
  {t:"HTMLより先にスクリプトが動く",bad:"<head>\n  <script src=\"main.js\"><\/script>\n</head>",good:"<head>\n  <script src=\"main.js\" defer><\/script>\n</head>",e:"HTMLが読み込まれる前に querySelector すると、要素がまだないので null になります。`defer` を付けるか、`</body>` の直前に書きます。"},
  {t:"addEventListener に () を付けて渡す",bad:"btn.addEventListener(\"click\", openMenu());",good:"btn.addEventListener(\"click\", openMenu);",e:"`openMenu()` と書くと、登録した時点で実行されてしまいます。「クリックされたら実行してほしい関数」そのものを渡すので `()` は付けません。"},
  {t:"return と console.log を混同する",bad:"function add(a, b) {\n  console.log(a + b);\n}\nconst x = add(1, 2);  // x は undefined",good:"function add(a, b) {\n  return a + b;\n}\nconst x = add(1, 2);  // x は 3",e:"console.log は表示するだけで、値を返しません。計算結果を使いたいときは `return` で返します。"}
 ],
 db:[
  {t:"; を付け忘れる",bad:"mysql> SELECT * FROM members\n    ->",good:"mysql> SELECT * FROM members;",e:"`->` が出て止まったら、`;` を入力して Enter すれば実行されます。"},
  {t:"文字列を ' で囲まない",bad:"SELECT * FROM members WHERE city = 東京;",good:"SELECT * FROM members WHERE city = '東京';",e:"文字列や日付は `'` で囲みます。数値は囲みません。"},
  {t:"WHERE を付けずに UPDATE / DELETE する",bad:"DELETE FROM members;  -- 全員消える",good:"SELECT * FROM members WHERE id = 3;  -- 先に確認\nDELETE FROM members WHERE id = 3;",e:"WHERE がないと全部の行が対象になります。先に同じ WHERE で SELECT して、対象を確かめてから実行しましょう。"},
  {t:"句の順番をまちがえる",bad:"SELECT * FROM members\nORDER BY age\nWHERE age >= 20;",good:"SELECT * FROM members\nWHERE age >= 20\nORDER BY age;",e:"書く順番は SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY → LIMIT です。"},
  {t:"集計の条件を WHERE に書く",bad:"SELECT city, COUNT(*) FROM members\nWHERE COUNT(*) >= 2\nGROUP BY city;",good:"SELECT city, COUNT(*) FROM members\nGROUP BY city\nHAVING COUNT(*) >= 2;",e:"WHERE はまとめる前の1行ずつに、HAVING はまとめた後のグループに条件をつけます。"},
  {t:"最後の列の後ろにカンマを付ける",bad:"SELECT name, age, FROM members;",good:"SELECT name, age FROM members;",e:"カンマは列と列の「間」に書きます。最後の列の後ろには付けません。"},
  {t:"JOIN で列名があいまいになる",bad:"SELECT id, name, item\nFROM orders\nJOIN members ON orders.member_id = members.id;",good:"SELECT members.id, members.name, orders.item\nFROM orders\nJOIN members ON orders.member_id = members.id;",e:"id は両方のテーブルにあるので「どちらの id か」わからずエラーになります。`テーブル名.列名` で書きます。"},
  {t:"NULL を = で調べる",bad:"SELECT * FROM members WHERE city = NULL;",good:"SELECT * FROM members WHERE city IS NULL;",e:"NULL は「値がない」状態なので、= では比べられません。`IS NULL` / `IS NOT NULL` を使います。"}
 ]
};

  note:"`flex-direction: column` にすると並ぶ向きが縦になり、justify-content は縦方向、align-items は横方向のそろえ方に入れ替わります。"}),
"css:position":cssPlay({stage:`<div class="pl-pos"><span class="pl-cap">外側の枠（position: relative）</span><div class="pl-card">カード（.card）<br>中身の文章です。<span class="pl-badge" style="top:0;right:0">NEW</span></div></div>`,
  rules:[{sel:".card",t:".pl-card",props:[{p:"position",v:["static","relative"],d:"relative"}]},{sel:".badge",t:".pl-badge",fixed:["top: 0;","right: 0;"],props:[{p:"position",v:["static","relative","absolute"],d:"absolute"}]}],
  note:".card を static にすると、バッジの基準が外側の枠に変わり、枠の右上へ移動します。.badge を static にすると top・right は効かず、文章の流れの中に戻ります。"}),

  rules:[{sel:".cards",t:".pl-t",fixed:["display: grid;"],props:[{p:"grid-template-columns",v:["1fr 1fr 1fr","1fr 2fr","repeat(4, 1fr)","100px 1fr"]},{p:"gap",v:["0px","8px","16px"],d:"8px"}]}],
  note:"並べた幅の数が列の数になります。`1fr 2fr` は残りの幅を 1:2 で分けます。"}),
"css:動き（hover と transition）":cssPlay({stage:`<div class="pl-t pl-move">カード</div>`,
  rules:[{sel:".card",t:".pl-t",props:[{p:"transition",v:["0s","0.3s","1s"],d:"0.3s"},{p:"transform",v:["none","translateY(-10px)","scale(1.2)","rotate(15deg)"]}]}],
  note:"transition を 1s にしてから transform を切り替えると、ゆっくり動くのがわかります。0s だと一瞬で変わります。"}),
"js:データの種類":mkPlay({controls:[{k:"i",label:"menu[ ? ] の番号",v:[0,1,2,3]}],
  view:st=>{const m=["コーヒー","紅茶","ケーキ"],v=m[st.i];return `<div class="dg-mono" style="margin-bottom:6px">const menu = ["コーヒー", "紅茶", "ケーキ"];</div><div class="arr">${m.map((x,i)=>`<div class="arr-c ${i===st.i?"on":""}"><b>"${x}"</b><small>menu[${i}]</small></div>`).join("")}</div><p class="pl-out" style="margin:8px 0 0">console.log(menu[${st.i}]) → <b>${v?`"${v}"`:"undefined"}</b>${v?"":"（3番目までしかないので、値がありません）"}</p>`;}}),
"js:条件分岐":mkPlay({controls:[{k:"s",label:"score の値",v:[50,60,75,80,95],d:75}],
  view:st=>{const s=st.s,c1=s>=80,c2=s>=60,r=c1?"A":c2?"B":"C";
    const L=[[`const score = ${s};`,""],["if (score >= 80) {",`// ${s} >= 80 → ${c1}`],['  console.log("A");',c1?"← 実行":""],["} else if (score >= 60) {",c1?"// 調べない":`// ${s} >= 60 → ${c2}`],['  console.log("B");',!c1&&c2?"← 実行":""],["} else {",""],['  console.log("C");',!c1&&!c2?"← 実行":""],["}",""]];
    return `<pre class="pl-cd"><code>${L.map(([c,m])=>`<span class="${m.startsWith("←")?"pl-on":""}">${esc(c)}</span>${m?`  <span class="pl-cm">${esc(m)}</span>`:""}`).join("\n")}</code></pre><p class="pl-out" style="margin:8px 0 0">表示されるのは <b>${r}</b> だけです。</p>`;}}),
"js:繰り返し":mkPlay({controls:[{k:"s",label:"i の始まり",v:[0,1],d:1},{k:"op",label:"条件の記号",v:["<","<="],d:"<="},{k:"e",label:"終わりの数",v:[3,5],d:5}],
  view:st=>{const last=st.op==="<"?st.e-1:st.e,vals=[];for(let i=st.s;i<=last;i++)vals.push(i);
    return `<pre class="pl-code"><code>${esc(`for (let i = ${st.s}; i ${st.op} ${st.e}; i++) {\n  console.log(i);\n}`)}</code></pre><div class="pl-out" style="margin-top:8px">表示される i：<div class="pl-vals">${vals.map(v=>`<span>${v}</span>`).join("")}</div><p style="margin:6px 0 0"><b>${vals.length}回</b>くり返します。i が ${last+1} になると条件（${last+1} ${st.op} ${st.e}）が false になって終わります。</p></div>`;}}),
"db:データを取り出す":mkPlay({controls:[{k:"w",label:"WHERE",v:["なし","age >= 30","city = '東京'","age < 25"]},{k:"o",label:"ORDER BY",v:["なし","age ASC","age DESC"]},{k:"l",label:"LIMIT",v:["なし","3"]}],
  view:st=>{let r=MEM.slice();
    if(st.w==="age >= 30") r=r.filter(x=>x[2]>=30); if(st.w==="city = '東京'") r=r.filter(x=>x[3]==="東京"); if(st.w==="age < 25") r=r.filter(x=>x[2]<25);
    if(st.o==="age ASC") r.sort((a,b)=>a[2]-b[2]); if(st.o==="age DESC") r.sort((a,b)=>b[2]-a[2]);
    if(st.l==="3") r=r.slice(0,3);
    const sql=["SELECT * FROM members",st.w!=="なし"?`WHERE ${st.w}`:"",st.o!=="なし"?`ORDER BY ${st.o}`:"",st.l!=="なし"?`LIMIT ${st.l}`:""].filter(Boolean).join("\n")+";";
    return `<pre class="pl-code"><code>${esc(sql)}</code></pre><div style="margin-top:8px">${miniTable(["id","name","age","city"],r)}</div>`;},
  note:"条件を組み合わせると、WHERE で絞る → ORDER BY で並べる → LIMIT で件数を切る、の順に処理されます。"}),
"db:集計する":mkPlay({controls:[{k:"f",label:"集計関数",v:["COUNT(*)","AVG(age)","MAX(age)","MIN(age)"]},{k:"g",label:"GROUP BY",v:["なし","city"],d:"city"}],
  view:st=>{const calc=rows=>{const a=rows.map(r=>r[2]);return st.f==="COUNT(*)"?rows.length:st.f==="AVG(age)"?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):st.f==="MAX(age)"?Math.max(...a):Math.min(...a);};
    let cols,rows;
    if(st.g==="city"){const cs=[...new Set(MEM.map(r=>r[3]))];cols=["city",st.f];rows=cs.map(c=>[c,calc(MEM.filter(r=>r[3]===c))]);}
    else{cols=[st.f];rows=[[calc(MEM)]];}
    const sql=`SELECT ${st.g==="city"?"city, ":""}${st.f} FROM members${st.g==="city"?"\nGROUP BY city":""};`;
    return `<pre class="pl-code"><code>${esc(sql)}</code></pre><div style="margin-top:8px">${miniTable(cols,rows)}</div>`;},
  note:"GROUP BY なしだと全体で1行、GROUP BY city だと都市ごとに1行ずつ集計されます。"}),
"db:テーブルをつなぐ（JOIN）":mkPlay({controls:[{k:"j",label:"つなぎ方",v:["JOIN","LEFT JOIN"]}],
  view:st=>{const rows=[];MEM.forEach(m=>{const os=ORD.filter(o=>o[1]===m[0]);if(os.length)os.forEach(o=>rows.push([m[1],o[2]]));else if(st.j==="LEFT JOIN")rows.push([m[1],null]);});
    return `<pre class="pl-code"><code>${esc(`SELECT m.name, o.item\nFROM members AS m\n${st.j} orders AS o ON o.member_id = m.id;`)}</code></pre><div style="margin-top:8px">${miniTable(["name","item"],rows,r=>r[1]===null?"null":"")}</div><p class="pl-out" style="margin:6px 0 0">${rows.length}行</p>`;},
  note:"伊藤さん（id 5）は注文がありません。JOIN では結果に出てきませんが、LEFT JOIN では item が NULL の行として残ります。"})
};

/* ===== 問題を作る：正解1つ＋まちがい候補から3つ、並びもシャッフル ===== */
function makeQ(base){
  let g=null;
  if(GEN[base.id]){try{g=GEN[base.id]();}catch(e){g=null;}}
  if(!g){
    const why={}; Object.entries(base.w||{}).forEach(([k,v])=>{why[base.c[k]]=v;});
    g={q:base.q,code:base.code,e:base.e,right:base.c[base.a],wrong:base.c.filter((x,i)=>i!==base.a),why};
  }
  const right=String(g.right);
  const wrong=shuf([...new Set(g.wrong.map(String))].filter(w=>w!==right)).slice(0,3);
  const c=shuf([right,...wrong]);
  return {q:g.q,code:g.code,e:g.e,c,a:c.indexOf(right),why:g.why||{}};
}
/* まちがえた選択肢の解説 */
function whyOf(q,txt){
  if(q.why&&q.why[txt]) return q.why[txt];
  const m=/^`([^`]+)`$/.exec(txt); const k=m?m[1]:txt;
  if(Object.prototype.hasOwnProperty.call(TERMS,k)) return TERMS[k]===null?"このような書き方はありません。":TERMS[k];
  return "";
}

function quizHTML(items){

      ${it.q.code?`<pre><code>${esc(it.q.code)}</code></pre>`:""}
      <div class="choices">${it.q.c.map((c,i)=>`<button class="choice" data-i="${i}">${md(c)}</button>`).join("")}</div>
      <div class="fb" hidden></div>
      ${store.ok[it.id]?`<small style="color:var(--ok)">● 前に正解済み</small>`:""}
    </div>`).join("");

function bindQuiz(root,items,onAnswer){
  root.querySelectorAll(".q").forEach((box,idx)=>{
    const it=items[idx];
    box.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>{
      const a=it.q.a, i=+b.dataset.i, ok=a===i, chosen=it.q.c[i];
      box.querySelectorAll(".choice").forEach((x,j)=>{x.disabled=true; if(j===a) x.classList.add("right");});
      let extra="";
      if(ok){
        store.ok[it.id]=true;
        if(store.miss[it.id]){delete store.miss[it.id]; extra=`<div class="why small">苦手リストから外しました。</div>`;}
      }else{
        b.classList.add("wrong");
        store.miss[it.id]=(store.miss[it.id]||0)+1;
        const w=whyOf(it.q,chosen);
        if(w) extra+=`<div class="why"><b>あなたの答え</b> ${md(chosen)}<br>${md(w)}</div>`;
        extra+=`<div class="why small">苦手リストに追加しました。</div>`;
      }
      save(); refreshNav();
      const fb=box.querySelector(".fb"); fb.hidden=false;
      fb.innerHTML=`<strong class="${ok?"ok":"ng"}">${ok?"正解！":"おしい！"}</strong> ${md(it.q.e)}${extra}`;
      onAnswer&&onAnswer(ok);
    }));
  });
}

function linkTerms(root){
  const list=GLOSS[state.cat]; if(!list||!root) return;
  const terms=list.map(g=>g[0]).filter(t=>t.length>1).sort((a,b)=>b.length-a.length);
  const re=new RegExp(terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"),"g");
  const used=new Set(), nodes=[];
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentNode.closest("code,button")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n=>{
    const t=n.nodeValue; let last=0,m,frag=null; re.lastIndex=0;
    while((m=re.exec(t))){
      if(used.has(m[0])) continue; used.add(m[0]);
      frag=frag||document.createDocumentFragment();
      frag.append(t.slice(last,m.index));
      const b=document.createElement("button"); b.type="button"; b.className="gl"; b.dataset.g=m[0]; b.textContent=m[0];
      frag.append(b); last=m.index+m[0].length;
    }
    if(frag){frag.append(t.slice(last)); n.replaceWith(frag);}
  });
}

const PV_BASE='<meta charset="utf-8"><style>body{font-family:sans-serif;margin:0;padding:10px;color:#222;background:#fff;line-height:1.6}</style>';
/* JSを別スレッドで実行（2秒で打ち切り） */
function runJS(code){
  return new Promise(res=>{
    const pre='const __o=[];const __f=v=>{if(typeof v==="string")return v;if(v===undefined)return"undefined";try{const s=JSON.stringify(v);return s===undefined?String(v):s;}catch(e){return String(v);}};self.console={log:(...a)=>__o.push(a.map(__f).join(" "))};let __e=null;\ntry{\n';
    const post='\n}catch(e){__e=e.name+": "+e.message;}\npostMessage({out:__o,err:__e});';
    let wk,url,done=false;
    const fin=r=>{if(done)return;done=true;try{wk&&wk.terminate();}catch(e){}try{url&&URL.revokeObjectURL(url);}catch(e){}res(r);};
    try{
      url=URL.createObjectURL(new Blob([pre+code+post],{type:"text/javascript"}));
      wk=new Worker(url);
      wk.onmessage=e=>fin(e.data);
      wk.onerror=e=>{e.preventDefault();fin({out:[],err:(e.message||"エラー").replace(/^Uncaught\s*/,"")});};
      setTimeout(()=>fin({out:[],err:"TIMEOUT"}),2000);
    }catch(e){fin({out:[],err:"このブラウザではコードを実行できませんでした。"});}
  });
}
/* HTMLを操作するJSは、プレビューの中で実行して結果を確かめる */
function runDOM(ex,code,pv){
  return new Promise(res=>{
    const key="k"+Math.random().toString(36).slice(2);
    let done=false;
    const h=e=>{if(e.data&&e.data.k===key)fin(e.data);};
    const fin=r=>{if(done)return;done=true;window.removeEventListener("message",h);res(r);};
    window.addEventListener("message",h);
    const safe=s=>s.replace(/<\/script/gi,"<\\/script");
    pv.setAttribute("sandbox","allow-scripts");
    pv.srcdoc=PV_BASE+ex.html+
      `<script>window.onerror=function(m){parent.postMessage({k:"${key}",err:String(m)},"*");return true;};<\/script>`+
      `<script>${safe(code)}<\/script>`+
      `<script>setTimeout(function(){try{var m=(${ex.test})();parent.postMessage({k:"${key}",r:m},"*");}catch(e){parent.postMessage({k:"${key}",err:String(e&&e.message||e)},"*");}},60);<\/script>`;
    setTimeout(()=>fin({err:"TIMEOUT"}),3000);
  });
}

    <div><div class="eyebrow">${SUBJ[cat].full} ・ ${LV[state.lv]} ・ 実践 ・ ${cleared} / ${list.length} クリア</div><h2>コードを書いて練習</h2></div>
    <p class="note">${note}</p>
    <div class="exlist">${list.map((e,k)=>`<button class="exbtn ${store.write[e.id]?"done":""}" aria-pressed="${k===i}" data-wx="${k}" aria-label="問題${k+1}">${k+1}</button>`).join("")}</div>
    <div class="q">
      <p class="qt"><span class="qn">問題${i+1}</span>${md(ex.t)}</p>
      ${ex.html?`<div><div class="codehead"><span>${kind==="css"?"この HTML に CSS を当てます":"この HTML を JavaScript で操作します"}</span></div><pre><code>${esc(ex.html.replace(/\n?<style>[\s\S]*<\/style>/,""))}</code></pre></div>`:""}
      <label for="codein" class="tname" style="font-family:var(--f-body)">${lang}を入力</label>
      <textarea id="codein" spellcheck="false" autocapitalize="off" autocomplete="off">${esc(ex.starter||"")}</textarea>
      <div class="row">
        <button class="btn" id="wrun">実行して答え合わせ</button>
        <button class="btn ghost" id="whint">ヒント</button>
        <button class="btn ghost" id="wshow">答えを見る</button>
      </div>
      <div id="whintbox" class="fb" hidden>${md(ex.h)}</div>
      <div id="wansbox" hidden>${answerHTML(ex)}</div>
      <div id="wjudge" class="fb" hidden></div>
      ${kind==="js"?`<div id="wout"></div>`:`<div><div class="codehead"><span>プレビュー</span></div><iframe id="pv" class="pv" title="プレビュー"></iframe></div><div id="wout"></div>`}
    </div>`;
  const ta=$("#codein"),j=$("#wjudge");
  $("#panel").querySelectorAll("[data-wx]").forEach(b=>b.addEventListener("click",()=>{wIdx[wk]=+b.dataset.wx;renderWrite();}));
  $("#whint").addEventListener("click",()=>$("#whintbox").hidden=!$("#whintbox").hidden);
  $("#wshow").addEventListener("click",()=>$("#wansbox").hidden=!$("#wansbox").hidden);
  ta.addEventListener("keydown",e=>{if(e.key==="Tab"&&!e.shiftKey){e.preventDefault();const s=ta.selectionStart;ta.setRangeText("  ",s,ta.selectionEnd,"end");ta.dispatchEvent(new Event("input"));}});
  const say=(ok,msg)=>{j.hidden=false;j.innerHTML=`<strong class="${ok?"ok":"ng"}">${ok?"正解！":"もう少し"}</strong> ${md(msg)}`;};
  const clear=()=>{if(!store.write[ex.id]){store.write[ex.id]=true;save();const b=$(`[data-wx="${i}"]`);b&&b.classList.add("done");}};
  const mustFail=code=>{for(const [re,msg] of (ex.must||[])){if(!re.test(code))return msg;}return "";};

  if(kind==="html"||kind==="css"){
    const pv=$("#pv");let t;
    pv.setAttribute("sandbox","allow-same-origin");
    const doc=()=>kind==="css"?PV_BASE+"<style>"+ta.value+"</style>"+ex.html:PV_BASE+ta.value;
    const show=after=>{pv.onload=after?()=>after(pv.contentDocument,pv.contentWindow):null;pv.srcdoc=doc();};
    show();
    ta.addEventListener("input",()=>{clearTimeout(t);t=setTimeout(()=>show(),300);});
    $("#wrun").addEventListener("click",()=>{
      if(!ta.value.trim()){say(false,"コードを書いてから実行しましょう。");return;}
      show((d,w)=>{let m;try{m=ex.check(d,w);}catch(e){m="うまくチェックできませんでした。書き方を見直してみましょう。";}
        if(m)say(false,m);else{say(true,"期待どおりに書けています。");clear();}});
    });
  }else if(kind==="dom"){
    const pv=$("#pv");
    pv.setAttribute("sandbox","allow-scripts");
    pv.srcdoc=PV_BASE+ex.html;
    $("#wrun").addEventListener("click",async()=>{
      const code=ta.value,out=$("#wout");
      if(!code.trim()){say(false,"コードを書いてから実行しましょう。");return;}
      out.innerHTML="";
      const r=await runDOM(ex,code,pv);
      if(r.err==="TIMEOUT"){say(false,"結果を確かめられませんでした。無限ループになっていないか確認しましょう。");return;}
      if(r.err){say(false,"エラーが出ています。セレクタの書き間違いや `( )` `{ }` `\"` の閉じ忘れを見直しましょう。");out.innerHTML=`<pre class="console"><span class="err">${esc(r.err)}</span></pre>`;return;}
      const mf=mustFail(code); if(mf){say(false,mf);return;}
      if(r.r) say(false,r.r); else {say(true,"正しく動きました。プレビューでも試してみましょう。");clear();}
    });
  }else{
    $("#wrun").addEventListener("click",async()=>{
      const code=ta.value,out=$("#wout");
      if(!code.trim()){say(false,"コードを書いてから実行しましょう。");return;}
      out.innerHTML=`<p class="note">実行中…</p>`;
      const r=await runJS(code);
      const lines=r.out||[];
      out.innerHTML=`<div class="codehead"><span>Console の表示</span></div><pre class="console">${lines.length?lines.map(esc).join("\n"):"（何も表示されていません）"}${r.err&&r.err!=="TIMEOUT"?`\n<span class="err">${esc(r.err)}</span>`:""}</pre>`;
      if(r.err==="TIMEOUT"){say(false,"2秒以上終わらなかったので止めました。繰り返しの条件が終わらない（無限ループ）になっていないか確認しましょう。");return;}
      if(r.err){say(false,"エラーが出ています。スペルや `( )` `{ }` `\"` の閉じ忘れを見直すと見つかることが多いです。");return;}
      const mf=mustFail(code); if(mf){say(false,mf);return;}
      const ans=await runJS(ex.a),norm=a=>a.map(s=>s.trim()).join("\n");
      if(norm(lines)===norm(ans.out||[])){say(true,"期待どおりの結果が表示されました。");clear();}
      else say(false,`表示された結果が答えと違います。正しい結果は「${(ans.out||[]).join(" / ")}」です。`);
    });
  }
}

/* ===== SQLを書いて練習 ===== */
const SETUP=`
CREATE TABLE members (id INTEGER PRIMARY KEY, name TEXT, age INTEGER, city TEXT);
INSERT INTO members VALUES ${MEM.map(r=>`(${r[0]},'${r[1]}',${r[2]},'${r[3]}')`).join(",")};
CREATE TABLE orders (id INTEGER PRIMARY KEY, member_id INTEGER, item TEXT, price INTEGER, order_date TEXT);
INSERT INTO orders VALUES
 (1,1,'コーヒー豆',1200,'2026-09-01'),(2,2,'マグカップ',1800,'2026-09-03'),
 (3,1,'ドリッパー',2500,'2026-09-10'),(4,4,'コーヒー豆',1200,'2026-09-12'),
 (5,3,'紅茶セット',1500,'2026-09-20'),(6,2,'コーヒー豆',1200,'2026-09-25'),
 (7,6,'マグカップ',1800,'2026-10-02');
`;
let SQL=null, sqlLoading=null;
const sqlIdx={};
function loadSQL(){
  if(SQL) return Promise.resolve(SQL);
  if(sqlLoading) return sqlLoading;
  sqlLoading=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-asm.js";
    s.onload=()=>initSqlJs().then(m=>{SQL=m; res(m);},rej);
    s.onerror=()=>{sqlLoading=null;rej(new Error("load"));};
    document.head.appendChild(s);
  });
  return sqlLoading;
}
function freshDB(){const db=new SQL.Database(); db.run(SETUP); return db;}
function tableHTML(r){
  if(!r) return `<p class="note">結果は0行でした。</p>`;
  return `<div class="tbl"><table><thead><tr>${r.columns.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${r.values.map(row=>`<tr>${row.map(v=>`<td>${v===null?"NULL":esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div><small style="color:var(--muted)">${r.values.length} 行</small>`;
}
function runQ(db,q){const res=db.exec(q); return res.length?res[res.length-1]:null;}
function runSet(q,after){const db=freshDB(); let r=runQ(db,q); if(after) r=runQ(db,after); return r;}
function norm(r,ordered){
  if(!r) return "[]";
  const rows=r.values.map(row=>JSON.stringify(row.map(v=>v===null?null:String(v))));
  if(!ordered) rows.sort();
  return rows.join("|");
}
function renderSQL(){
  const list=SQLW[state.lv];
  const cleared=list.filter(e=>store.sql[e.i]).length;
  $("#panel").innerHTML=`
    <div><div class="eyebrow">データベース ・ ${LV[state.lv]} ・ 実践 ・ ${cleared} / ${list.length} クリア</div><h2>SQLを書いて練習</h2></div>
    <p class="note">ブラウザの中で本物のデータベース（SQLite）が動きます。MySQLとほぼ同じ書き方ですが、一部の関数や型は違います。何を実行しても、問題ごとにデータは元に戻ります。</p>
    <div id="sqlbox"><p class="note">データベースを準備しています…</p></div>`;
  loadSQL().then(drawSQL).catch(()=>{
    $("#sqlbox").innerHTML=`<p class="note">データベースの読み込みに失敗しました。通信状況を確認して、ページを開き直してください。</p>`;
  });
}
function drawSQL(){
  const list=SQLW[state.lv],lv=state.lv;
  if(sqlIdx[lv]==null) sqlIdx[lv]=0;
  const k=sqlIdx[lv],ex=list[k];
  $("#sqlbox").innerHTML=`
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="exlist">${list.map((e,i)=>`<button class="exbtn ${store.sql[e.i]?"done":""}" aria-pressed="${i===k}" data-ex="${i}" aria-label="問題${i+1}">${i+1}</button>`).join("")}</div>
      <div class="q">
        <p class="qt"><span class="qn">問題${k+1}</span>${md(ex.t)}</p>
        <label for="sqlin" class="tname" style="font-family:var(--f-body)">SQLを入力</label>
        <textarea id="sqlin" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="例）SELECT * FROM members;"></textarea>
        <div class="row">
          <button class="btn" id="run">実行して答え合わせ</button>
          <button class="btn ghost" id="hint">ヒント</button>
          <button class="btn ghost" id="show">答えを見る</button>
        </div>
        <div id="hintbox" class="fb" hidden>${md(ex.h)}</div>
        <div id="ansbox" hidden>${answerHTML(ex)}</div>
        <div id="judge" class="fb" hidden></div>
        <div id="out"></div>
      </div>
      <details>
        <summary>使えるテーブルの中身を見る（members / orders）</summary>
        <div style="display:flex;flex-direction:column;gap:6px;margin-top:10px">
          <p class="tname">members（会員）</p>${tableHTML(runQ(freshDB(),"SELECT * FROM members"))}
          <p class="tname">orders（注文）</p>${tableHTML(runQ(freshDB(),"SELECT * FROM orders"))}
        </div>
      </details>
    </div>`;
  $("#sqlbox").querySelectorAll("[data-ex]").forEach(b=>b.addEventListener("click",()=>{sqlIdx[lv]=+b.dataset.ex; drawSQL();}));
  $("#hint").addEventListener("click",()=>$("#hintbox").hidden=!$("#hintbox").hidden);
  $("#show").addEventListener("click",()=>$("#ansbox").hidden=!$("#ansbox").hidden);
  const ta=$("#sqlin");
  ta.addEventListener("keydown",e=>{if(e.key==="Tab"&&!e.shiftKey){e.preventDefault();const s=ta.selectionStart;ta.setRangeText("  ",s,ta.selectionEnd,"end");}});
  $("#run").addEventListener("click",()=>{
    const q=ta.value.trim(), out=$("#out"), j=$("#judge");
    const say=(ok,msg)=>{j.hidden=false;j.innerHTML=`<strong class="${ok?"ok":"ng"}">${ok?"正解！":"もう少し"}</strong> ${md(msg)}`;};
    if(!q){say(false,"SQLを書いてから実行しましょう。"); return;}
    let mine;
    try{mine=runSet(q,ex.after);}catch(err){
      say(false,"SQLの書き方を確認しましょう。スペルや , ' ; を見直すと見つかることが多いです。");
      out.innerHTML=`<p class="err">${esc(err.message)}</p>`; return;
    }
    out.innerHTML=(ex.after?`<p class="sub">実行後に <code>${esc(ex.after)}</code> で確認した結果：</p>`:"")+tableHTML(mine);
    for(const [re,msg] of (ex.must||[])){if(!re.test(q)){say(false,msg);return;}}
    const ok=norm(mine,ex.ordered)===norm(runSet(ex.a,ex.after),ex.ordered);
    if(ok){say(true,"期待どおりの結果が出ました。"); if(!store.sql[ex.i]){store.sql[ex.i]=true; save(); const b=$(`[data-ex="${k}"]`); b&&b.classList.add("done");}}
    else say(false,"結果が答えと違います。列や条件、並び順を見直してみましょう。");
  });
}

/* ===== 画面の切り替え ===== */
function render(){
  if(!T[state.cat][state.lv]) state.lv=0;
  if(typeof state.view==="number"&&!T[state.cat][state.lv][state.view]) state.view=0;
  store.last=state; save();
  refreshNav();
  if(state.view==="mix") renderMix();
  else if(state.view==="write") renderWrite();
  else if(state.view==="miss") renderMiss();
  else if(state.view==="tips") renderTips();
  else if(state.view==="fill") renderFill();
  else if(state.view==="gloss") renderGloss();
  else if(state.view==="codes") renderCodes();
  else renderTopic();
  hideGl();
}
$("#cats").addEventListener("click",e=>{const b=e.target.closest("[data-cat]"); if(!b) return; state={cat:b.dataset.cat,lv:state.lv,view:0}; render();});
$("#lvs").addEventListener("click",e=>{const b=e.target.closest("[data-lv]"); if(!b) return; state={cat:state.cat,lv:+b.dataset.lv,view:["write","miss","tips","fill","gloss","codes"].includes(state.view)?state.view:0}; render();});
$("#banner").addEventListener("click",e=>{
  const g=e.target.closest("[data-golv]"); if(g){state={cat:state.cat,lv:+g.dataset.golv,view:0}; render(); window.scrollTo({top:0,behavior:"smooth"}); return;}
  const m=e.target.closest("[data-go]"); if(m){state.view=m.dataset.go; render();}
});
$("#panel").addEventListener("click",e=>{const b=e.target.closest(".gl"); if(b) showGl(b.dataset.g);});
$("#glx").addEventListener("click",hideGl);
document.addEventListener("keydown",e=>{if(e.key==="Escape") hideGl();});
$("#chips").addEventListener("click",e=>{const b=e.target.closest("[data-view]"); if(!b) return; const v=b.dataset.view; state.view=isNaN(v)?v:+v; render();});
$("#panel").addEventListener("click",e=>{const b=e.target.closest("[data-go]"); if(!b) return; const v=b.dataset.go; state.view=isNaN(v)?v:+v; render(); window.scrollTo({top:0,behavior:"smooth"});});
render();
</script>
