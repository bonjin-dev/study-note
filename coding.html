<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>コーディング練習帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Source+Code+Pro:wght@400;600&display=swap">
<style>
/* Layout: 1カラムのノート。科目タブ → レベル切り替え → 項目チップ → 本文（解説→コード→クイズ） */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#e9edf3; --fg:#1d2433; --muted:#5d6779; --line:#d5dbe5;
  --ok:#1f8a4c; --ok-bg:#e3f4ea; --ng:#c23b3b; --ng-bg:#fbe8e8;
  --c-html:#d4501f; --c-css:#2d68cf; --c-js:#a87b00; --c-db:#0f8273;
  --code-bg:#1f2633; --code-fg:#e7ecf4;
  --f-display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-code:"Source Code Pro",ui-monospace,Menlo,Consolas,monospace;
  --accent:var(--c-html);
  --preview-bg:#ffffff; /* プレビューは常に白い紙として表示 */
  --dg-1:#2d68cf; --dg-2:#d4501f; --dg-hl:#fff3cf; /* 図：JOINの色分け・行の強調 */
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141922; --surface:#1c2330; --surface-2:#252e3e; --fg:#e6ebf3; --muted:#9aa5b8; --line:#323c4f;
  --ok:#5fd18f; --ok-bg:#173426; --ng:#f08080; --ng-bg:#3a1f22;
  --c-html:#ff8a5c; --c-css:#7aa7ff; --c-js:#f0c94a; --c-db:#4fd0bd;
  --code-bg:#0e1219; --code-fg:#e7ecf4; --dg-1:#5b8ff0; --dg-2:#e8794b; --dg-hl:#3a3420; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141922; --surface:#1c2330; --surface-2:#252e3e; --fg:#e6ebf3; --muted:#9aa5b8; --line:#323c4f;
  --ok:#5fd18f; --ok-bg:#173426; --ng:#f08080; --ng-bg:#3a1f22;
  --c-html:#ff8a5c; --c-css:#7aa7ff; --c-js:#f0c94a; --c-db:#4fd0bd;
  --code-bg:#0e1219; --code-fg:#e7ecf4; --dg-1:#5b8ff0; --dg-2:#e8794b; --dg-hl:#3a3420; color-scheme:dark}

[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.75}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
header h1{font-family:var(--f-display);font-weight:800;font-size:1.6rem;margin:0;letter-spacing:.02em;text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted);font-size:.9rem}

.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{font:inherit;color:var(--fg);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.cat b{font-family:var(--f-display);font-size:1.05rem;line-height:1.2}
.cat small{color:var(--muted);font-size:.72rem;font-variant-numeric:tabular-nums}
.cat .bar{width:80%;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.cat .bar i{display:block;height:100%;background:var(--c)}
.cat[aria-selected="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.cat[aria-selected="true"] b{color:var(--c)}

.lvs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);border-radius:12px;padding:4px}
.lv{font:inherit;border:0;background:transparent;border-radius:9px;padding:6px 4px;cursor:pointer;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.lv b{font-family:var(--f-display);font-size:.95rem;color:var(--fg);line-height:1.4}
.lv small{font-size:.72rem;font-variant-numeric:tabular-nums}
.lv[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 3px color-mix(in srgb,var(--fg) 18%,transparent)}
.lv[aria-selected="true"] b{color:var(--accent)}

.cat:focus-visible,.lv:focus-visible,.chip:focus-visible,.choice:focus-visible,.btn:focus-visible,.exbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.88rem;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--surface-2)}
.chip .dot.done{background:var(--ok)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chip.special{border-style:dashed;border-color:var(--accent);color:var(--accent);font-weight:700}
.chip.special[aria-pressed="true"]{color:var(--surface);border-style:solid}
.chip.miss{border-color:var(--ng);color:var(--ng);font-weight:700}
.chip.miss[aria-pressed="true"]{background:var(--ng);border-color:var(--ng);color:var(--surface)}
.chip .cnt{font-variant-numeric:tabular-nums}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.eyebrow{font-size:.75rem;letter-spacing:.12em;color:var(--accent);font-weight:700}
.panel h2{font-family:var(--f-display);font-size:1.35rem;margin:0;line-height:1.4;text-wrap:balance}
.panel h3{font-family:var(--f-display);font-size:1.05rem;margin:8px 0 0;display:flex;align-items:center;gap:8px}
.panel h3::before{content:"";width:6px;height:1.1em;border-radius:3px;background:var(--accent)}
.lead p{margin:0 0 .6em;max-width:65ch}
.sub{margin:0;color:var(--muted);font-size:.9rem}
code{font-family:var(--f-code);font-size:.9em;background:var(--surface-2);padding:1px 5px;border-radius:5px;word-break:break-word}
pre{margin:0;background:var(--code-bg);color:var(--code-fg);border-radius:10px;padding:14px 16px;overflow-x:auto;font-family:var(--f-code);font-size:.86rem;line-height:1.6}
pre code{background:none;padding:0;font-size:inherit;word-break:normal;color:inherit}
.codehead{display:flex;justify-content:space-between;align-items:center;font-size:.75rem;color:var(--muted);margin-bottom:4px}

.q{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.q .qt{font-weight:700;margin:0}
.q .qn{color:var(--accent);font-family:var(--f-display);margin-right:6px}
.qlabel{font-size:.75rem;color:var(--muted);margin:0}
.tag{display:inline-block;font-size:.72rem;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 8px;margin-right:6px;vertical-align:2px}
.choices{display:grid;gap:8px}
.choice{font:inherit;text-align:left;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;line-height:1.5;min-width:0}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice:disabled{cursor:default}
.choice.right{background:var(--ok-bg);border-color:var(--ok);color:var(--fg)}
.choice.wrong{background:var(--ng-bg);border-color:var(--ng)}
.fb{font-size:.92rem;border-radius:8px;padding:8px 12px;background:var(--surface-2)}
.fb strong.ok{color:var(--ok)} .fb strong.ng{color:var(--ng)}
.why{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.why b{color:var(--ng)}
.why.small{color:var(--muted);font-size:.82rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-weight:700;font-size:.9rem;border-radius:10px;padding:8px 16px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.score{font-family:var(--f-display);font-size:1.1rem}
.empty{text-align:center;padding:24px 12px;color:var(--muted)}
.empty b{display:block;font-family:var(--f-display);color:var(--fg);font-size:1.1rem;margin-bottom:4px}

/* 書いて練習 */
.note{font-size:.85rem;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 12px;margin:0}
textarea{width:100%;box-sizing:border-box;min-height:120px;font-family:var(--f-code);font-size:.92rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;line-height:1.5}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;max-height:320px}
table{border-collapse:collapse;width:100%;font-size:.86rem;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--surface-2);font-family:var(--f-code);font-weight:600;position:sticky;top:0}
.tname{font-family:var(--f-code);font-weight:600;font-size:.85rem;margin:4px 0}
.exlist{display:flex;flex-wrap:wrap;gap:6px}
.exbtn{font:inherit;font-size:.82rem;width:2.2em;height:2.2em;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;font-variant-numeric:tabular-nums}
.exbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--surface)}
.exbtn.done{border-color:var(--ok);color:var(--ok)}
.exbtn.done[aria-pressed="true"]{background:var(--ok);color:var(--surface)}
.err{color:var(--ng);font-family:var(--f-code);font-size:.85rem;white-space:pre-wrap}
.pv{width:100%;box-sizing:border-box;height:200px;border:1px solid var(--line);border-radius:10px;background:var(--preview-bg)}
pre.console{white-space:pre-wrap;word-break:break-word}
pre.console .err{color:var(--ng)}
/* 図 */
.fig{margin:0;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg);min-width:0;overflow-x:auto}
.fig figcaption{font-size:.84rem;color:var(--muted);line-height:1.6}
.fig .ft{font-size:.72rem;letter-spacing:.12em;color:var(--accent);font-weight:700}
.dg-box{border:1.5px solid var(--fg);border-radius:8px;padding:6px 10px 10px;min-width:0}
.dg-dash{border-style:dashed;border-color:var(--muted)}
.dg-acc{border-color:var(--accent)}
.dg-soft{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.dg-lbl{display:block;font-family:var(--f-code);font-size:.75rem;font-weight:600}
.dg-acc>.dg-lbl{color:var(--accent)}
.dg-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.dg-chip{font-family:var(--f-code);font-size:.78rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin-top:6px}
.dg-note{display:block;font-size:.75rem;color:var(--muted);margin-top:6px;line-height:1.4}
.dg-cap{font-size:.78rem;font-weight:700;margin-bottom:4px}
.dg-bar{border:1.5px solid var(--fg);border-radius:6px;padding:2px 8px;margin-top:6px;font-family:var(--f-code);font-size:.78rem}
.dg-line{font-size:.9rem;line-height:2;border:1.5px dashed var(--muted);border-radius:6px;padding:4px 8px}
.dg-inl{border:1.5px solid var(--accent);color:var(--accent);border-radius:4px;padding:0 4px;font-family:var(--f-code);font-size:.75rem}
.dg-row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:.78rem}
.dg-arrow{color:var(--muted);font-weight:700;font-size:.8rem}
.fig table.dg-table{width:auto;border-collapse:separate;border-spacing:0;font-size:.82rem}
.fig .dg-table th,.fig .dg-table td{border:1px solid var(--line);padding:4px 8px;position:static;white-space:nowrap;background:var(--surface)}
.fig .dg-table th{background:var(--surface-2)}
.fig .dg-table small{display:block;font-family:var(--f-code);font-size:.68rem;color:var(--muted);font-weight:400}
.fig .dg-table td.dg-side{border:0;background:none;color:var(--muted);font-size:.72rem;font-family:var(--f-code)}
.fig .dg-table .hl td{background:var(--dg-hl)}
.fig .dg-table .pk{font-weight:700;color:var(--accent)}
.fig .dg-table .dup{background:var(--ng-bg)}
.swatch{display:inline-block;width:.9em;height:.9em;border-radius:3px;vertical-align:-1px;margin-right:4px}
.bm{border-radius:8px;padding:6px 12px 12px}
.bm-m{border:1.5px dashed var(--muted)}
.bm-b{border:3px solid var(--fg);margin-top:4px}
.bm-p{background:color-mix(in srgb,var(--accent) 14%,var(--surface));margin-top:4px}
.bm-c{border:1.5px solid var(--accent);background:var(--surface);text-align:center;padding:10px;margin-top:6px;font-family:var(--f-code);font-size:.8rem}
.fx{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.fx-box{border:2px solid var(--fg);border-radius:8px;padding:6px 10px 10px}
.fx-items{display:flex;gap:10px;align-items:center;margin-top:6px}
.fx-i{border:1.5px solid var(--accent);background:var(--surface);border-radius:6px;width:44px;display:flex;align-items:center;justify-content:center;font-family:var(--f-code);font-size:.8rem}
.fx-v{display:flex;flex-direction:column;align-items:center;font-size:.72rem;color:var(--muted);text-align:center;line-height:1.3}
.fx-v span,.fx-h span{color:var(--accent);font-size:1.2rem;font-weight:700}
.fx-h{font-size:.75rem;color:var(--muted)}
.ps{position:relative;border:2px solid var(--fg);border-radius:8px;padding:10px 10px 8px;min-height:100px;display:flex;flex-direction:column;justify-content:space-between}
.ps-badge{position:absolute;top:0;right:0;background:var(--accent);color:var(--surface);border-radius:0 6px 0 8px;padding:4px 10px;font-family:var(--f-code);font-size:.72rem;text-align:center;line-height:1.4}
.ps-text{font-size:.85rem;color:var(--muted);padding-right:110px}
.gd{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border:1.5px dashed var(--muted);border-radius:8px;padding:8px}
.gd-i{border:1.5px solid var(--fg);background:var(--surface);border-radius:6px;text-align:center;padding:6px 4px;font-family:var(--f-code);font-size:.75rem;min-width:0}
.gd-w{grid-column:span 2;border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.gd-ruler{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 10px;font-family:var(--f-code);font-size:.72rem;color:var(--accent);text-align:center}
.gd-ruler span{border-top:2px solid var(--accent);padding-top:2px}
.arr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:2px solid var(--fg);border-radius:8px;overflow:hidden}
.arr-c{display:flex;flex-direction:column;align-items:center;padding:8px 4px;border-right:1px solid var(--line);background:var(--surface);font-size:.85rem;min-width:0}
.arr-c:last-child{border-right:0}
.arr-c small{font-family:var(--f-code);color:var(--accent);font-weight:600}
.dg-mono{font-family:var(--f-code);font-size:.78rem;overflow-wrap:anywhere}
.fl{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.fl-q{border:2px solid var(--accent);border-radius:999px;padding:3px 14px;font-family:var(--f-code);font-size:.8rem;color:var(--accent);font-weight:600}
.fl-br{display:flex;align-items:center;gap:8px;margin-left:24px;flex-wrap:wrap}
.fl-y{font-size:.75rem;color:var(--ok);font-weight:700}
.fl-n{font-size:.75rem;color:var(--muted);font-weight:700;margin-left:24px}
.fl-r{border:1.5px solid var(--fg);border-radius:6px;padding:2px 10px;font-family:var(--f-code);font-size:.8rem;background:var(--surface)}
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.st{border:1.5px solid var(--fg);border-radius:8px;padding:6px 10px;font-size:.8rem;background:var(--surface);line-height:1.4;max-width:15em}
.st b{display:block;font-family:var(--f-code);font-size:.72rem;color:var(--accent)}
.id1,.id2{display:inline-block;min-width:1.4em;text-align:center;border-radius:4px;color:var(--surface);font-weight:700;font-family:var(--f-code)}
.id1{background:var(--dg-1)} .id2{background:var(--dg-2)}
.jn{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.jn-mid{font-family:var(--f-code);font-size:.72rem;color:var(--accent);text-align:center;line-height:1.5}
.tx-split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tx-ok,.tx-ng{border-radius:8px;padding:8px 10px;font-size:.82rem;line-height:1.5;border:1.5px solid}
.tx-ok{border-color:var(--ok);background:var(--ok-bg)} .tx-ok b{color:var(--ok)}
.tx-ng{border-color:var(--ng);background:var(--ng-bg)} .tx-ng b{color:var(--ng)}
.tx-split small{color:var(--muted)}
@media (max-width:420px){.dg-cols,.tx-split{grid-template-columns:1fr}.ps-text{padding-right:0;padding-top:40px}}

/* 答えの1行ずつ解説 */
.ax{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:8px}
.ax-r{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:4px 14px;padding:6px 12px;border-bottom:1px solid var(--line);align-items:start}
.ax-r:last-child{border-bottom:0}
.ax-c{display:block;white-space:pre;overflow-x:auto;background:none;padding:0;font-size:.82rem;color:var(--fg)}
.ax-t{font-size:.82rem;color:var(--muted);line-height:1.5}
.ax-h{font-size:.75rem;font-weight:700;color:var(--accent);background:var(--surface-2)}
.ax-sum{font-size:.85rem;margin-top:8px}
@media (max-width:520px){.ax-r{grid-template-columns:1fr}}

/* よくあるまちがい */
.mk{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mk h3{margin:0}
.mk-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mk-pair>div{min-width:0}
.mk-tag{display:inline-block;font-size:.72rem;font-weight:700;padding:0 8px;border-radius:999px;margin-bottom:4px}
.mk-bad .mk-tag{background:var(--ng-bg);color:var(--ng)}
.mk-good .mk-tag{background:var(--ok-bg);color:var(--ok)}
.mk-bad pre{box-shadow:inset 4px 0 0 var(--ng)}
.mk-good pre{box-shadow:inset 4px 0 0 var(--ok)}
.mk p{margin:0;font-size:.9rem}
@media (max-width:560px){.mk-pair{grid-template-columns:1fr}}
.chip.tips{border-style:dashed;border-color:var(--muted);color:var(--fg);font-weight:700}
.chip.tips[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--surface)}

/* 動かして確かめる */
.play{border:1.5px solid var(--accent);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.play .ft{font-size:.72rem;letter-spacing:.12em;color:var(--accent);font-weight:700}
.pl-ctrls{display:flex;flex-direction:column;gap:8px}
.pl-c{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.pl-l{font-family:var(--f-code);font-size:.78rem;font-weight:600;min-width:9em}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{font:inherit;font-family:var(--f-code);font-size:.76rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:3px 8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.pl-stage{border:1.5px dashed var(--muted);border-radius:8px;padding:10px;background:var(--bg);min-width:0;overflow:hidden}
.pl-code{font-size:.8rem}
.pl-i{border:1.5px solid var(--accent);background:var(--surface);border-radius:6px;min-width:44px;padding:4px 8px;display:flex;align-items:center;justify-content:center;font-family:var(--f-code);font-size:.8rem}
.pl-flex{min-height:150px}
.pl-grid .pl-i{min-width:0}
.pl-bmo{border:1.5px dashed var(--muted);display:flow-root;width:fit-content;max-width:100%}
.pl-bmbox{background:color-mix(in srgb,var(--accent) 14%,var(--surface));font-family:var(--f-code);font-size:.8rem}

const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

[
 {title:"HTMLの基本構造",body:"HTMLは「タグ」で文章に意味をつける言語です。どのページも同じ骨組みから始まります。\n`<head>` にはページの設定（タイトルや文字コード）を書き、画面に表示される中身はすべて `<body>` の中に書きます。",
  code:`<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>はじめてのページ</title>
</head>

  <h1>こんにちは</h1>

  quiz:[
   {id:"html-0-0",q:"画面に表示される内容を書くタグはどれ？",c:["`<head>`","`<body>`","`<title>`","`<meta>`","`<style>`","`<link>`","`<script>`"],a:1,e:"表示される中身は `<body>` に書きます。`<head>` は設定用です。"},
   {id:"html-0-1",q:"ブラウザのタブに表示される文字を決めるタグは？",c:["`<h1>`","`<header>`","`<title>`","`<p>`","`<head>`","`<meta>`","`<tab>`"],a:2,e:"`<title>` は `<head>` の中に書き、タブや検索結果に表示されます。",w:{0:"`<h1>` はページの中に表示される一番大きな見出しです。",4:"`<head>` は設定を書く場所そのもので、タブの文字は中の `<title>` で決めます。"}},
   {id:"html-0-2",q:"`<meta charset=\"UTF-8\">` の役割は？",c:["文字化けを防ぐ（文字コードの指定）","文字を大きくする","画像を表示する","ページを速くする","ページを日本語に翻訳する","フォントを指定する","スマホ対応にする"],a:0,e:"文字コードを指定して、日本語が正しく表示されるようにします。",w:{1:"文字の大きさはCSSの `font-size` で指定します。",2:"画像は `<img>` タグで表示します。",3:"表示の速さとは関係ありません。",4:"翻訳はしません。文字の読み方（文字コード）を伝えるだけです。",5:"フォントはCSSの `font-family` で指定します。",6:"スマホ対応は viewport の meta タグやCSSで行います。"}},
   {id:"html-0-3",q:"ファイルの1行目に書く `<!DOCTYPE html>` の役割は？",c:["このファイルがHTML5で書かれていることを宣言する","ページのタイトルを決める","文字コードを指定する","CSSを読み込む","JavaScriptを動かす","ページを非公開にする","コメントを書く"],a:0,e:"ブラウザに「HTML5の文書です」と伝える宣言です。必ず1行目に書きます。",w:{1:"タイトルは `<title>` で決めます。",2:"文字コードは `<meta charset=\"UTF-8\">` で指定します。",3:"CSSは `<link rel=\"stylesheet\">` で読み込みます。"}},
   {id:"html-0-4",q:"`<html lang=\"ja\">` の `lang=\"ja\"` は何を表す？",c:["ページの言語が日本語であること","日本でしか見られないこと","文字を大きくすること","日本時間で表示すること","ページの作成者","ファイルの保存場所","JavaScriptの言語設定"],a:0,e:"ページの言語を伝えます。読み上げソフトや翻訳機能が正しく動くために使われます。"}
  ]},
 {title:"見出しと段落",body:"見出しは `<h1>`〜`<h6>` で、数字が小さいほど大きな見出しです。`<h1>` はページの一番大事なタイトルなので、基本は1ページに1つにします。\n文章のまとまり（段落）は `<p>` で囲みます。文字の大きさを変えたいだけなら、見出しタグではなくCSSを使います。",
  code:`<h1>カフェの紹介</h1>

   {id:"html-1-1",q:"`<h1>` の使い方として正しいのは？",c:["文字を大きくしたい所に何回でも使う","ページの一番大事な見出しとして基本1つ使う","段落の代わりに使う","使ってはいけない","フッターの文字に使う","画像の代わりに使う","`<head>` の中に書く"],a:1,e:"見出しは見た目ではなく「意味」で選びます。大きさはCSSで調整します。",w:{0:"見出しタグは見た目ではなく意味で選びます。大きさはCSSで変えます。",2:"段落は `<p>` で書きます。",3:"`<h1>` はページの主題を表す大切なタグです。",4:"フッターは `<footer>` で囲み、文字は `<p>` などで書きます。",5:"画像は `<img>` で表示します。",6:"`<head>` には設定を書きます。見出しは `<body>` の中です。"}},
   {id:"html-1-2",q:"`<p>` の中で改行だけしたいときに使うタグは？",c:["`<br>`","`<p>`","`<hr>`","`<nl>`","`<line>`","`<span>`","`<ret>`"],a:0,e:"`<br>` は改行です。閉じタグはありません。段落を分けるなら `<p>` を分けます。"},
   {id:"html-1-3",q:"見出しタグの使い方として正しいのは？",c:["`<h1>` → `<h2>` → `<h3>` のように階層の順に使う","`<h3>` から始めて `<h1>` で終わる","好きな順番でよい","`<h6>` が一番大きな見出し","1ページに `<h2>` は1つだけ","`<h1>` の中に `<h2>` を入れる","見出しは `<h1>` しか使えない"],a:0,e:"大見出し `<h1>` の下に `<h2>`、その下に `<h3>` …と階層の順に使います。",w:{3:"数字が小さいほど大きな見出しです。`<h1>` が一番大きく、`<h6>` が一番小さいです。",4:"`<h2>` は何個使ってもかまいません。基本1つにするのは `<h1>` です。",5:"見出しの中に見出しは入れません。順番に並べます。"}},
   {id:"html-1-4",q:"話題の区切りを表す横線を引くタグは？",c:["`<hr>`","`<br>`","`<line>`","`<border>`","`<p>`","`<span>`","`<div>`"],a:0,e:"`<hr>` は話題の区切りを表し、横線として表示されます。閉じタグはありません。"}

 {title:"リンクと画像",body:"リンクは `<a>` タグで作り、行き先を `href` 属性に書きます。\n画像は `<img>` タグで表示し、ファイルの場所を `src`、画像の説明を `alt` に書きます。`alt` は画像が表示されないときや、読み上げソフトで使われる大事な属性です。`<img>` は閉じタグがありません。",

   {id:"html-2-1",q:"`alt` 属性に書くのは？",c:["画像のファイル名","画像の説明文","画像の大きさ","リンク先","画像の色","画像の撮影日","画像の表示位置"],a:1,e:"画像の内容を言葉で説明します。アクセシビリティやSEOにも関係します。",w:{0:"ファイルの場所は `src` に書きます。",2:"大きさは `width`・`height` 属性かCSSで指定します。",3:"リンク先は `<a>` の `href` に書きます。"}},
   {id:"html-2-2",q:"リンクを新しいタブで開く書き方は？",c:["`target=\"_blank\"`","`new=\"tab\"`","`open=\"new\"`","`href=\"_blank\"`","`tab=\"new\"`","`window=\"_blank\"`","`rel=\"new\"`"],a:0,e:"`<a>` に `target=\"_blank\"` をつけると新しいタブで開きます。",w:{3:"`href` は行き先のURLを書く属性です。"}},
   {id:"html-2-3",q:"`images` フォルダの中の `logo.png` を表示する正しい書き方は？",c:["`<img src=\"images/logo.png\" alt=\"ロゴ\">`","`<img href=\"images/logo.png\" alt=\"ロゴ\">`","`<img src=\"logo.png/images\" alt=\"ロゴ\">`","`<image src=\"images/logo.png\">`","`<img src=\"images\\logo.png\" alt=\"ロゴ\">`","`<img alt=\"images/logo.png\">`","`<a src=\"images/logo.png\">`"],a:0,e:"`フォルダ名/ファイル名` の順にスラッシュ `/` でつなぎます。画像の場所は `src` に書きます。",w:{1:"画像の場所は `href` ではなく `src` に書きます。",2:"フォルダ → ファイルの順に書きます。",3:"タグ名は `<img>` です。",4:"Webのパスはスラッシュ `/` で区切ります。",5:"`alt` は画像の説明文です。",6:"`<a>` はリンクのタグです。"}},
   {id:"html-2-4",q:"同じページの `id=\"access\"` の場所に移動するリンクは？",c:["`<a href=\"#access\">アクセス</a>`","`<a href=\"access\">アクセス</a>`","`<a href=\".access\">アクセス</a>`","`<a id=\"access\">アクセス</a>`","`<a href=\"access.html\">アクセス</a>`","`<a src=\"#access\">アクセス</a>`","`<a target=\"access\">アクセス</a>`"],a:0,e:"`href=\"#id名\"` と書くと、同じページのその場所へ移動します（ページ内リンク）。",w:{1:"`#` がないと access という名前のファイルを探してしまいます。",2:"`.` はCSSでクラスを表す記号です。ページ内リンクでは `#` を使います。",3:"`id` は移動先の側に付けます。",4:"これは別のファイル access.html へのリンクです。",5:"リンク先は `src` ではなく `href` です。"}}

   {id:"html-3-1",q:"リストの1項目を表すタグは？",c:["`<item>`","`<list>`","`<li>`","`<lt>`","`<ul>`","`<ol>`","`<il>`"],a:2,e:"list item の略で `<li>` です。"},
   {id:"html-3-2",q:"ナビゲーションメニューを作るときによく使う組み合わせは？",c:["`<nav>` の中に `<ul>` と `<li>`","`<table>` と `<tr>`","`<ol>` だけ","`<p>` を並べる","`<form>` と `<input>`","`<section>` と `<p>`","`<h1>` を並べる"],a:0,e:"メニュー項目は順番のないリストなので、`<ul>` と `<li>` で作るのが一般的です。",w:{1:"`<table>` は表形式のデータ用です。",4:"`<form>` は入力フォーム用です。"}},
   {id:"html-3-3",q:"`<ul>` の直接の子にしてよいタグは？",c:["`<li>`","`<p>`","`<div>`","`<span>`","`<a>`","`<h2>`","`<img>`"],a:0,e:"`<ul>`・`<ol>` の直下は `<li>` だけです。リンクなどは `<li>` の中に入れます。",w:{1:"`<li>` の中なら使えますが、`<ul>` の直下には置けません。",2:"`<li>` の中なら使えますが、`<ul>` の直下には置けません。",3:"`<li>` の中なら使えますが、`<ul>` の直下には置けません。",4:"`<li>` の中に入れれば使えます（`<li><a>…</a></li>`）。",5:"`<li>` の中なら使えますが、`<ul>` の直下には置けません。",6:"`<li>` の中なら使えますが、`<ul>` の直下には置けません。"}},
   {id:"html-3-4",q:"リストの中にリストを入れる（入れ子にする）正しい方法は？",c:["親の `<li>` の中に `<ul>` を入れる","`<ul>` の直下に `<ul>` を入れる","`<ul>` の後ろに続けて書く","`<li>` を2重にする","`<ol>` は入れ子にできない","`<ul>` を `<p>` で囲む","入れ子にはできない"],a:0,e:"子のリストは親の `<li>` の中に入れます。サブメニューなどで使います。",w:{1:"`<ul>` の直下に置けるのは `<li>` だけです。"}}
  ]},
 {title:"divとspan",body:"`<div>` と `<span>` はどちらも意味を持たない箱で、CSSでデザインするためのまとまりを作るときに使います。\n`<div>` はブロック要素で、横幅いっぱいに広がり前後で改行されます。`<span>` はインライン要素で、文章の一部だけを囲み、改行されません。`<p>` や `<h1>` はブロック要素、`<a>` や `<img>` はインライン要素です。\nデザイン用の名前は `class` で付けます。class は何度でも使えますが、`id` は1ページに1つだけです。",
  code:`<div class="card">
  <h3>ラテ</h3>
  <p>今月の<span class="red">おすすめ</span>はこちら</p>
</div>`,
  quiz:[
   {id:"html-6-0",q:"文章の一部の文字だけ色を変えたいとき、囲むのに向いているタグは？",c:["`<div>`","`<span>`","`<section>`","`<p>`","`<article>`","`<main>`","`<ul>`"],a:1,e:"`<span>` はインライン要素なので、文章の流れを崩さずに一部だけを囲めます。",w:{0:"`<div>` はブロック要素なので、囲むと前後で改行されてしまいます。"}},
   {id:"html-6-1",q:"ブロック要素の特徴は？",c:["前後で改行され、横幅いっぱいに広がる","文章の一部だけを囲む","画像専用","画面に表示されない","必ず太字になる","前後に余白が入らない","スクロールできるようになる"],a:0,e:"`<div>`・`<p>`・`<h1>` などは、前後で改行されて横幅いっぱいに広がります。",w:{1:"それはインライン要素（`<span>` など）の特徴です。"}},
   {id:"html-6-2",q:"次のうちインライン要素はどれ？",c:["`<div>`","`<p>`","`<a>`","`<h2>`"],a:2,e:"`<a>` は文章の中に置けるインライン要素です。"},
   {id:"html-6-3",q:"`<div>` と `<span>` の共通点は？",c:["どちらもそれ自体に意味を持たない","どちらも前後で改行される","どちらも文字を太くする","どちらも1ページに1つだけ","どちらも `<head>` の中に書く","どちらも閉じタグがない","どちらもリンクになる"],a:0,e:"どちらも意味を持たない箱です。違いはブロック要素（div）かインライン要素（span）かです。",w:{1:"改行されるのは `<div>` だけです。"}},
   {id:"html-6-4",q:"同じクラス名を複数の要素に付けるのは？",c:["何個でも付けてよい","1ページに1つだけ","2つまで","付けるとエラーになる","`<div>` にしか付けられない","id と同じ名前にしなければならない","`<head>` の中だけ"],a:0,e:"class は何度でも使えます。1ページに1つだけにするのは id です。",w:{1:"1ページに1つだけなのは `id` です。"}}
  ]},
 {title:"フォーム",body:"お問い合わせ欄などの入力部分は `<form>` の中に作ります。1行の入力欄は `<input>`、複数行は `<textarea>`、選択リストは `<select>`、送信ボタンは `<button>` です。\n`<label>` の `for` と入力欄の `id` を同じ名前にすると、ラベルをクリックしても入力欄が選ばれます。`<input>` は `type` で種類（text・email・password・radio・checkbox など）が変わります。",
  code:`<form>
  <label for="email">メールアドレス</label>
  <input type="email" id="email" name="email" required>

  <label for="plan">プラン</label>
  <select id="plan" name="plan">
    <option>ブレンド</option>
    <option>エスプレッソ</option>
  </select>

  <label for="msg">お問い合わせ内容</label>
  <textarea id="msg" name="msg"></textarea>

  <button type="submit">送信する</button>
</form>`,
  quiz:[
   {id:"html-4-0",q:"`<label for=\"email\">` と結びつく入力欄は？",c:["`name=\"email\"` の入力欄","`id=\"email\"` の入力欄","`type=\"email\"` の入力欄","すぐ下の入力欄なら何でも","`class=\"email\"` の入力欄","`for=\"email\"` の入力欄","`value=\"email\"` の入力欄"],a:1,e:"`for` は入力欄の `id` と同じ値にします。",w:{0:"`name` は送信されるデータの名前です。",2:"`type` は入力欄の種類です。",3:"`for` と `id` が一致した入力欄だけが結びつきます。",4:"`class` はデザイン用の名前で、label とは結びつきません。",5:"`for` は label の側に付ける属性です。",6:"`value` は入力欄に入っている値です。"}},
   {id:"html-4-1",q:"未入力のまま送信できないようにする属性は？",c:["`required`","`must`","`check`","`value`","`need`","`necessary`","`important`"],a:0,e:"`required` をつけるとブラウザが入力を求めてくれます。"},
   {id:"html-4-2",q:"入力した文字が●で隠れる入力欄の書き方は？",c:["`<input type=\"secret\">`","`<input type=\"password\">`","`<input type=\"hidden\">`","`<password>`","`<input type=\"private\">`","`<input type=\"mask\">`","`<input secret>`"],a:1,e:"`type=\"password\"` で入力文字が隠れます。",w:{2:"`hidden` は画面に表示されない入力欄です。",3:"`<password>` というタグはありません。`<input type=\"password\">` です。"}},
   {id:"html-4-3",q:"いくつかの選択肢から1つだけ選ばせる入力欄は？",c:["`<input type=\"radio\">`","`<input type=\"checkbox\">`","`<input type=\"text\">`","`<input type=\"one\">`","`<input type=\"select\">`","`<radio>`","`<input type=\"button\">`"],a:0,e:"ラジオボタンは同じ name のグループの中から1つだけ選べます。",w:{1:"checkbox は複数選べます。",2:"text は文字を入力する欄です。",4:"選択リストは `<select>` タグで作ります。",6:"button はボタンです。"}},
   {id:"html-4-4",q:"プルダウン（選択リスト）を作るタグの組み合わせは？",c:["`<select>` と `<option>`","`<list>` と `<item>`","`<ul>` と `<li>`","`<input>` と `<option>`","`<menu>` と `<li>`","`<dropdown>` と `<option>`","`<select>` と `<li>`"],a:0,e:"`<select>` の中に選択肢を `<option>` で並べます。",w:{2:"`<ul>` と `<li>` は箇条書きのリストです。"}}
  ]}
],

 {title:"セマンティック要素",body:"`<div>` は意味を持たない箱ですが、`<header>`・`<nav>`・`<main>`・`<section>`・`<article>`・`<aside>`・`<footer>` などは「ここは何の部分か」という意味を持ちます。\n意味のあるタグを使うと、検索エンジンや読み上げソフトがページの構造を理解しやすくなります。見た目は `<div>` と変わりません。",
  code:`<header>
  <nav>…メニュー…</nav>
</header>
<main>
  <section>
    <h2>サービス</h2>
  </section>
  <aside>…関連リンク…</aside>
</main>
<footer>&copy; 2026 My Cafe</footer>`,
  quiz:[
   {id:"html-5-0",q:"ページのメインの内容を囲むタグは？",c:["`<body>`","`<main>`","`<section>`","`<article>`","`<div>`","`<content>`","`<center>`"],a:1,e:"`<main>` はそのページ固有の主な内容を表し、1ページに1つ使います。",w:{0:"`<body>` は表示される部分全体で、ヘッダーやフッターも含みます。",2:"`<section>` は内容のまとまり（章）を表し、いくつも使えます。"}},
   {id:"html-5-1",q:"ナビゲーション（メニュー）を表すタグは？",c:["`<menu>`","`<nav>`","`<header>`","`<link>`","`<navi>`","`<ul>`","`<footer>`"],a:1,e:"navigation の略で `<nav>` です。"},
   {id:"html-5-2",q:"ページ下部の著作権表示などを入れるタグは？",c:["`<bottom>`","`<footer>`","`<end>`","`<aside>`","`<foot>`","`<under>`","`<copyright>`"],a:1,e:"`<footer>` はページやセクションの末尾の情報を表します。"},
   {id:"html-5-3",q:"本文とは直接関係のない補足（サイドバーなど）を表すタグは？",c:["`<aside>`","`<side>`","`<sub>`","`<section>`","`<nav>`","`<extra>`","`<main>`"],a:0,e:"`<aside>` は本文の補足や関連リンク、広告などに使います。"},
   {id:"html-5-4",q:"セマンティック要素を使うメリットとして正しいのは？",c:["検索エンジンや読み上げソフトがページの構造を理解しやすくなる","ページの表示が必ず速くなる","CSSが不要になる","デザインが自動で整う","JavaScriptが使えるようになる","画像が軽くなる","スマホ対応が自動でされる"],a:0,e:"見た目は `<div>` と同じですが、「ここは何の部分か」という意味が伝わります。SEOやアクセシビリティに役立ちます。",w:{2:"見た目はこれまでどおりCSSで整えます。",3:"見た目は `<div>` と変わりません。"}}
  ]},
 {title:"テーブル（表）",body:"表は `<table>` で作ります。1行を `<tr>`（table row）で囲み、見出しのセルは `<th>`、データのセルは `<td>` で書きます。\n見出しの行を `<thead>`、データ部分を `<tbody>` でまとめると、構造がわかりやすくなります。料金表やスケジュールなど、行と列の関係があるデータに使い、ページのレイアウトには使いません。",
  code:`<table>
  <thead>
    <tr><th>商品</th><th>価格</th></tr>
  </thead>
  <tbody>
    <tr><td>コーヒー</td><td>500円</td></tr>
    <tr><td>紅茶</td><td>450円</td></tr>
  </tbody>
</table>`,
  quiz:[
   {id:"html-7-0",q:"表の1行を表すタグは？",c:["`<tr>`","`<td>`","`<th>`","`<row>`","`<table>`","`<line>`","`<li>`"],a:0,e:"table row の略で `<tr>` です。"},
   {id:"html-7-1",q:"表の見出しのセルを表すタグは？",c:["`<th>`","`<td>`","`<thead>`","`<h1>`","`<tr>`","`<head>`","`<caption>`"],a:0,e:"table header の略で `<th>` です。データのセルは `<td>` です。",w:{2:"`<thead>` は見出しの行をまとめるタグで、セル1つ分ではありません。",3:"`<h1>` はページの見出しです。"}},
   {id:"html-7-2",q:"2列×3行の表を作るとき、セルは全部でいくつ？",c:["6個","5個","3個","2個"],a:0,e:"1行に2個のセルが3行あるので6個です。"},
   {id:"html-7-3",q:"`<table>` を使うのに向いていないものは？",c:["ページ全体のレイアウト（左右に並べる）","料金表","時間割","商品の比較表","営業時間の一覧","成績表","スケジュール"],a:0,e:"レイアウトにはCSS（Flexbox や Grid）を使います。`<table>` は表形式のデータ専用です。"},
   {id:"html-7-4",q:"セルを横に2つ分つなげる属性は？",c:["`colspan=\"2\"`","`rowspan=\"2\"`","`span=\"2\"`","`width=\"2\"`","`merge=\"2\"`","`col=\"2\"`","`join=\"2\"`"],a:0,e:"`colspan` は横（列）方向、`rowspan` は縦（行）方向にセルをつなげます。",w:{1:"`rowspan` は縦方向につなげる属性です。"}}
  ]},
 {title:"メタタグとSEO",body:"`<head>` の中には、画面には出ないけれど大切な情報を書きます。`<title>` は検索結果のタイトルになり、`<meta name=\"description\">` は検索結果の説明文に使われることがあります。\nスマホ対応の viewport、SNSでシェアされたときの表示（OGP）、ファビコン（タブのアイコン）も `<head>` に書きます。検索エンジンに内容を正しく伝える工夫をSEO（検索エンジン最適化）と言います。",
  code:`<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Cafe | 自家焙煎のカフェ</title>
  <meta name="description" content="駅から徒歩5分の自家焙煎カフェです。">
  <meta property="og:title" content="My Cafe">
  <meta property="og:image" content="https://example.com/ogp.jpg">
  <link rel="icon" href="favicon.ico">
</head>`,
  quiz:[
   {id:"html-8-0",q:"検索結果に表示される説明文を指定する書き方は？",c:["`<meta name=\"description\" content=\"…\">`","`<meta name=\"title\" content=\"…\">`","`<description>…</description>`","`<p class=\"description\">…</p>`","`<meta charset=\"…\">`","`<title description=\"…\">`","`<link rel=\"description\">`"],a:0,e:"`name=\"description\"` の meta タグの `content` に説明文を書きます。",w:{3:"`<p>` は画面に表示される段落で、検索結果の説明文にはなりません。",4:"`charset` は文字コードの指定です。"}},
   {id:"html-8-1",q:"スマホでページを画面幅に合わせて表示するための meta タグは？",c:["`<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">`","`<meta name=\"mobile\" content=\"true\">`","`<meta charset=\"UTF-8\">`","`<meta name=\"screen\" content=\"phone\">`","`<meta name=\"responsive\">`","`<meta width=\"100%\">`","`<link rel=\"mobile\">`"],a:0,e:"viewport を指定しないと、スマホはPC用の幅で縮小表示してしまいます。",w:{2:"これは文字コードの指定です。"}},
   {id:"html-8-2",q:"ブラウザのタブに表示される小さなアイコン（ファビコン）を指定するのは？",c:["`<link rel=\"icon\" href=\"favicon.ico\">`","`<img src=\"favicon.ico\">`","`<meta name=\"icon\" content=\"favicon.ico\">`","`<icon src=\"favicon.ico\">`","`<link rel=\"stylesheet\" href=\"favicon.ico\">`","`<title icon=\"favicon.ico\">`","`<a href=\"favicon.ico\">`"],a:0,e:"`<link rel=\"icon\">` で指定します。`rel` は読み込むファイルの役割を表します。",w:{1:"`<img>` はページの中に画像を表示するタグです。",4:"`rel=\"stylesheet\"` はCSSファイルを読み込むときの書き方です。"}},
   {id:"html-8-3",q:"SNSでシェアされたときのタイトルや画像を指定する仕組みは？",c:["OGP（`<meta property=\"og:…\">`）","SEO","viewport","ファビコン","alt属性","DOCTYPE","サイトマップ"],a:0,e:"`og:title`・`og:image` などの meta タグで、シェアされたときの見え方を決めます。",w:{1:"SEOは検索エンジン向けの工夫全体のことです。"}},
   {id:"html-8-4",q:"SEOの観点で良い `<title>` の付け方は？",c:["ページごとに内容がわかる、違うタイトルを付ける","全ページ同じタイトルにする","タイトルは空にする","キーワードを何十回も並べる","画像のファイル名をタイトルにする","`<body>` の中に書く","英語でしか書いてはいけない"],a:0,e:"タイトルは検索結果やタブに表示されます。ページの内容が伝わる、ページごとに違うものにします。",w:{3:"キーワードを詰め込みすぎると、かえって評価が下がることがあります。"}}
  ]}
]];

 {id:"html-adv-3",q:"「名前」のラベルを押すと入力欄にカーソルが入るようにしたい。正しいのは？",c:["`<label for=\"name\">名前</label><input id=\"name\">`","`<label id=\"name\">名前</label><input for=\"name\">`","`<label name=\"name\">名前</label><input name=\"name\">`","`<label>名前</label><input label=\"名前\">`","`<label for=\"name\">名前</label><input class=\"name\">`","`<label href=\"name\">名前</label><input id=\"name\">`","`<input id=\"name\"><label>名前</label>`"],a:0,e:"label の `for` と input の `id` を同じ値にします。",w:{1:"for と id が逆です。for は label、id は input に付けます。",4:"`class` では結びつきません。`id` にします。"}},

WR.html=[
/* 初級 */
[
 {id:"html-0",t:"見出し（h1）に「My Cafe」、その下の段落（p）に「ようこそ」と表示しよう。",h:"`<h1>…</h1>` と `<p>…</p>` を上下に書きます。",a:"<h1>My Cafe</h1>\n<p>ようこそ</p>",ae:"`<h1>` はページの一番大きな見出し、`<p>` は段落です。",
  check:d=>{const h=d.querySelector("h1"),p=d.querySelector("p");if(!h)return"h1 タグが見つかりません。";if(h.textContent.trim()!=="My Cafe")return"h1 の文字が「My Cafe」になっていません。";if(!p||!p.textContent.includes("ようこそ"))return"「ようこそ」が入った p タグが見つかりません。";return"";}},
 {id:"html-1",t:"「お問い合わせ」という文字のリンクを作り、行き先を contact.html にしよう。",h:"`<a href=\"行き先\">文字</a>` の形です。",a:"<a href=\"contact.html\">お問い合わせ</a>",ae:"`href` に行き先、タグの間にリンクの文字を書きます。",
  check:d=>{const a=d.querySelector("a");if(!a)return"a タグが見つかりません。";if(a.getAttribute("href")!=="contact.html")return"href の値を contact.html にしましょう。";if(!a.textContent.includes("お問い合わせ"))return"リンクの文字を「お問い合わせ」にしましょう。";return"";}},
 {id:"html-2",t:"画像 cat.jpg を表示しよう。画像の説明（alt）は「ねこの写真」にします。",h:"`<img src=\"…\" alt=\"…\">`。img に閉じタグはありません。",a:"<img src=\"cat.jpg\" alt=\"ねこの写真\">",ae:"`src` に画像の場所、`alt` に説明文を書きます。cat.jpg はないので、プレビューでは説明文が表示されます。",
  check:d=>{const i=d.querySelector("img");if(!i)return"img タグが見つかりません。";if(i.getAttribute("src")!=="cat.jpg")return"src の値を cat.jpg にしましょう。";if(i.getAttribute("alt")!=="ねこの写真")return"alt の値を「ねこの写真」にしましょう。";return"";}},
 {id:"html-4",t:"「公式サイト」という文字のリンクを作り、https://example.com を新しいタブで開くようにしよう。",h:"`target=\"_blank\"` をつけると新しいタブで開きます。",a:"<a href=\"https://example.com\" target=\"_blank\">公式サイト</a>",ae:"`target=\"_blank\"` で新しいタブで開きます。",
  check:d=>{const a=d.querySelector("a");if(!a)return"a タグが見つかりません。";if(a.getAttribute("href")!=="https://example.com")return"href の値を https://example.com にしましょう。";if(a.getAttribute("target")!=="_blank")return"新しいタブで開く属性が足りません。";if(!a.textContent.includes("公式サイト"))return"リンクの文字を「公式サイト」にしましょう。";return"";}},
 {id:"html-8",t:"1つの段落の中で改行して、「営業時間」と「9:00〜18:00」を2行で表示しよう。",h:"段落 `<p>` の中で `<br>` を使います。",a:"<p>営業時間<br>9:00〜18:00</p>",ae:"`<p>` を2つに分けるのではなく、1つの段落の中で `<br>` を使って改行します。",
  check:d=>{const ps=d.querySelectorAll("p");if(!ps.length)return"p タグが見つかりません。";if(ps.length>1)return"段落は1つにして、その中で改行しましょう。";const p=ps[0];if(!p.querySelector("br"))return"段落の中に改行（br）がありません。";if(p.textContent.replace(/\s/g,"")!=="営業時間9:00〜18:00")return"文字を「営業時間」と「9:00〜18:00」にしましょう。";return"";}}
],
/* 中級 */
[
 {id:"html-3",t:"順番のない箇条書きで「コーヒー」「紅茶」「ケーキ」の3つを並べよう。",h:"`<ul>` の中に `<li>` を3つ書きます。",a:"<ul>\n  <li>コーヒー</li>\n  <li>紅茶</li>\n  <li>ケーキ</li>\n</ul>",ae:"`<ul>` が箇条書き全体、`<li>` が1項目です。",
  check:d=>{const u=d.querySelector("ul");if(!u)return"ul タグが見つかりません。";const li=[...u.children].filter(x=>x.tagName==="LI");if(li.length!==3)return`ul の直下の li が ${li.length} 個です。3個にしましょう。`;const w=["コーヒー","紅茶","ケーキ"];if(li.some((x,i)=>x.textContent.trim()!==w[i]))return"li の中身と順番を「コーヒー」「紅茶」「ケーキ」にしましょう。";return"";}},
 {id:"html-9",t:"番号つきリストで「お湯を沸かす」「豆を挽く」「お湯を注ぐ」の手順を書こう。",h:"番号つきは `<ol>` です。中身は `<li>` で書きます。",a:"<ol>\n  <li>お湯を沸かす</li>\n  <li>豆を挽く</li>\n  <li>お湯を注ぐ</li>\n</ol>",ae:"手順のように順番に意味があるリストは `<ol>` を使います。",
  check:d=>{const o=d.querySelector("ol");if(!o)return d.querySelector("ul")?"ul ではなく、番号つきの ol を使いましょう。":"ol タグが見つかりません。";const li=[...o.children].filter(x=>x.tagName==="LI");const w=["お湯を沸かす","豆を挽く","お湯を注ぐ"];if(li.length!==3)return`li が ${li.length} 個です。3個にしましょう。`;if(li.some((x,i)=>x.textContent.trim()!==w[i]))return"手順の中身と順番を確認しましょう。";return"";}},
 {id:"html-10",t:"class が card の div を作り、その中に h3「ラテ」と p「450円」を入れよう。",h:"`<div class=\"card\">` の中に、`<h3>` と `<p>` を書きます。",a:"<div class=\"card\">\n  <h3>ラテ</h3>\n  <p>450円</p>\n</div>",ae:"class を付けた div でまとめておくと、CSSで `.card` としてデザインできます。",
  check:d=>{const c=d.querySelector("div.card");if(!c)return d.querySelector("div")?"div に class=\"card\" を付けましょう。":"div が見つかりません。";const h=c.querySelector("h3");if(!h||h.textContent.trim()!=="ラテ")return".card の中に h3「ラテ」を入れましょう。";const p=c.querySelector("p");if(!p||p.textContent.trim()!=="450円")return".card の中に p「450円」を入れましょう。";return"";}},
 {id:"html-5",t:"「お名前」というラベルと、必須の入力欄を作ろう。ラベルを押すと入力欄が選ばれるように、入力欄の id は name にします。",h:"`<label for=\"name\">` と `<input id=\"name\" required>` をセットで書きます。",a:"<label for=\"name\">お名前</label>\n<input type=\"text\" id=\"name\" required>",ae:"label の `for` と input の `id` を同じにすると結びつきます。`required` で必須になります。",
  check:d=>{const l=d.querySelector("label");if(!l)return"label タグが見つかりません。";if(!l.textContent.includes("お名前"))return"ラベルの文字を「お名前」にしましょう。";if(l.getAttribute("for")!=="name")return"label の for の値を name にしましょう。";const i=d.getElementById("name");if(!i||i.tagName!=="INPUT")return"id が name の input が見つかりません。";if(!i.hasAttribute("required"))return"入力欄を必須にする属性が足りません。";return"";}},
 {id:"html-7",t:"段落「今日のおすすめはラテです」を作り、「ラテ」の部分だけを class が pick の span で囲もう。",h:"段落の中の一部を `<span class=\"pick\">…</span>` で囲みます。",a:"<p>今日のおすすめは<span class=\"pick\">ラテ</span>です</p>",ae:"span はインライン要素なので、囲んでも改行されません。",
  check:d=>{const p=d.querySelector("p");if(!p)return"p タグが見つかりません。";if(p.textContent.replace(/\s/g,"")!=="今日のおすすめはラテです")return"段落の文字を「今日のおすすめはラテです」にしましょう。";const s=p.querySelector("span");if(!s)return"p の中に span が見つかりません。";if(!s.classList.contains("pick"))return"span に class=\"pick\" をつけましょう。";if(s.textContent.trim()!=="ラテ")return"span で囲むのは「ラテ」だけにしましょう。";return"";}}
],
/* 上級 */
[
 {id:"html-6",t:"header の中に nav を作り、その中のリスト（ul）に「ホーム」「メニュー」の2つの項目を入れよう。",h:"`<header>` → `<nav>` → `<ul>` → `<li>` の順に入れ子にします。",a:"<header>\n  <nav>\n    <ul>\n      <li>ホーム</li>\n      <li>メニュー</li>\n    </ul>\n  </nav>\n</header>",ae:"ヘッダーの中にナビゲーション、その中にメニューのリスト、という入れ子です。",
  check:d=>{if(!d.querySelector("header"))return"header タグが見つかりません。";if(!d.querySelector("header nav"))return"header の中に nav を入れましょう。";const u=d.querySelector("header nav ul");if(!u)return"nav の中に ul を入れましょう。";const t=[...u.querySelectorAll("li")].map(x=>x.textContent.trim());if(!t.includes("ホーム")||!t.includes("メニュー"))return"li に「ホーム」と「メニュー」を入れましょう。";return"";}},
 {id:"html-11",t:"見出し行が「商品」「価格」、データ行が「コーヒー」「500円」の、2行の表を作ろう。",h:"`<table>` の中に `<tr>` を2つ。1行目は `<th>`、2行目は `<td>` でセルを書きます。",a:"<table>\n  <tr><th>商品</th><th>価格</th></tr>\n  <tr><td>コーヒー</td><td>500円</td></tr>\n</table>",ae:"`<thead>` と `<tbody>` で分けて書いてもOKです。",
  check:d=>{const t=d.querySelector("table");if(!t)return"table タグが見つかりません。";const th=[...t.querySelectorAll("th")].map(x=>x.textContent.trim());if(th.join()!=="商品,価格")return"見出しのセル（th）を「商品」「価格」にしましょう。";const td=[...t.querySelectorAll("td")].map(x=>x.textContent.trim());if(td.join()!=="コーヒー,500円")return"データのセル（td）を「コーヒー」「500円」にしましょう。";if(t.querySelectorAll("tr").length!==2)return"行（tr）を2つにしましょう。";return"";}},
 {id:"html-12",t:"ページのタイトルを「My Cafe」にして、説明文（description）を「駅から徒歩5分のカフェです」にしよう。（どちらも画面には表示されません）",h:"`<title>` と、`<meta name=\"description\" content=\"…\">` を書きます。",a:"<title>My Cafe</title>\n<meta name=\"description\" content=\"駅から徒歩5分のカフェです\">",ae:"本来は `<head>` の中に書きます。title はタブや検索結果のタイトル、description は検索結果の説明文に使われます。",
  check:d=>{const t=d.querySelector("title");if(!t||t.textContent.trim()!=="My Cafe")return"title を「My Cafe」にしましょう。";const m=d.querySelector('meta[name="description"]');if(!m)return"name=\"description\" の meta タグが見つかりません。";if((m.getAttribute("content")||"").trim()!=="駅から徒歩5分のカフェです")return"content の値を「駅から徒歩5分のカフェです」にしましょう。";return"";}},
 {id:"html-13",t:"main の中に section を作って h2「サービス」を入れ、main の後ろ（外）に footer「© 2026 My Cafe」を置こう。",h:"`<main><section><h2>…</h2></section></main>` の後に `<footer>…</footer>`。© は `&copy;` と書けます。",a:"<main>\n  <section>\n    <h2>サービス</h2>\n  </section>\n</main>\n<footer>&copy; 2026 My Cafe</footer>",ae:"footer はページ全体の末尾なので、main の外に置きます。",
  check:d=>{const h=d.querySelector("main section h2");if(!h)return"main → section → h2 の入れ子になっていません。";if(h.textContent.trim()!=="サービス")return"h2 の文字を「サービス」にしましょう。";const f=d.querySelector("footer");if(!f)return"footer が見つかりません。";if(f.closest("main"))return"footer は main の外（後ろ）に置きましょう。";if(!f.textContent.includes("2026 My Cafe"))return"footer の文字を「© 2026 My Cafe」にしましょう。";return"";}},
 {id:"html-14",t:"logo.png の画像を、トップページ（index.html）へのリンクにしよう。画像の説明（alt）は「My Cafe トップへ」にします。",h:"`<a href=\"…\">` の中に `<img>` を入れます。",a:"<a href=\"index.html\">\n  <img src=\"logo.png\" alt=\"My Cafe トップへ\">\n</a>",ae:"画像だけのリンクは、alt に「どこへ行くリンクか」を書くと読み上げソフトでも伝わります。",
  check:d=>{const a=d.querySelector("a");if(!a)return"a タグが見つかりません。";if(a.getAttribute("href")!=="index.html")return"リンク先を index.html にしましょう。";const i=a.querySelector("img");if(!i)return"a の中に img を入れましょう。";if(i.getAttribute("src")!=="logo.png")return"画像の src を logo.png にしましょう。";if((i.getAttribute("alt")||"").trim()!=="My Cafe トップへ")return"alt を「My Cafe トップへ」にしましょう。";return"";}}
]];

/* ================= CSS ================= */
const cssRule=(d,sel)=>{for(const sh of d.styleSheets){let rs;try{rs=sh.cssRules;}catch(e){continue;}for(const r of rs){if(r.selectorText&&r.selectorText.split(",").map(s=>s.trim()).includes(sel))return r;}}return null;};

   {id:"css-0-3",q:"次のCSSで、段落の文字は何色になる？",code:`p { color: blue; }
p { color: green; }`,c:["緑（後に書いた方）","青（先に書いた方）","青と緑が混ざった色","黒","色はつかない","ランダムに変わる","エラーで表示されない"],a:0,e:"CSSは上から順に読まれ、同じ強さなら後に書いた方で上書きされます。"},
   {id:"css-0-4",q:"HTMLタグに直接CSSを書く方法は？",c:["`style` 属性（例：`<p style=\"color: red;\">`）","`css` 属性","`class` 属性に色を書く","`<p color=\"red\">`","`font` 属性","`<css>` タグで囲む","`design` 属性"],a:0,e:"`style` 属性で直接書けますが、管理しにくいので基本はCSSファイルに書きます。",w:{2:"`class` には名前を付け、色はCSS側で指定します。"}}

 {title:"セレクタ",body:"よく使うのは、タグ名（`p`）、クラス（`.btn`）、ID（`#top`）の3つです。クラスは何度でも使えるので、見た目の指定には主にクラスを使います。\nスペースで区切ると「〜の中の〜」（子孫セレクタ）、カンマで区切ると「〜と〜の両方」になります。指定がぶつかったときは ID ＞ クラス ＞ タグ名 の順に強くなります。",
  code:`.btn { background: #2d68cf; }   /* class="btn" */
#top { padding: 40px; }           /* id="top" */
nav a { color: white; }           /* nav の中の a */
h1, h2 { font-weight: bold; }     /* h1 と h2 の両方 */`,
  quiz:[
   {id:"css-1-0",q:"`class=\"card\"` を指定するセレクタは？",c:["`#card`","`.card`","`card`","`*card`","`@card`","`&card`","`:card`"],a:1,e:"クラスはドット `.`、IDはシャープ `#` をつけます。"},
   {id:"css-1-1",q:"`header a` が選ぶのは？",c:["header と a の両方","header の中にある a","a の中にある header","header の直後の a","header だけ","ページ内のすべての a","header の外にある a"],a:1,e:"スペース区切りは子孫セレクタで「header の中の a」です。",w:{0:"両方を指定するならカンマで `header, a` と書きます。"}},
   {id:"css-1-2",q:"同じ要素に `.btn` と `#main` の指定があり内容がぶつかったとき、優先されるのは？",c:["`.btn`","`#main`","後に書いた方","先に書いた方","両方の指定が混ざる","どちらも効かない","HTMLで先に書いた方"],a:1,e:"IDセレクタはクラスより強い（詳細度が高い）ので優先されます。",w:{0:"クラスはIDより弱いです。",2:"「後に書いた方が勝つ」のは強さが同じときだけです。"}},
   {id:"css-1-3",q:"`h1, h2` のようにカンマで区切ったセレクタの意味は？",c:["h1 と h2 の両方に同じ指定をする","h1 の中の h2","h1 の直後の h2","h1 か h2 のどちらか一方だけ","h1 を h2 に変える","エラーになる","h2 だけ"],a:0,e:"カンマで区切ると、複数のセレクタにまとめて同じスタイルを当てられます。",w:{1:"「〜の中の」はスペースで区切ります（`h1 h2`）。"}},
   {id:"css-1-4",q:"すべての要素を選ぶセレクタは？",c:["`*`","`all`","`.all`","`#all`","`body`","`html`","`%`"],a:0,e:"`*`（ユニバーサルセレクタ）はすべての要素を選びます。`* { box-sizing: border-box; }` のように使います。",w:{4:"`body` は body 要素だけを選びます。"}}
  ]},
 {title:"文字と色",body:"文字の色は `color`、背景色は `background-color` です。色は `#1d2433` のような16進数（#RRGGBB）や `rgb()`、`red` などの名前で指定できます。\n文字の大きさは `font-size`、太さは `font-weight`、行の高さは `line-height`、左右の揃え方は `text-align` です。`rem` はページの基準サイズ（ふつう16px）の何倍かを表す単位です。",
  code:`body {
  color: #1d2433;
  background-color: #f3f5f8;
  font-size: 16px;
  line-height: 1.8;
}
h1 {
  font-size: 2rem;   /* 基準の2倍 = 32px */
  font-weight: bold;
  text-align: center;
}`,
  quiz:[
   {id:"css-3-0",q:"背景色を指定するプロパティは？",c:["`color`","`background-color`","`bg`","`fill`","`back-color`","`bgcolor`","`background-paint`"],a:1,e:"`color` は文字の色です。背景は `background-color`（または `background`）です。"},
   {id:"css-3-1",q:"基準サイズが16pxのとき `1.5rem` は何px？",c:["15px","16px","24px","32px"],a:2,e:"16 × 1.5 = 24px です。"},
   {id:"css-3-2",q:"文字を太字にするプロパティは？",c:["`font-style: bold`","`font-weight: bold`","`text-weight: bold`","`font-size: bold`","`font-bold`","`text-style: bold`","`weight: bold`"],a:1,e:"太さは `font-weight` です。",w:{0:"`font-style` は斜体（italic）などに使います。",3:"`font-size` は文字の大きさです。"}},
   {id:"css-3-3",q:"文字を中央揃えにするプロパティは？",c:["`text-align: center;`","`align: center;`","`justify-content: center;`","`text-center: true;`","`margin: center;`","`font-align: center;`","`vertical-align: center;`"],a:0,e:"文章の左右の位置は `text-align` で決めます。",w:{2:"`justify-content` は Flexbox で子要素を並べるときに使います。",6:"`vertical-align` は縦方向の揃え方で、値に center はありません（middle）。"}},
   {id:"css-3-4",q:"`#ff0000` が表す色は？",c:["赤","緑","青","白"],a:0,e:"#RRGGBB の順に赤・緑・青の強さを表します。"}
  ]}
],

 {title:"ボックスモデル",body:"すべての要素は「中身 → padding（内側の余白）→ border（枠線）→ margin（外側の余白）」の箱でできています。\n`box-sizing: border-box;` を指定すると、`width` に padding と border が含まれるので、サイズ計算がずっと楽になります。上下に並んだ要素の margin は足されずに重なり、大きい方だけが使われます（マージンの相殺）。",
  code:`* { box-sizing: border-box; }

.card {
  width: 300px;
  padding: 20px;          /* 内側の余白 */
  border: 1px solid #ccc; /* 枠線 */
  margin: 0 auto 24px;    /* 上0・左右auto（中央）・下24px */
}`,
  quiz:[
   {id:"css-2-0",q:"枠線と中身の間の余白は？",c:["margin","padding","border","gap","spacing","outline","inner"],a:1,e:"内側が padding、外側が margin です。"},
   {id:"css-2-1",q:"`box-sizing: border-box` にするとどうなる？",c:["width に padding と border が含まれる","margin がなくなる","枠線が消える","要素が横に並ぶ","要素が中央寄せになる","padding が使えなくなる","角が丸くなる"],a:0,e:"指定した width の中に padding と border が収まるので、はみ出しにくくなります。"},
   {id:"css-2-2",q:"`margin: 10px 20px;` の意味は？",c:["上下10px・左右20px","上10px・下20px","左右10px・上下20px","全方向15px"],a:0,e:"値が2つのときは「上下 左右」の順です。"},
   {id:"css-2-3",q:"幅の決まった要素を、横方向の中央に置く定番の書き方は？",c:["`margin: 0 auto;`","`padding: center;`","`align: center;`","`margin: center;`","`text-align: middle;`","`position: center;`","`float: center;`"],a:0,e:"幅のあるブロック要素は、左右の margin を auto にすると中央に置かれます。"},
   {id:"css-2-4",q:"上の要素に `margin-bottom: 30px`、下の要素に `margin-top: 20px`。間隔は？",c:["30px","50px","20px","10px"],a:0,e:"上下の margin は重なり、大きい方だけが残ります。"}
  ]},
 {title:"Flexbox",body:"親要素に `display: flex;` をつけると、子要素が横に並びます。\n`justify-content` で横方向の並べ方、`align-items` で縦方向のそろえ方、`gap` で要素の間の余白を決めます。入りきらないときに折り返すなら `flex-wrap: wrap;` です。ナビゲーションやカードの横並びでよく使います。",
  code:`.menu {
  display: flex;
  justify-content: space-between; /* 両端に広げる */
  align-items: center;            /* 縦の中央 */
  gap: 16px;
  flex-wrap: wrap;                /* 入りきらなければ折り返す */
}`,
  quiz:[
   {id:"css-4-0",q:"子要素を横並びにするには、どこに何を書く？",c:["子要素に `display: flex`","親要素に `display: flex`","子要素に `float: left`","親要素に `position: flex`","子要素に `display: inline`","親要素に `align: row`","親要素に `flex-direction: row` だけ"],a:1,e:"`display: flex` は並べたい要素の「親」に指定します。",w:{0:"flex は並べたい要素の親に指定します。",6:"`display: flex` がないと flex-direction は効きません。"}},
   {id:"css-4-1",q:"横方向に中央寄せするプロパティは？",c:["`align-items: center`","`text-align: middle`","`justify-content: center`","`margin: center`","`align-content: middle`","`flex-center: true`","`justify-items: middle`"],a:2,e:"flexの横方向（主軸）は `justify-content`、縦方向は `align-items` です。",w:{0:"`align-items` は縦方向のそろえ方です。"}},
   {id:"css-4-2",q:"flexで並んだ子要素の間の余白をまとめて指定するプロパティは？",c:["`margin`","`padding`","`gap`","`space`","`between`","`spacing`","`flex-gap`"],a:2,e:"`gap` を親に指定すると、子要素同士の間だけに余白が入ります。"},
   {id:"css-4-3",q:"flexの子要素が入りきらないとき、折り返して次の行に並べるには？",c:["`flex-wrap: wrap;`","`flex-direction: wrap;`","`wrap: true;`","`overflow: wrap;`","`white-space: wrap;`","`flex-break: line;`","`justify-content: wrap;`"],a:0,e:"初期値は折り返さない（nowrap）ので、`flex-wrap: wrap;` で折り返します。"},
   {id:"css-4-4",q:"`justify-content: space-between;` の並び方は？",c:["両端に寄せて、間を均等にあける","すべて中央に集める","すべて左に寄せる","すべて右に寄せる","両端にも同じ余白をあけて均等に並べる","縦に並べる","重ねて表示する"],a:0,e:"最初と最後の要素が両端にくっつき、残りの間隔が均等になります。",w:{1:"それは `center` です。",2:"それは初期値の `flex-start` です。",4:"それは `space-around` や `space-evenly` の並び方です。"}}
  ]},
 {title:"レスポンシブ",body:"スマホなど画面幅に合わせて見た目を変えることをレスポンシブ対応と言います。`@media` で「画面幅が〇〇px以下のとき」だけ効くCSSを書けます。\nHTMLの `<head>` に viewport の `<meta>` を入れるのを忘れると、スマホで小さく表示されてしまいます。画像には `max-width: 100%` を付けて、はみ出さないようにします。",
  code:`<meta name="viewport" content="width=device-width, initial-scale=1">

img { max-width: 100%; height: auto; }
.cards { display: flex; gap: 16px; }

@media (max-width: 768px) {
  .cards { flex-direction: column; } /* スマホでは縦並び */
}`,
  quiz:[
   {id:"css-5-0",q:"`@media (max-width: 768px)` の中のCSSが効くのは？",c:["画面幅が768px以上のとき","画面幅が768px以下のとき","印刷するときだけ","常に","768pxちょうどのときだけ","スマホの縦向きのときだけ","PCのときだけ"],a:1,e:"max-width は「最大で768pxまで」、つまり768px以下で効きます。",w:{0:"「以上」は `min-width` です。"}},
   {id:"css-5-1",q:"flexで並べた要素を縦並びにするには？",c:["`flex-direction: column`","`display: block-flex`","`align-items: column`","`flex-wrap: vertical`","`flex-flow: down`","`direction: vertical`","`justify-content: column`"],a:0,e:"`flex-direction: column` で並ぶ向きが縦になります。"},
   {id:"css-5-2",q:"viewport の `<meta>` を入れ忘れると、スマホではどうなる？",c:["ページが表示されない","PC用の幅で縮小表示され文字が小さくなる","色がおかしくなる","何も変わらない","画像が表示されなくなる","横向きでしか見られない","リンクが押せなくなる"],a:1,e:"viewport指定がないと、スマホはPC向けの広い幅で表示して縮小するため、@media も思った通りに効きません。"},
   {id:"css-5-3",q:"画像が親要素からはみ出さないようにする定番の指定は？",c:["`img { max-width: 100%; height: auto; }`","`img { width: 1000px; }`","`img { overflow: hidden; }`","`img { display: none; }`","`img { position: fixed; }`","`img { font-size: 100%; }`","`img { min-width: 100%; }`"],a:0,e:"`max-width: 100%` で親の幅を超えなくなり、`height: auto` で縦横比が保たれます。",w:{3:"`display: none` だと画像が消えてしまいます。"}},
   {id:"css-5-4",q:"スマホ向けのCSSを先に書き、広い画面向けの指定を @media で足していく考え方は？",c:["モバイルファースト","デスクトップファースト","リキッドレイアウト","セマンティック","カスケード","グリッドシステム","ボックスモデル"],a:0,e:"モバイルファーストでは `@media (min-width: …)` で広い画面向けの指定を追加していきます。",w:{4:"カスケードは、CSSの指定が上書きされていくしくみのことです。"}}
  ]}
],

 {title:"position",body:"`position` を使うと、要素を好きな場所に重ねて配置できます。\n親に `position: relative;`、動かしたい子に `position: absolute;` をつけ、`top`・`right` などで位置を決めるのが基本の形です。`position: fixed;` は画面に固定され、スクロールしても動きません。`position: sticky;` は、スクロールして指定の位置まで来るとそこに貼り付きます。",
  code:`.card { position: relative; }
.badge {
  position: absolute;
  top: 8px;
  right: 8px;
}
header { position: fixed; top: 0; width: 100%; z-index: 10; }
h2 { position: sticky; top: 0; }`,
  quiz:[
   {id:"css-6-0",q:"`position: absolute` の位置の基準になるのは？",c:["いつも画面の左上","`position: relative` などが指定された一番近い親","直前の要素","必ず `<body>`","一番外側の `<html>` だけ","すぐ隣の要素","画面の中央"],a:1,e:"position が static 以外の、一番近い親要素が基準になります。だから親に relative をつけます。"},
   {id:"css-6-1",q:"スクロールしても画面の同じ場所に固定するのは？",c:["`relative`","`absolute`","`fixed`","`static`","`stay`","`lock`","`pin`"],a:2,e:"`fixed` は画面（ビューポート）を基準に固定されます。"},
   {id:"css-6-2",q:"要素の重なり順を決めるプロパティは？",c:["`z-index`","`layer`","`order`","`depth`","`stack`","`front`","`z-order`"],a:0,e:"`z-index` は数字が大きいほど手前に表示されます。position を指定した要素に効きます。"},
   {id:"css-6-3",q:"スクロールすると途中から画面上部に貼り付く見出しを作るのは？",c:["`position: sticky; top: 0;`","`position: fixed;`（最初から固定）","`position: absolute; top: 0;`","`position: relative; top: 0;`","`display: sticky;`","`float: top;`","`position: static;`"],a:0,e:"`sticky` は、指定した位置までスクロールするとそこに貼り付きます。",w:{1:"`fixed` は最初から画面に固定され、元の場所には残りません。",4:"sticky は display ではなく position の値です。"}},
   {id:"css-6-4",q:"`position: absolute;` を付けた要素はどうなる？",c:["元の場所から抜けて、他の要素がその場所に詰めてくる","元の場所に空白を残したまま動く","必ず画面の中央に移動する","表示されなくなる","横幅が必ず100%になる","後ろの要素の下に必ず隠れる","文字にしか効かない"],a:0,e:"absolute の要素は通常の並び（フロー）から外れるので、他の要素はその場所がないものとして並びます。",w:{1:"それは `relative` の特徴です。"}}
  ]},
 {title:"Grid",body:"`display: grid;` を使うと、要素をタテとヨコのマス目（グリッド）に並べられます。`grid-template-columns` で列の数と幅を決め、`gap` で間をあけます。\n`1fr` は「残りの幅を分け合う1つ分」という単位です。`repeat(3, 1fr)` と書くと同じ幅の3列になります。1つの要素を2列分に広げるには `grid-column: span 2;` を使います。カード一覧や写真ギャラリーによく使います。",
  code:`.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr); /* 同じ幅の3列 */
  gap: 16px;
}
.wide {
  grid-column: span 2; /* 2列分の幅 */
}`,
  quiz:[
   {id:"css-7-0",q:"同じ幅の3列を作る書き方は？",c:["`grid-template-columns: repeat(3, 1fr);`","`grid-template-rows: repeat(3, 1fr);`","`grid-columns: 3;`","`columns: 3fr;`","`display: grid-3;`","`grid-template-columns: 3;`","`flex: 3;`"],a:0,e:"`repeat(3, 1fr)` は `1fr 1fr 1fr` と同じ意味です。",w:{1:"`grid-template-rows` は行（タテ方向）の指定です。"}},
   {id:"css-7-1",q:"`fr` という単位の意味は？",c:["残りのスペースを分け合う割合","フォントサイズの倍数","画面幅の1%","固定の10px","親要素のpadding","フレームの数","行の高さ"],a:0,e:"fraction（分数）の略です。`1fr 2fr` なら 1:2 の割合で幅を分けます。",w:{1:"フォントサイズの倍数は `em` や `rem` です。",2:"画面幅の1%は `vw` です。"}},
   {id:"css-7-2",q:"`grid-template-columns: 200px 1fr;` で親の幅が 800px（gap なし）のとき、2列目の幅は？",c:["600px","200px","800px","400px"],a:0,e:"1列目の200pxを引いた残り600pxを 1fr が使います。"},
   {id:"css-7-3",q:"Grid の中の1つの要素を2列分の幅にするには？",c:["`grid-column: span 2;`","`grid-row: span 2;`","`width: 2fr;`","`colspan: 2;`","`flex: 2;`","`grid-width: 2;`","`column-span: 2px;`"],a:0,e:"`span 2` で2列分にまたがります。縦方向は `grid-row` です。",w:{1:"`grid-row` はタテ（行）方向に広げます。",3:"`colspan` は HTML の表で使う属性です。"}},
   {id:"css-7-4",q:"Flexbox と比べた Grid の特徴は？",c:["タテとヨコの2方向をまとめてレイアウトしやすい","1方向にしか並べられない","スマホでは使えない","画像にしか使えない","gap が使えない","文字の色を変える専用","古いので使わない方がよい"],a:0,e:"Flexbox は1方向（横か縦）、Grid はタテ×ヨコの2方向のレイアウトが得意です。",w:{1:"1方向が得意なのは Flexbox です。"}}
  ]},
 {title:"動き（hover と transition）",body:"`:hover` を使うと、マウスを乗せたときだけのスタイルを書けます。`transition` を指定すると、その変化を少しずつなめらかに変えられます。`transition` は `:hover` の中ではなく、元のセレクタに書くのがポイントです。\n`transform` は要素を動かしたり（translate）、大きくしたり（scale）、回したり（rotate）できます。ボタンやカードに少しの動きをつけると、押せることが伝わりやすくなります。",
  code:`.btn {
  background-color: #2d68cf;
  transition: background-color 0.3s;
}
.btn:hover {
  background-color: #1d4ea8;
}
.card:hover {
  transform: translateY(-4px); /* 上に4px動く */
}`,
  quiz:[
   {id:"css-8-0",q:"マウスを乗せたときのスタイルを書くセレクタは？",c:["`.btn:hover`","`.btn:focus`","`.btn.hover`","`.btn::mouse`","`.btn:active`","`.btn:on`","`#hover`"],a:0,e:"`:hover` は擬似クラスで、マウスが乗っている間だけ効きます。",w:{1:"`:focus` はキーボードやクリックで選ばれている状態です。",2:"`.hover` は hover というクラスが付いた要素です。",4:"`:active` は押している最中の状態です。"}},
   {id:"css-8-1",q:"変化を0.3秒かけてなめらかにするプロパティは？",c:["`transition: 0.3s;`","`animation-speed: 0.3s;`","`transform: 0.3s;`","`delay: 0.3s;`","`smooth: 0.3s;`","`duration: 0.3s;`","`hover-time: 0.3s;`"],a:0,e:"`transition` で、プロパティが変わるときにかける時間を指定します。",w:{2:"`transform` は移動・拡大・回転のプロパティです。"}},

   {id:"css-8-3",q:"`transition` はどこに書くのがよい？",c:["変化する前の元のセレクタ（例：`.btn`）","`:hover` の中だけ","`<head>` の中","JavaScriptの中","`body` だけ","`@media` の中だけ","どこにも書かなくてよい"],a:0,e:"元のセレクタに書くと、マウスを乗せたときも離したときもなめらかに変化します。",w:{1:":hover の中だけだと、マウスを離したときは一瞬で戻ってしまいます。"}},

/* 初級 */
[
 {id:"css-0",t:"class が note の段落だけ、文字色を赤（red）にしよう。",html:"<p class=\"note\">お知らせ</p>\n<p>ふつうの段落</p>",starter:"",h:"`.note { color: red; }` のように、クラスにはドットをつけます。",a:".note {\n  color: red;\n}",ae:"`.note` で class=\"note\" の要素だけを選びます。`p` と書くと両方の段落が赤くなります。",
  check:(d,w)=>{const p=d.querySelectorAll("p");if(w.getComputedStyle(p[0]).color!=="rgb(255, 0, 0)")return".note の文字色が赤になっていません。";if(w.getComputedStyle(p[1]).color==="rgb(255, 0, 0)")return"ふつうの段落まで赤くなっています。.note だけに指定しましょう。";return"";}},
 {id:"css-1",t:".title の文字の大きさを 32px、太さを太字（bold）にしよう。",html:"<h1 class=\"title\">My Cafe</h1>",starter:".title {\n  \n}",h:"`font-size` と `font-weight` を使います。",a:".title {\n  font-size: 32px;\n  font-weight: bold;\n}",ae:"大きさは font-size、太さは font-weight です。",
  check:(d,w)=>{const s=w.getComputedStyle(d.querySelector(".title"));if(s.fontSize!=="32px")return`文字の大きさが ${s.fontSize} です。32px にしましょう。`;if(parseInt(s.fontWeight)<700)return"文字が太字になっていません。";return"";}},
 {id:"css-5",t:".btn を、背景色 #2d68cf・文字色 白・角丸 8px・内側の余白 上下10px 左右20px のボタンにしよう。",html:"<a class=\"btn\" href=\"#\">予約する</a>",starter:".btn {\n  \n}",h:"`background-color`、`color`、`border-radius`、`padding: 10px 20px;` を使います。",a:".btn {\n  display: inline-block;\n  background-color: #2d68cf;\n  color: white;\n  border-radius: 8px;\n  padding: 10px 20px;\n}",ae:"`display: inline-block;` を付けると、リンク（インライン要素）でも上下の余白がきれいに効きます。",
  check:(d,w)=>{const s=w.getComputedStyle(d.querySelector(".btn"));if(s.backgroundColor!=="rgb(45, 104, 207)")return"背景色を #2d68cf にしましょう。";if(s.color!=="rgb(255, 255, 255)")return"文字色を白にしましょう。";if(s.borderTopLeftRadius!=="8px")return"角丸を 8px にしましょう。";if(s.paddingTop!=="10px"||s.paddingLeft!=="20px")return"padding を上下10px・左右20px にしましょう。";return"";}},
 {id:"css-8",t:".lead の文字サイズを 1.25rem、行の高さを 1.8 にしよう。（1rem = 16px）",html:"<p class=\"lead\">自家焙煎のコーヒーと手作りのケーキで、みなさまのお越しをお待ちしています。</p>",starter:".lead {\n  \n}",h:"`font-size: 1.25rem;` と `line-height: 1.8;` を使います。",a:".lead {\n  font-size: 1.25rem;\n  line-height: 1.8;\n}",ae:"16px × 1.25 = 20px。line-height は単位なしで書くと「文字サイズの何倍か」になります。",
  check:(d,w)=>{const s=w.getComputedStyle(d.querySelector(".lead"));if(s.fontSize!=="20px")return`文字サイズが ${s.fontSize} です。1.25rem（20px）にしましょう。`;if(Math.abs(parseFloat(s.lineHeight)-36)>0.5)return"行の高さを 1.8 にしましょう。";return"";}},
 {id:"css-9",t:"nav の背景色を #333 にして、nav の中のリンクだけ文字色を白にしよう。",html:"<nav>\n  <a href=\"#\">ホーム</a>\n  <a href=\"#\">メニュー</a>\n</nav>\n<p><a href=\"#\">本文のリンク</a></p>",starter:"",h:"「nav の中の a」は `nav a` と書きます。",a:"nav {\n  background-color: #333;\n}\nnav a {\n  color: white;\n}",ae:"スペースでつなぐと「〜の中の」という意味になります。`a` だけにすると本文のリンクまで白くなります。",
  check:(d,w)=>{const n=d.querySelector("nav");if(w.getComputedStyle(n).backgroundColor!=="rgb(51, 51, 51)")return"nav の背景色を #333 にしましょう。";if(w.getComputedStyle(n.querySelector("a")).color!=="rgb(255, 255, 255)")return"nav の中のリンクを白にしましょう。";if(w.getComputedStyle(d.querySelector("p a")).color==="rgb(255, 255, 255)")return"本文のリンクまで白になっています。nav の中だけに指定しましょう。";return"";}}
],
/* 中級 */
[
 {id:"css-2",t:".box を、幅 200px・内側の余白 20px・枠線 2px solid #333 にしよう。見た目の幅がちょうど 200px になるようにします。",html:"<div class=\"box\">ボックス</div>",starter:".box {\n  \n}",h:"padding と border を足しても 200px のままにするには `box-sizing: border-box;` を使います。",a:".box {\n  width: 200px;\n  padding: 20px;\n  border: 2px solid #333;\n  box-sizing: border-box;\n}",ae:"border-box にしないと 200 + 20×2 + 2×2 = 244px になります。",
  check:(d,w)=>{const el=d.querySelector(".box"),s=w.getComputedStyle(el);if(s.paddingLeft!=="20px"||s.paddingTop!=="20px")return"内側の余白（padding）を 20px にしましょう。";if(s.borderLeftWidth!=="2px"||s.borderLeftStyle!=="solid")return"枠線を 2px solid にしましょう。";const wd=Math.round(el.getBoundingClientRect().width);if(wd!==200)return`見た目の幅が ${wd}px になっています。200px になるようにしましょう。`;return"";}},
 {id:"css-3",t:".menu の項目を横並びにして、項目どうしの間を 16px あけよう。",html:"<ul class=\"menu\">\n  <li>ホーム</li>\n  <li>メニュー</li>\n  <li>アクセス</li>\n</ul>",starter:".menu {\n  \n}",h:"親の .menu に `display: flex;` と `gap` を指定します。",a:".menu {\n  display: flex;\n  gap: 16px;\n}",ae:"flex は並べたい要素の親（ここでは ul）に指定します。",
  check:(d,w)=>{const s=w.getComputedStyle(d.querySelector(".menu"));if(s.display!=="flex")return".menu が横並び（flex）になっていません。";if(s.columnGap!=="16px")return"項目の間の余白を 16px にしましょう。";return"";}},
 {id:"css-4",t:".header の中で、ロゴを左端・メニューを右端に置き、縦方向は中央にそろえよう。",html:"<header class=\"header\">\n  <div class=\"logo\">My Cafe</div>\n  <nav>メニュー</nav>\n</header>",starter:".header {\n  \n}",h:"`display: flex;` に、`justify-content` と `align-items` を組み合わせます。",a:".header {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n}",ae:"横は justify-content、縦は align-items です。",
  check:(d,w)=>{const s=w.getComputedStyle(d.querySelector(".header"));if(s.display!=="flex")return".header を flex にしましょう。";if(s.justifyContent!=="space-between")return"両端に分ける指定が足りません。";if(s.alignItems!=="center")return"縦方向を中央にそろえる指定が足りません。";return"";}},
 {id:"css-10",t:".card に、下の余白 24px・内側の余白 16px・角丸 12px・影（box-shadow）を付けよう。",html:"<div class=\"card\">カード1</div>\n<div class=\"card\">カード2</div>",starter:".card {\n  \n}",h:"`margin-bottom`、`padding`、`border-radius`、`box-shadow` を使います。影は `box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);` のように書きます。",a:".card {\n  margin-bottom: 24px;\n  padding: 16px;\n  border-radius: 12px;\n  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);\n}",ae:"box-shadow は「横のずれ 縦のずれ ぼかし 色」の順です。",
  check:(d,w)=>{const s=w.getComputedStyle(d.querySelector(".card"));if(s.marginBottom!=="24px")return"下の余白（margin-bottom）を 24px にしましょう。";if(s.paddingTop!=="16px"||s.paddingLeft!=="16px")return"内側の余白（padding）を 16px にしましょう。";if(s.borderTopLeftRadius!=="12px")return"角丸を 12px にしましょう。";if(s.boxShadow==="none")return"影（box-shadow）を付けましょう。";return"";}},
 {id:"css-7",t:".cards を横並び（flex）にして、画面幅が 600px 以下のときだけ縦並びにしよう。",html:"<div class=\"cards\">\n  <div>A</div>\n  <div>B</div>\n</div>",starter:".cards {\n  \n}\n\n@media () {\n  \n}",h:"`@media (max-width: 600px) { .cards { flex-direction: column; } }` を使います。",a:".cards {\n  display: flex;\n}\n\n@media (max-width: 600px) {\n  .cards {\n    flex-direction: column;\n  }\n}",ae:"ふだんは横並び、600px以下のときだけ縦並びに上書きします。",
  check:(d,w)=>{if(w.getComputedStyle(d.querySelector(".cards")).display!=="flex")return".cards を flex にしましょう。";let ok=false,mq=false;for(const sh of d.styleSheets){let rs;try{rs=sh.cssRules;}catch(e){continue;}for(const r of rs){if(r.media&&/max-width:\s*600px/.test(r.media.mediaText)){mq=true;for(const ir of r.cssRules){if(ir.selectorText&&ir.selectorText.trim()===".cards"&&ir.style.flexDirection==="column")ok=true;}}}}if(!mq)return"600px 以下で効く @media が見つかりません。";if(!ok)return"@media の中で .cards を縦並びにしましょう。";return"";}}
],
/* 上級 */
[
 {id:"css-6",t:".card の右上の角に .badge を重ねて表示しよう（上から0、右から0）。",html:"<div class=\"card\">\n  カード\n  <span class=\"badge\">NEW</span>\n</div>",starter:".card {\n  \n}\n.badge {\n  \n}",h:"親の .card に `position: relative;`、.badge に `position: absolute;` と `top`・`right` を指定します。",a:".card {\n  position: relative;\n}\n.badge {\n  position: absolute;\n  top: 0;\n  right: 0;\n}",ae:"親を relative にして基準を作り、子を absolute で配置します。",
  check:(d,w)=>{const c=w.getComputedStyle(d.querySelector(".card")),b=w.getComputedStyle(d.querySelector(".badge"));if(c.position!=="relative")return".card に基準となる position を指定しましょう。";if(b.position!=="absolute")return".badge の position を absolute にしましょう。";if(b.top!=="0px"||b.right!=="0px")return".badge の top と right を 0 にしましょう。";return"";}},
 {id:"css-11",t:".grid を、同じ幅の3列の Grid にして、間を 16px あけよう。",html:"<div class=\"grid\">\n  <div>1</div><div>2</div><div>3</div>\n  <div>4</div><div>5</div><div>6</div>\n</div>",starter:".grid {\n  \n}",h:"`display: grid;`、`grid-template-columns: repeat(3, 1fr);`、`gap` を使います。",a:".grid {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 16px;\n}",ae:"repeat(3, 1fr) は 1fr 1fr 1fr と同じです。",
  check:(d,w)=>{const s=w.getComputedStyle(d.querySelector(".grid"));if(s.display!=="grid")return".grid を display: grid にしましょう。";const cols=s.gridTemplateColumns.split(" ").map(parseFloat);if(cols.length!==3)return`今は ${cols.length} 列です。3列にしましょう。`;if(Math.max(...cols)-Math.min(...cols)>1)return"3列の幅をそろえましょう（1fr を使います）。";if(s.columnGap!=="16px")return"間（gap）を 16px にしましょう。";return"";}},
 {id:"css-12",t:".btn の背景色を #2d68cf にし、マウスを乗せたら #1d4ea8 に変わるようにしよう。変化は 0.3 秒かけてなめらかにします。",html:"<a class=\"btn\" href=\"#\" style=\"display:inline-block;padding:10px 20px;color:#fff\">予約する</a>",starter:".btn {\n  \n}\n.btn:hover {\n  \n}",h:"`.btn` に背景色と `transition: 0.3s;`、`.btn:hover` に変化後の背景色を書きます。",a:".btn {\n  background-color: #2d68cf;\n  transition: background-color 0.3s;\n}\n.btn:hover {\n  background-color: #1d4ea8;\n}",ae:"transition を元の .btn に書くと、離したときもなめらかに戻ります。プレビューでマウスを乗せて確かめてみましょう。",
  check:(d,w)=>{const s=w.getComputedStyle(d.querySelector(".btn"));if(s.backgroundColor!=="rgb(45, 104, 207)")return"ふだんの背景色を #2d68cf にしましょう。";if(!s.transitionDuration.split(",").some(x=>parseFloat(x)===0.3))return".btn に transition を 0.3 秒で指定しましょう。";const h=cssRule(d,".btn:hover");if(!h)return".btn:hover のスタイルが見つかりません。";if(h.style.backgroundColor!=="rgb(29, 78, 168)")return".btn:hover の背景色を #1d4ea8 にしましょう。";return"";}},
 {id:"css-13",t:".header を画面の一番上に固定しよう（左右いっぱいの幅）。",html:"<header class=\"header\" style=\"background:#333;color:#fff;padding:8px\">My Cafe</header>\n<p style=\"margin-top:60px\">本文です。スクロールしてもヘッダーは上に残ります。</p>",starter:".header {\n  \n}",h:"`position: fixed;`、`top: 0;`、`left: 0;`、`width: 100%;` を使います。",a:".header {\n  position: fixed;\n  top: 0;\n  left: 0;\n  width: 100%;\n}",ae:"fixed は画面に固定されます。width: 100% と left: 0 で左右いっぱいになります（padding がある場合は box-sizing: border-box も付けるとはみ出しません）。",
  check:(d,w)=>{const el=d.querySelector(".header"),s=w.getComputedStyle(el);if(s.position!=="fixed")return".header を position: fixed にしましょう。";if(s.top!=="0px")return"top を 0 にしましょう。";const r=el.getBoundingClientRect();if(Math.abs(r.left)>1)return"左端にそろえましょう（left: 0）。";if(r.width<w.innerWidth-2)return"左右いっぱいの幅にしましょう（width: 100%）。";return"";}},
 {id:"css-14",t:".grid を同じ幅の2列の Grid（間は 10px）にして、.wide だけ2列分の幅にしよう。",html:"<div class=\"grid\">\n  <div class=\"wide\" style=\"background:#ffe9b0\">おすすめ</div>\n  <div style=\"background:#dfe8ff\">A</div>\n  <div style=\"background:#dfe8ff\">B</div>\n</div>",starter:".grid {\n  \n}\n.wide {\n  \n}",h:"`.grid` に `grid-template-columns: 1fr 1fr;`、`.wide` に `grid-column: span 2;` を指定します。",a:".grid {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 10px;\n}\n.wide {\n  grid-column: span 2;\n}",ae:"span 2 で2列分にまたがるので、おすすめが上の段いっぱいに広がります。",
  check:(d,w)=>{const g=d.querySelector(".grid"),s=w.getComputedStyle(g);if(s.display!=="grid")return".grid を display: grid にしましょう。";const cols=s.gridTemplateColumns.split(" ");if(cols.length!==2)return`今は ${cols.length} 列です。2列にしましょう。`;if(s.columnGap!=="10px")return"間（gap）を 10px にしましょう。";const gw=g.clientWidth-parseFloat(s.paddingLeft)-parseFloat(s.paddingRight),ww=d.querySelector(".wide").getBoundingClientRect().width;if(Math.abs(gw-ww)>2)return".wide を2列分の幅にしましょう。";return"";}}
]];

/* ================= JavaScript ================= */
T.js=[
/* 初級 */
[
 {title:"変数",body:"変数は値に名前をつけて入れておく箱です。後から中身を変えない値は `const`、変える値は `let` で作ります。迷ったらまず `const` を使いましょう。\n変数名は英字・`_`・`$` から始め、数字から始めることはできません。`console.log()` で中身を確認できます（ブラウザの開発者ツールの Console に表示されます）。",
  code:`const siteName = "My Cafe";
let count = 0;
count = count + 1;   // count += 1; とも書ける

console.log(siteName); // My Cafe
console.log(count);    // 1`,
  quiz:[
   {id:"js-0-0",q:"あとから値を変更する変数を作るときに使うのは？",c:["`const`","`let`","`fix`","`var` しか使えない","`static`","`set`","`change`"],a:1,e:"`const` は再代入できません。変える予定があるなら `let` です。",w:{0:"`const` は再代入できません。",3:"`var` は古い書き方です。今は `let` と `const` を使います。",4:"JavaScriptで変数を作るのは `const` か `let` です。",5:"JavaScriptで変数を作るのは `const` か `let` です。",6:"JavaScriptで変数を作るのは `const` か `let` です。"}},
   {id:"js-0-1",q:"`console.log()` は何をする？",c:["画面に文字を表示する","Consoleに値を出力して確認する","データを保存する","ページを再読み込みする","エラーを直す","変数を消す","HTMLを書き換える"],a:1,e:"開発者ツールのConsoleに出力します。動作確認に欠かせません。",w:{0:"ページの画面には出ません。開発者ツールの Console に出ます。"}},
   {id:"js-0-2",q:"`const price = 100;` のあと `price = 200;` と書くとどうなる？",c:["200に変わる","エラーになる","100のまま無視される","300になる","0になる","undefinedになる","\"200\" という文字列になる"],a:1,e:"`const` で作った変数には再代入できないのでエラーになります。",w:{0:"変えられるのは `let` で作った変数です。"}},
   {id:"js-0-3",q:"変数名として使えないものは？",c:["`1st`","`first`","`firstName`","`_count`","`$price`","`item2`","`userName`"],a:0,e:"変数名は数字から始められません。英字・`_`・`$` から始めます。",w:{1:"これは変数名として使えます。",2:"これは変数名として使えます（2語目を大文字にする書き方をキャメルケースと言います）。",3:"`_` から始まる名前も使えます。",4:"`$` から始まる名前も使えます。",5:"数字が先頭でなければ使えます。",6:"これは変数名として使えます。"}},
   {id:"js-0-4",q:"次のコードで最後に表示される値は？",c:["7","3","4","34"],a:0,e:"x に足して入れ直します。"}
  ]},
 {title:"データの種類",body:"JavaScriptの値には種類（型）があります。文字列（`\"こんにちは\"`）、数値（`42`）、真偽値（`true` / `false`）、配列（`[1, 2, 3]`）、オブジェクト（`{ name: \"佐藤\" }`）などです。\n配列は0番目から数えるので、1つ目の要素は `[0]` で取り出します。個数は `length` でわかります。文字列と数値を `+` でつなぐと、文字としてつながる点に注意します。",
  code:`const menu = ["コーヒー", "紅茶", "ケーキ"];
console.log(menu[0]);      // コーヒー
console.log(menu.length);  // 3

console.log(typeof 42);    // "number"
console.log("5" + 3);      // "53"（文字としてつながる）`,
  quiz:[
   {id:"js-1-0",q:"`const a = [\"A\",\"B\",\"C\"]` のとき `a[1]` は？",c:["\"A\"","\"B\"","\"C\"","エラー"],a:1,e:"配列は0から数えます。"},
   {id:"js-1-1",q:"`\"5\" + 3` の結果は？",c:["8","\"53\"","エラー","\"8\""],a:1,e:"文字列の連結になります。"},
   {id:"js-1-2",q:"`typeof 42` の結果は？",c:["\"string\"","\"number\"","\"integer\"","\"boolean\"","\"float\"","\"object\"","\"digit\""],a:1,e:"JavaScriptでは整数も小数も \"number\" 型です。",w:{2:"JavaScriptには integer という型はありません。整数も number です。",4:"小数も number です。float という型はありません。",0:"\"42\" のように引用符で囲めば string ですが、42 は数値です。"}},
   {id:"js-1-3",q:"`true` や `false` の値の型は？",c:["真偽値（boolean）","文字列（string）","数値（number）","配列（array）","undefined","null","関数"],a:0,e:"`true`（正しい）・`false`（間違い）の2つだけをとる型を真偽値（boolean）と言います。",w:{1:"\"true\" のように引用符で囲むと文字列になりますが、true そのものは真偽値です。"}},
   {id:"js-1-4",q:"配列の要素の個数を調べるのは？",c:["`配列.length`","`配列.size`","`配列.count`","`配列.length()`","`配列.num`","`length(配列)`","`配列[length]`"],a:0,e:"`length` はプロパティなので `()` は付けません。",w:{3:"`length` はプロパティなので `()` は付けません。"}}
  ]},
 {title:"条件分岐",body:"`if` を使うと「もし〜なら」で処理を分けられます。条件に合わないときは `else` の中が実行され、条件を増やすときは `else if` を使います。\n等しいかどうかの比較は `===` を使います（`=` は代入なので注意）。「かつ」は `&&`、「または」は `||`、「〜ではない」は `!` です。",
  code:`const score = 75;

if (score >= 80) {
  console.log("A");
} else if (score >= 60) {
  console.log("B");
} else {
  console.log("C");
}

console.log(3 === 3);   // true
console.log("3" === 3); // false（型が違う）`,
  quiz:[
   {id:"js-2-0",q:"「等しい」を比べる演算子として推奨されるのは？",c:["`=`","`==`","`===`","`=>`","`!==`","`<=`","`=:`"],a:2,e:"`===` は型まで含めて比べるので安全です。`=` は代入です。"},
   {id:"js-2-1",q:"`if (score > 80)` で score が80のとき、if の中は実行される？",c:["実行される","実行されない","エラーになる","2回実行される"],a:1,e:"`>` は「より大きい」なので80は含みません。"},
   {id:"js-2-2",q:"「AかつB」を表す演算子は？",c:["`||`","`&&`","`!`","`==`","`+`","`AND`","`=>`"],a:1,e:"`&&` は「かつ」、`||` は「または」、`!` は「否定」です。"},
   {id:"js-2-3",q:"`!true` の値は？",c:["`false`","`true`","`0`","`\"true\"`","エラー","`undefined`","`1`"],a:0,e:"`!` は true と false を反対にします。"},
   {id:"js-2-4",q:"条件が3つ以上あるときの書き方は？",c:["`if … else if … else`","`if … if … if` を必ず使う","`else … if … else`","`if … else … else`","`when … then`","`if … elseif …`（スペースなし）","`switch` しか使えない"],a:0,e:"`else if` で条件を追加できます。上から順に調べて、最初に当てはまったところだけ実行されます。",w:{5:"JavaScriptでは `else if` と間にスペースを入れて書きます。",6:"`switch` も使えますが、`else if` でも書けます。",3:"`else` は最後に1つだけです。"}}
  ]}
],
