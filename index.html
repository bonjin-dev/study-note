<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bonjin’s study note</title>
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <button class="theme-btn" type="button" id="themeBtn">🌙 ダーク</button>
  <h1>bonjin’s study note</h1>
  <p>勉強したい練習帳を選んでね</p>
  <div class="cardlist">
      <a class="card coding" href="coding.html">
        <h2>コーディング練習帳</h2>
        <p>HTML・CSS・JavaScript・DBの練習</p>
        <div class="progress">
          <div class="progress-bar">
            <div class="progress-fill" id="coding-fill"></div>
          </div>
          <p class="progress-text" id="coding-text">〇% 正解済み</p>
        </div>
        <p class="start">はじめる→</p>
      </a>
      <a class="card java" href="java.html">
        <h2>Java-Beginner練習帳</h2>
        <p>Java・Spring Boot・JPA・テストの練習</p>
        <div class="progress">
          <div class="progress-bar">
            <div class="progress-fill" id="java-fill"></div>
          </div>
          <p class="progress-text" id="java-text">〇% 正解済み</p>
        </div>
        <p class="start">はじめる→</p>
      </a>
      <a class="card run" href="java-run.html">
        <h2>Java を書いて動かす練習</h2>
        <p>書いたコードを本物の Java で実行</p>
        <div class="progress">
          <div class="progress-bar">
            <div class="progress-fill" id="run-fill"></div>
          </div>
          <p class="progress-text" id="run-text">〇% 正解済み</p>
        </div>
        <p class="start">はじめる→</p>
      </a>
  </div>
  <script src="script.js"></script>
</body>
</html>
