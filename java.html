<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<title>Java-Beginner練習帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Source+Code+Pro:wght@400;600&display=swap">
<style>
/* Layout: 1カラムのノート。科目タブ → レベル切り替え → 項目チップ → 本文（解説→コード→クイズ） */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#e9edf3; --fg:#1d2433; --muted:#5d6779; --line:#d5dbe5;
  --ok:#1f8a4c; --ok-bg:#e3f4ea; --ng:#c23b3b; --ng-bg:#fbe8e8;
  --c-html:#d4501f; --c-css:#2d68cf; --c-js:#a87b00; --c-db:#0f8273;
  --code-bg:#1f2633; --code-fg:#e7ecf4;
  --f-display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-code:"Source Code Pro",ui-monospace,Menlo,Consolas,monospace;
  --accent:var(--c-html);
  --preview-bg:#ffffff; /* プレビューは常に白い紙として表示 */
  --dg-1:#2d68cf; --dg-2:#d4501f; --dg-hl:#fff3cf; /* 図：JOINの色分け・行の強調 */
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141922; --surface:#1c2330; --surface-2:#252e3e; --fg:#e6ebf3; --muted:#9aa5b8; --line:#323c4f;
  --ok:#5fd18f; --ok-bg:#173426; --ng:#f08080; --ng-bg:#3a1f22;
  --c-html:#ff8a5c; --c-css:#7aa7ff; --c-js:#f0c94a; --c-db:#4fd0bd;
  --code-bg:#0e1219; --code-fg:#e7ecf4; --dg-1:#5b8ff0; --dg-2:#e8794b; --dg-hl:#3a3420; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141922; --surface:#1c2330; --surface-2:#252e3e; --fg:#e6ebf3; --muted:#9aa5b8; --line:#323c4f;
  --ok:#5fd18f; --ok-bg:#173426; --ng:#f08080; --ng-bg:#3a1f22;
  --c-html:#ff8a5c; --c-css:#7aa7ff; --c-js:#f0c94a; --c-db:#4fd0bd;
  --code-bg:#0e1219; --code-fg:#e7ecf4; --dg-1:#5b8ff0; --dg-2:#e8794b; --dg-hl:#3a3420; color-scheme:dark}

[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.75}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
header h1{font-family:var(--f-display);font-weight:800;font-size:1.6rem;margin:0;letter-spacing:.02em;text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted);font-size:.9rem}

.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cat{font:inherit;color:var(--fg);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.cat b{font-family:var(--f-display);font-size:1.05rem;line-height:1.2}
.cat small{color:var(--muted);font-size:.72rem;font-variant-numeric:tabular-nums}
.cat .bar{width:80%;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.cat .bar i{display:block;height:100%;background:var(--c)}
.cat[aria-selected="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.cat[aria-selected="true"] b{color:var(--c)}

.lvs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);border-radius:12px;padding:4px}
.lv{font:inherit;border:0;background:transparent;border-radius:9px;padding:6px 4px;cursor:pointer;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.lv b{font-family:var(--f-display);font-size:.95rem;color:var(--fg);line-height:1.4}
.lv small{font-size:.72rem;font-variant-numeric:tabular-nums}
.lv[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 3px color-mix(in srgb,var(--fg) 18%,transparent)}
.lv[aria-selected="true"] b{color:var(--accent)}

.cat:focus-visible,.lv:focus-visible,.chip:focus-visible,.choice:focus-visible,.btn:focus-visible,.exbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.88rem;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--surface-2)}
.chip .dot.done{background:var(--ok)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chip.special{border-style:dashed;border-color:var(--accent);color:var(--accent);font-weight:700}
.chip.special[aria-pressed="true"]{color:var(--surface);border-style:solid}
.chip.miss{border-color:var(--ng);color:var(--ng);font-weight:700}
.chip.miss[aria-pressed="true"]{background:var(--ng);border-color:var(--ng);color:var(--surface)}
.chip .cnt{font-variant-numeric:tabular-nums}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.eyebrow{font-size:.75rem;letter-spacing:.12em;color:var(--accent);font-weight:700}
.panel h2{font-family:var(--f-display);font-size:1.35rem;margin:0;line-height:1.4;text-wrap:balance}
.panel h3{font-family:var(--f-display);font-size:1.05rem;margin:8px 0 0;display:flex;align-items:center;gap:8px}
.panel h3::before{content:"";width:6px;height:1.1em;border-radius:3px;background:var(--accent)}
.lead p{margin:0 0 .6em;max-width:65ch}
.sub{margin:0;color:var(--muted);font-size:.9rem}
code{font-family:var(--f-code);font-size:.9em;background:var(--surface-2);padding:1px 5px;border-radius:5px;word-break:break-word}
pre{margin:0;background:var(--code-bg);color:var(--code-fg);border-radius:10px;padding:14px 16px;overflow-x:auto;font-family:var(--f-code);font-size:.86rem;line-height:1.6}
pre code{background:none;padding:0;font-size:inherit;word-break:normal;color:inherit}
.codehead{display:flex;justify-content:space-between;align-items:center;font-size:.75rem;color:var(--muted);margin-bottom:4px}

.q{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.q .qt{font-weight:700;margin:0}
.q .qn{color:var(--accent);font-family:var(--f-display);margin-right:6px}
.qlabel{font-size:.75rem;color:var(--muted);margin:0}
.tag{display:inline-block;font-size:.72rem;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 8px;margin-right:6px;vertical-align:2px}
.choices{display:grid;gap:8px}
.choice{font:inherit;text-align:left;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;line-height:1.5;min-width:0}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice:disabled{cursor:default}
.choice.right{background:var(--ok-bg);border-color:var(--ok);color:var(--fg)}
.choice.wrong{background:var(--ng-bg);border-color:var(--ng)}
.fb{font-size:.92rem;border-radius:8px;padding:8px 12px;background:var(--surface-2)}
.fb strong.ok{color:var(--ok)} .fb strong.ng{color:var(--ng)}
.why{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.why b{color:var(--ng)}
.why.small{color:var(--muted);font-size:.82rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-weight:700;font-size:.9rem;border-radius:10px;padding:8px 16px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.score{font-family:var(--f-display);font-size:1.1rem}
.empty{text-align:center;padding:24px 12px;color:var(--muted)}
.empty b{display:block;font-family:var(--f-display);color:var(--fg);font-size:1.1rem;margin-bottom:4px}

/* 書いて練習 */
.note{font-size:.85rem;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 12px;margin:0}
textarea{width:100%;box-sizing:border-box;min-height:120px;font-family:var(--f-code);font-size:.92rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;line-height:1.5}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;max-height:320px}
table{border-collapse:collapse;width:100%;font-size:.86rem;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--surface-2);font-family:var(--f-code);font-weight:600;position:sticky;top:0}
.tname{font-family:var(--f-code);font-weight:600;font-size:.85rem;margin:4px 0}
.exlist{display:flex;flex-wrap:wrap;gap:6px}
.exbtn{font:inherit;font-size:.82rem;width:2.2em;height:2.2em;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;font-variant-numeric:tabular-nums}
.exbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--surface)}
.exbtn.done{border-color:var(--ok);color:var(--ok)}
.exbtn.done[aria-pressed="true"]{background:var(--ok);color:var(--surface)}
.err{color:var(--ng);font-family:var(--f-code);font-size:.85rem;white-space:pre-wrap}
.pv{width:100%;box-sizing:border-box;height:200px;border:1px solid var(--line);border-radius:10px;background:var(--preview-bg)}
pre.console{white-space:pre-wrap;word-break:break-word}
pre.console .err{color:var(--ng)}
/* 図 */
.fig{margin:0;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg);min-width:0;overflow-x:auto}
.fig figcaption{font-size:.84rem;color:var(--muted);line-height:1.6}
.fig .ft{font-size:.72rem;letter-spacing:.12em;color:var(--accent);font-weight:700}
.dg-box{border:1.5px solid var(--fg);border-radius:8px;padding:6px 10px 10px;min-width:0}
.dg-dash{border-style:dashed;border-color:var(--muted)}
.dg-acc{border-color:var(--accent)}
.dg-soft{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.dg-lbl{display:block;font-family:var(--f-code);font-size:.75rem;font-weight:600}
.dg-acc>.dg-lbl{color:var(--accent)}
.dg-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.dg-chip{font-family:var(--f-code);font-size:.78rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin-top:6px}
.dg-note{display:block;font-size:.75rem;color:var(--muted);margin-top:6px;line-height:1.4}
.dg-cap{font-size:.78rem;font-weight:700;margin-bottom:4px}
.dg-bar{border:1.5px solid var(--fg);border-radius:6px;padding:2px 8px;margin-top:6px;font-family:var(--f-code);font-size:.78rem}
.dg-line{font-size:.9rem;line-height:2;border:1.5px dashed var(--muted);border-radius:6px;padding:4px 8px}
.dg-inl{border:1.5px solid var(--accent);color:var(--accent);border-radius:4px;padding:0 4px;font-family:var(--f-code);font-size:.75rem}
.dg-row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:.78rem}
.dg-arrow{color:var(--muted);font-weight:700;font-size:.8rem}
.fig table.dg-table{width:auto;border-collapse:separate;border-spacing:0;font-size:.82rem}
.fig .dg-table th,.fig .dg-table td{border:1px solid var(--line);padding:4px 8px;position:static;white-space:nowrap;background:var(--surface)}
.fig .dg-table th{background:var(--surface-2)}
.fig .dg-table small{display:block;font-family:var(--f-code);font-size:.68rem;color:var(--muted);font-weight:400}
.fig .dg-table td.dg-side{border:0;background:none;color:var(--muted);font-size:.72rem;font-family:var(--f-code)}
.fig .dg-table .hl td{background:var(--dg-hl)}
.fig .dg-table .pk{font-weight:700;color:var(--accent)}
.fig .dg-table .dup{background:var(--ng-bg)}
.swatch{display:inline-block;width:.9em;height:.9em;border-radius:3px;vertical-align:-1px;margin-right:4px}
.bm{border-radius:8px;padding:6px 12px 12px}
.bm-m{border:1.5px dashed var(--muted)}
.bm-b{border:3px solid var(--fg);margin-top:4px}
.bm-p{background:color-mix(in srgb,var(--accent) 14%,var(--surface));margin-top:4px}
.bm-c{border:1.5px solid var(--accent);background:var(--surface);text-align:center;padding:10px;margin-top:6px;font-family:var(--f-code);font-size:.8rem}
.fx{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.fx-box{border:2px solid var(--fg);border-radius:8px;padding:6px 10px 10px}
.fx-items{display:flex;gap:10px;align-items:center;margin-top:6px}
.fx-i{border:1.5px solid var(--accent);background:var(--surface);border-radius:6px;width:44px;display:flex;align-items:center;justify-content:center;font-family:var(--f-code);font-size:.8rem}
.fx-v{display:flex;flex-direction:column;align-items:center;font-size:.72rem;color:var(--muted);text-align:center;line-height:1.3}
.fx-v span,.fx-h span{color:var(--accent);font-size:1.2rem;font-weight:700}
.fx-h{font-size:.75rem;color:var(--muted)}
.ps{position:relative;border:2px solid var(--fg);border-radius:8px;padding:10px 10px 8px;min-height:100px;display:flex;flex-direction:column;justify-content:space-between}
.ps-badge{position:absolute;top:0;right:0;background:var(--accent);color:var(--surface);border-radius:0 6px 0 8px;padding:4px 10px;font-family:var(--f-code);font-size:.72rem;text-align:center;line-height:1.4}
.ps-text{font-size:.85rem;color:var(--muted);padding-right:110px}
.gd{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border:1.5px dashed var(--muted);border-radius:8px;padding:8px}
.gd-i{border:1.5px solid var(--fg);background:var(--surface);border-radius:6px;text-align:center;padding:6px 4px;font-family:var(--f-code);font-size:.75rem;min-width:0}
.gd-w{grid-column:span 2;border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.gd-ruler{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 10px;font-family:var(--f-code);font-size:.72rem;color:var(--accent);text-align:center}
.gd-ruler span{border-top:2px solid var(--accent);padding-top:2px}
.arr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:2px solid var(--fg);border-radius:8px;overflow:hidden}
.arr-c{display:flex;flex-direction:column;align-items:center;padding:8px 4px;border-right:1px solid var(--line);background:var(--surface);font-size:.85rem;min-width:0}
.arr-c:last-child{border-right:0}
.arr-c small{font-family:var(--f-code);color:var(--accent);font-weight:600}
.dg-mono{font-family:var(--f-code);font-size:.78rem;overflow-wrap:anywhere}
.fl{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.fl-q{border:2px solid var(--accent);border-radius:999px;padding:3px 14px;font-family:var(--f-code);font-size:.8rem;color:var(--accent);font-weight:600}
.fl-br{display:flex;align-items:center;gap:8px;margin-left:24px;flex-wrap:wrap}
.fl-y{font-size:.75rem;color:var(--ok);font-weight:700}
.fl-n{font-size:.75rem;color:var(--muted);font-weight:700;margin-left:24px}
.fl-r{border:1.5px solid var(--fg);border-radius:6px;padding:2px 10px;font-family:var(--f-code);font-size:.8rem;background:var(--surface)}
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.st{border:1.5px solid var(--fg);border-radius:8px;padding:6px 10px;font-size:.8rem;background:var(--surface);line-height:1.4;max-width:15em}
.st b{display:block;font-family:var(--f-code);font-size:.72rem;color:var(--accent)}
.id1,.id2{display:inline-block;min-width:1.4em;text-align:center;border-radius:4px;color:var(--surface);font-weight:700;font-family:var(--f-code)}
.id1{background:var(--dg-1)} .id2{background:var(--dg-2)}
.jn{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.jn-mid{font-family:var(--f-code);font-size:.72rem;color:var(--accent);text-align:center;line-height:1.5}
.tx-split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tx-ok,.tx-ng{border-radius:8px;padding:8px 10px;font-size:.82rem;line-height:1.5;border:1.5px solid}
.tx-ok{border-color:var(--ok);background:var(--ok-bg)} .tx-ok b{color:var(--ok)}
.tx-ng{border-color:var(--ng);background:var(--ng-bg)} .tx-ng b{color:var(--ng)}
.tx-split small{color:var(--muted)}
@media (max-width:420px){.dg-cols,.tx-split{grid-template-columns:1fr}.ps-text{padding-right:0;padding-top:40px}}

/* 答えの1行ずつ解説 */
.ax{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:8px}
.ax-r{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:4px 14px;padding:6px 12px;border-bottom:1px solid var(--line);align-items:start}
.ax-r:last-child{border-bottom:0}
.ax-c{display:block;white-space:pre;overflow-x:auto;background:none;padding:0;font-size:.82rem;color:var(--fg)}
.ax-t{font-size:.82rem;color:var(--muted);line-height:1.5}
.ax-h{font-size:.75rem;font-weight:700;color:var(--accent);background:var(--surface-2)}
.ax-sum{font-size:.85rem;margin-top:8px}
@media (max-width:520px){.ax-r{grid-template-columns:1fr}}

/* よくあるまちがい */
.mk{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mk h3{margin:0}
.mk-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mk-pair>div{min-width:0}
.mk-tag{display:inline-block;font-size:.72rem;font-weight:700;padding:0 8px;border-radius:999px;margin-bottom:4px}
.mk-bad .mk-tag{background:var(--ng-bg);color:var(--ng)}
.mk-good .mk-tag{background:var(--ok-bg);color:var(--ok)}
.mk-bad pre{box-shadow:inset 4px 0 0 var(--ng)}
.mk-good pre{box-shadow:inset 4px 0 0 var(--ok)}
.mk p{margin:0;font-size:.9rem}
@media (max-width:560px){.mk-pair{grid-template-columns:1fr}}
.chip.tips{border-style:dashed;border-color:var(--muted);color:var(--fg);font-weight:700}
.chip.tips[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--surface)}

/* 動かして確かめる */
.play{border:1.5px solid var(--accent);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.play .ft{font-size:.72rem;letter-spacing:.12em;color:var(--accent);font-weight:700}
.pl-ctrls{display:flex;flex-direction:column;gap:8px}
.pl-c{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.pl-l{font-family:var(--f-code);font-size:.78rem;font-weight:600;min-width:9em}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{font:inherit;font-family:var(--f-code);font-size:.76rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:3px 8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.pl-stage{border:1.5px dashed var(--muted);border-radius:8px;padding:10px;background:var(--bg);min-width:0;overflow:hidden}
.pl-code{font-size:.8rem}
.pl-i{border:1.5px solid var(--accent);background:var(--surface);border-radius:6px;min-width:44px;padding:4px 8px;display:flex;align-items:center;justify-content:center;font-family:var(--f-code);font-size:.8rem}
.pl-flex{min-height:150px}
.pl-grid .pl-i{min-width:0}
.pl-bmo{border:1.5px dashed var(--muted);display:flow-root;width:fit-content;max-width:100%}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>");
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const B="`";

const SUBJ={
  kiso:{name:"基礎編",full:"基礎編（VS Code）",color:"--c-html"},
  ouyou:{name:"応用編",full:"応用編（Eclipse）",color:"--c-css"}
};
const LV=["初級","中級","上級"];
/* T[科目][レベル] = 項目（各5問）、ADV[科目][レベル] = 応用問題、WR[科目][レベル] = 書いて練習 */
const T={},ADV={},WR={},GEN={};
let SQLW=[];
/* SQL練習・DB問題で使う会員データ */
const MEM=[[1,"佐藤",28,"東京"],[2,"鈴木",35,"大阪"],[3,"高橋",22,"東京"],[4,"田中",41,"福岡"],[5,"伊藤",30,"札幌"],[6,"渡辺",26,"大阪"]];

/* ================= 基礎編（VS Code） ================= */
T.kiso=[
/* 初級 */
[
 {title:"変数とデータ型",body:"変数はデータを入れる名前付きの箱で、`データ型 変数名 = 値;` で宣言と初期化を同時にできます。整数は `int`（いちばんよく使う）、小数は `double` が基本です。大きな整数の `long` は末尾に `L`、`float` は末尾に `f` を付けます。\n小さい型から大きい型へは自動で変換されます（拡大変換）が、大きい型から小さい型へはキャスト `(int)` が必要です（縮小変換）。キャストすると小数部は切り捨てられます。文字列は `String` で、内容の比較には `==` ではなく `equals()` を使います。",
  code:`int x = 10;
double y = x;            // 小→大は自動（拡大変換）10.0

double a = 12.34;
int b = (int) a;         // 大→小はキャストが必要（縮小変換）12

long big = 10000000000L; // long は末尾に L
float f = 3.14f;         // float は末尾に f

String name = "John";
String full = name + " Doe";                      // 連結
int len = full.length();                          // 長さ
boolean same = name.equals("John");               // 内容の比較
String msg = String.format("%sは%d歳", name, 30);   // フォーマット`,
  quiz:[
   {q:"整数で、いちばんよく使う型は？",c:["`int`","`long`","`double`","`float`","`byte`","`short`","`String`"],a:0,e:"整数は `int`、小数は `double` が基本です。",w:{1:"`long` は大きい整数用で、値の末尾に L を付けます。",2:"`double` は小数の型です。",4:"`byte` は小さい数用です。"}},
   {q:"`long` に大きな数を入れる正しい書き方は？",c:["`long big = 10000000000L;`","`long big = 10000000000;`","`long big = 10000000000f;`","`long big = \"10000000000\";`","`long big = 10000000000.0;`","`long big = long(10000000000);`","`long big = 10000000000D;`"],a:0,e:"int の範囲を超える数は、末尾に L を付けて long の値だと示します。",w:{1:"L がないと int の値として扱われ、範囲を超えてエラーになります。",2:"f は float の印です。"}},
   {q:"`double a = 12.34; int b = (int) a;` の b は？",c:["12","12.34","13","エラー"],a:0,e:"キャストで小数部が切り捨てられます。"},
   {q:"`int x = 10; double y = x;` について正しいのは？",c:["自動で変換されて y は 10.0 になる","キャストが必要でコンパイルエラー","y は 10 のまま整数","y は 0.0 になる","x も double になる","実行時エラー","y は \"10\" になる"],a:0,e:"小さい型 → 大きい型は自動で変換されます（拡大変換）。",w:{1:"キャストが必要なのは、大きい型 → 小さい型（縮小変換）のときです。"}},
   {q:"文字列の内容を比べるときに使うのは？",c:["`equals()`","`==`","`===`","`compare()`","`equal()`","`is()`","`=`"],a:0,e:"`==` は「同じ物か（参照）」を比べるため、内容の比較には `equals()` を使います。",w:{1:"`==` は同じ物か（参照）を比べるので、中身が同じでも false になることがあります。",2:"`===` は JavaScript の演算子です。",6:"`=` は代入です。"}}
  ]},
 {title:"演算子・スコープ・命令文",body:"算術演算子は `+` `-` `*` `/` `%`（余り）、比較は `==` `!=` `>` `>=` など、論理は `&&`（かつ）`||`（または）`!`（否定）です。`条件 ? 値1 : 値2` の三項演算子は、条件によって値を選べます。\n`{ }` の中で宣言した変数は、その `{ }` の中でしか使えません（スコープ）。条件分岐は `if`・`switch`、ループは `for`・`while`・`do-while` です。`do-while` は最低1回は実行されます。0 で割ると `ArithmeticException`、int の最大値を超えるとオーバーフローして値がおかしくなります。",
  code:`int a = 7 % 3;                       // 1（余り）
String s = (a > 0) ? "正" : "0以下";   // 三項演算子

if (a > 0) { … } else { … }

switch (a) {
    case 1: System.out.println("1"); break;
    default: System.out.println("その他");
}

for (int i = 0; i < 5; i++) { … }
while (条件) { … }
do { … } while (条件);   // 最低1回は実行される`,
  quiz:[
   {q:"`%` 演算子の意味は？",c:["割り算の余り","割り算の商","パーセント","掛け算","比較","代入","否定"],a:0,e:"`7 % 3` は 1 です。偶数かどうかは `n % 2 == 0` で調べられます。"},
   {q:"三項演算子の結果は？",c:["\"大\"","\"小\""],a:0,e:"条件で値を選びます。"},
   {q:"`do { … } while (条件);` の特徴は？",c:["条件に関係なく最低1回は実行される","1回も実行されないことがある","条件が true のときだけ1回実行","無限ループ専用","for と同じ","switch の一種","エラーになる"],a:0,e:"先に1回実行してから条件を調べます。",w:{1:"それは while の特徴です（最初に条件を調べるため）。"}},
   {q:"次のコードはどうなる？",code:`if (true) {
    int count = 5;
}
System.out.println(count);`,c:["コンパイルエラー（count は { } の外で使えない）","5 と表示される","0 と表示される","null と表示される","実行時に例外","何も表示されない","true と表示される"],a:0,e:"`{ }` の中で宣言した変数は、その中でしか使えません（スコープ）。"},
   {q:"整数を 0 で割ると？",c:["ArithmeticException が発生する","0 になる","無限大になる","null になる","NumberFormatException が発生する","警告だけ出る","1 になる"],a:0,e:"整数の 0 除算は ArithmeticException です。",w:{4:"NumberFormatException は数字にできない文字列を変換したときです。"}}
  ]},
 {title:"命名規則と予約語",body:"名前の付け方にはルールがあります。クラスは大文字始まり（`MyClass`、アッパーキャメル）、メソッド・変数は小文字始まり（`myMethod`、キャメル）、定数は全部大文字と `_`（`MAX_VALUE`）です。\n数字から始まる名前は使えず、大文字・小文字は区別されます。`if`・`class`・`public`・`static`・`return` などの予約語は、そのまま名前にはできません。ただし `ifVariable` のように予約語を含むだけの名前は使えます。",
  code:`public class CustomerService {          // クラス：大文字始まり
    static final int MAX_VALUE = 100;    // 定数：全部大文字＋_

    public void findCustomer() {         // メソッド：小文字始まり
        int customerCount = 0;           // 変数：小文字始まり
        int ifCount = 1;                 // 予約語を「含む」だけならOK
        // int if = 1;                   // ✕ 予約語そのものはNG
        // int 1count = 1;               // ✕ 数字から始まるのはNG
    }
}`,
  quiz:[
   {q:"クラス名として慣習に合っているのは？",c:["`CustomerService`","`customerService`","`customer_service`","`CUSTOMER_SERVICE`","`1Customer`","`customer-service`","`Customer Service`"],a:0,e:"クラスは大文字始まりで、単語の区切りも大文字にします（アッパーキャメル）。",w:{1:"小文字始まりはメソッドや変数の書き方です。",3:"全部大文字は定数の書き方です。",4:"数字から始まる名前は使えません。",5:"`-` は名前に使えません。",6:"名前にスペースは入れられません。"}},
   {q:"定数の名前として慣習に合っているのは？",c:["`MAX_VALUE`","`maxValue`","`MaxValue`","`max-value`","`max value`","`maxvalue`","`Max_value`"],a:0,e:"定数は全部大文字で、単語の区切りに `_` を使います。",w:{1:"小文字始まりは変数・メソッドの書き方です。",2:"大文字始まりはクラスの書き方です。"}},
   {q:"変数名として使えないものは？",c:["`1myVar`","`myVar1`","`ifVariable`","`_count`","`$price`","`userName`","`whileFlag`"],a:0,e:"数字から始まる名前は使えません。",w:{2:"予約語を含むだけの名前は使えます。ダメなのは `if` そのものです。",6:"予約語を含むだけの名前は使えます。"}},
   {q:"予約語の説明として正しいのは？",c:["Java が特別な意味で使うので、名前にできない単語","大文字で書く単語","クラス名だけに使える単語","コメントの中に書く単語","変数の型のこと","メソッドの戻り値","自分で予約して使う名前"],a:0,e:"if・class・public・static・return などです。"},
   {q:"`myName` と `myname` は？",c:["別の名前として扱われる","同じ名前として扱われる","どちらもエラー","myname だけ使える","myName だけ使える","コンパイラが自動で直す","実行時にどちらかに統一される"],a:0,e:"Java は大文字・小文字を区別します。"}
  ]}
],
/* 中級 */
[
 {title:"クラスとメソッド",body:"クラスはデータ（フィールド）と操作（メソッド）をまとめた設計図で、インスタンスは設計図から作った実物です。`new クラス名()` でインスタンスを作ります。作るときに呼ばれる初期化用の特別なメソッドがコンストラクタです。\nメソッドは `戻り値の型 メソッド名(引数の型 引数名, …)` の形で書き、戻り値がないときは `void` にします。同じ名前で引数の型や数が違うメソッドを複数作ることをオーバーロードと言います。同じクラスのメソッドは、名前だけで呼べます。",
  code:`public class Car {
    private String brand;          // フィールド

    public Car(String brand) {     // コンストラクタ（初期化）
        this.brand = brand;
    }

    public void start() {          // メソッド
        System.out.println("The car is starting.");
    }
}

Car myCar = new Car("Toyota");    // インスタンス化
myCar.start();`,
  quiz:[
   {q:"クラスからインスタンスを作るキーワードは？",c:["`new`","`create`","`make`","`class`","`this`","`build`","`instance`"],a:0,e:"`new クラス名(…)` でインスタンスを作ります。"},
   {q:"コンストラクタの特徴は？",c:["クラスと同じ名前で、戻り値の型を書かない","必ず void を書く","static を付ける","名前は自由","return で値を返す","1つのクラスに1つだけ","main から必ず呼ぶ"],a:0,e:"new したときに自動で呼ばれ、フィールドの初期化に使います。",w:{5:"引数の違うコンストラクタを複数作れます。"}},
   {q:"戻り値がないメソッドの戻り値の型は？",c:["`void`","`null`","`none`","`empty`","`int`","`return`","`undefined`"],a:0,e:"`void` の場合は return で値を返す必要がありません。"},
   {q:"同じ名前で、引数の型や数が違うメソッドを複数作ることを何と言う？",c:["オーバーロード","オーバーライド","カプセル化","継承","インスタンス化","キャスト","ポリモーフィズム"],a:0,e:"呼ぶときの引数によって、どれが使われるかが決まります。",w:{1:"オーバーライドは、親クラスのメソッドを子クラスで書き換えることです。"}},

 {title:"テスト（JUnit5 / Mockito）",body:"テストには、1クラス・1メソッドを確かめる単体テスト、Controller から DB までの連携を確かめる結合テスト、画面操作を含む全体を確かめる E2E テストがあります。テストケースは、正常系・異常系・境界値（0、最大値、null）・副作用（save が1回呼ばれたか）の観点で考えます。\nJUnit5 では「準備（Arrange）→ 実行（Act）→ 検証（Assert）」の順に書きます。Mockito では、`@Mock` で Repository を偽物にし、`@InjectMocks` でテスト対象に入れます。`when(…).thenReturn(…)` で偽物の返す値を決め、`verify(…, times(1))` で呼ばれた回数を確認します。",

/* ===== 問題を作る：正解1つ＋まちがい候補から3つ、並びもシャッフル ===== */
function makeQ(base){
  let g=null;
  if(GEN[base.id]){try{g=GEN[base.id]();}catch(e){g=null;}}
  if(!g){
    const why={}; Object.entries(base.w||{}).forEach(([k,v])=>{why[base.c[k]]=v;});
    g={q:base.q,code:base.code,e:base.e,right:base.c[base.a],wrong:base.c.filter((x,i)=>i!==base.a),why};
  }
  const right=String(g.right);
  const wrong=shuf([...new Set(g.wrong.map(String))].filter(w=>w!==right)).slice(0,3);
  const c=shuf([right,...wrong]);
  return {q:g.q,code:g.code,e:g.e,c,a:c.indexOf(right),why:g.why||{}};
}
/* まちがえた選択肢の解説 */
function whyOf(q,txt){
  if(q.why&&q.why[txt]) return q.why[txt];
  const m=/^`([^`]+)`$/.exec(txt); const k=m?m[1]:txt;
  if(Object.prototype.hasOwnProperty.call(TERMS,k)) return TERMS[k]===null?"このような書き方はありません。":TERMS[k];
  return "";
}

function quizHTML(items){
  return items.map((it,n)=>`<div class="q" data-id="${it.id}" data-a="${it.q.a}">
      ${it.label?`<p class="qlabel">${esc(it.label)}</p>`:""}
      <p class="qt"><span class="qn">Q${n+1}</span>${it.adv?`<span class="tag">応用</span>`:""}${md(it.q.q)}</p>
      ${it.q.code?`<pre><code>${esc(it.q.code)}</code></pre>`:""}
      <div class="choices">${it.q.c.map((c,i)=>`<button class="choice" data-i="${i}">${md(c)}</button>`).join("")}</div>
      <div class="fb" hidden></div>
      ${store.ok[it.id]?`<small style="color:var(--ok)">● 前に正解済み</small>`:""}
    </div>`).join("");
}
function bindQuiz(root,items,onAnswer){
  root.querySelectorAll(".q").forEach((box,idx)=>{
    const it=items[idx];
    box.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>{
      const a=it.q.a, i=+b.dataset.i, ok=a===i, chosen=it.q.c[i];
      box.querySelectorAll(".choice").forEach((x,j)=>{x.disabled=true; if(j===a) x.classList.add("right");});
      let extra="";
      if(ok){
        store.ok[it.id]=true;
        if(store.miss[it.id]){delete store.miss[it.id]; extra=`<div class="why small">苦手リストから外しました。</div>`;}
      }else{
        b.classList.add("wrong");
        store.miss[it.id]=(store.miss[it.id]||0)+1;
        const w=whyOf(it.q,chosen);
        if(w) extra+=`<div class="why"><b>あなたの答え</b> ${md(chosen)}<br>${md(w)}</div>`;
        extra+=`<div class="why small">苦手リストに追加しました。</div>`;
      }
      save(); refreshNav();
      const fb=box.querySelector(".fb"); fb.hidden=false;
      fb.innerHTML=`<strong class="${ok?"ok":"ng"}">${ok?"正解！":"おしい！"}</strong> ${md(it.q.e)}${extra}`;
      onAnswer&&onAnswer(ok);
    }));
  });
}

/* ===== 動かして確かめる（部品） ===== */
function mkPlay(cfg){
  return root=>{
    const st={}; cfg.controls.forEach(c=>{st[c.k]=c.d!==undefined?c.d:c.v[0];});
    root.innerHTML=`<div class="pl-ctrls">${cfg.controls.map(c=>`<div class="pl-c"><span class="pl-l">${esc(c.label||c.k)}</span><div class="seg" role="group" aria-label="${esc(c.label||c.k)}">${c.v.map(v=>`<button type="button" data-k="${esc(c.k)}" data-v="${esc(v)}" aria-pressed="${String(st[c.k])===String(v)}">${esc(v)}</button>`).join("")}</div></div>`).join("")}</div>${cfg.stage||""}<div class="pl-view"></div>${cfg.note?`<p class="sub">${md(cfg.note)}</p>`:""}`;
    const draw=()=>{if(cfg.view) root.querySelector(".pl-view").innerHTML=cfg.view(st); if(cfg.update) cfg.update(root,st);};
    root.addEventListener("click",e=>{
      const b=e.target.closest("[data-k]"); if(!b) return;
      const c=cfg.controls.find(x=>x.k===b.dataset.k); st[c.k]=c.v.find(v=>String(v)===b.dataset.v);
      b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); draw();
    });
    draw();
  };
}
/* CSSの値を切り替えて見本に当てる */
function cssPlay({stage,rules,note,after}){
  const controls=rules.flatMap((r,ri)=>r.props.map(p=>({k:ri+"|"+p.p,label:(rules.length>1?r.sel+" の ":"")+p.p,v:p.v,d:p.d})));
  return mkPlay({controls,note,stage:`<div class="pl-stage">${stage}</div><pre class="pl-code"><code></code></pre>`,
    update:(root,st)=>{
      rules.forEach((r,ri)=>root.querySelectorAll(r.t).forEach(el=>r.props.forEach(p=>el.style.setProperty(p.p,st[ri+"|"+p.p]))));
      root.querySelector(".pl-code code").textContent=rules.map((r,ri)=>`${r.sel} {\n${(r.fixed||[]).map(f=>`  ${f}\n`).join("")}${r.props.map(p=>`  ${p.p}: ${st[ri+"|"+p.p]};`).join("\n")}\n}`).join("\n");
      if(after) after(root,st);
    }});
}
const miniTable=(cols,rows,cls)=>`<div class="tbl"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${rows.length?rows.map((r,i)=>`<tr class="${cls?cls(r,i):""}">${r.map(v=>`<td>${v===null?"NULL":esc(v)}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${cols.length}">（0行）</td></tr>`}</tbody></table></div>`;

const normAns=(s,cs)=>{const x=String(s).replace(/[\s　]+/g,"").replace(/;+$/,"").replace(/'/g,'"');return cs?x:x.toLowerCase();};
function renderFill(){
  const list=FILL[state.cat][state.lv], cs=true;
  const cleared=list.filter(q=>store.fill[q.id]).length;
  $("#panel").innerHTML=`
    <div><div class="eyebrow">${SUBJ[state.cat].full} ・ ${LV[state.lv]} ・ 入力問題 ・ ${cleared} / ${list.length} 正解</div><h2>入力問題</h2></div>
    <p class="sub">コードの <mark class="blank">___</mark> に入る言葉を入力して、Enter か「答え合わせ」を押しましょう。前後のスペースや ; は気にしなくて大丈夫です。Java は大文字・小文字を区別するので注意しましょう（例：String と string は別物）。</p>
    <div id="fillbox" style="display:flex;flex-direction:column;gap:16px">${list.map((q,n)=>`<div class="q" data-n="${n}">
      <p class="qt"><span class="qn">Q${n+1}</span>${md(q.q)}${store.fill[q.id]?` <small style="color:var(--ok);font-weight:400">● 正解済み</small>`:""}</p>
      <pre><code>${esc(q.code).replace(/___/g,'<mark class="blank">___</mark>')}</code></pre>
      <div class="fill-row">
        <input class="fill-in" id="fill-${q.id}" aria-label="Q${n+1}の答え" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ここに入力">
        <button class="btn" data-check="${n}">答え合わせ</button>
        <button class="btn ghost" data-hint="${n}">ヒント</button>
      </div>
      <div class="fb" hidden></div>
    </div>`).join("")}</div>`;
  const panel=$("#fillbox");
  const check=n=>{
    const q=list[n],box=panel.querySelector(`.q[data-n="${n}"]`),inp=box.querySelector("input"),fb=box.querySelector(".fb");
    if(!inp.value.trim()){fb.hidden=false;fb.innerHTML=`<strong class="ng">入力してください</strong> ___ に入る言葉を書いてから答え合わせしましょう。`;return;}
    const ok=q.ans.some(a=>normAns(a,cs)===normAns(inp.value,cs));
    fb.hidden=false;
    if(ok){
      inp.classList.add("ok");
      fb.innerHTML=`<strong class="ok">正解！</strong> ${md(q.e)}`;
      if(!store.fill[q.id]){store.fill[q.id]=true;save();}
    }else{
      const near=q.ans.some(a=>normAns(a,false)===normAns(inp.value,false));
      fb.innerHTML=`<strong class="ng">もう少し</strong> ${near?"大文字・小文字が違います。Java では区別されます。":"もう一度考えてみましょう。"} <button class="btn ghost" data-show="${n}" style="padding:2px 10px;font-size:.78rem">答えを見る</button>`;
    }
  };
  panel.addEventListener("click",e=>{
    const c=e.target.closest("[data-check]"); if(c) return check(+c.dataset.check);
    const h=e.target.closest("[data-hint]");
    if(h){const q=list[+h.dataset.hint],fb=panel.querySelector(`.q[data-n="${h.dataset.hint}"] .fb`);fb.hidden=false;fb.innerHTML=`<strong>ヒント</strong> ${q.h?md(q.h)+" ":""}最初の文字は「${esc(q.ans[0][0])}」、全部で${[...q.ans[0]].length}文字です。`;return;}
    const s=e.target.closest("[data-show]");
    if(s){const q=list[+s.dataset.show],fb=panel.querySelector(`.q[data-n="${s.dataset.show}"] .fb`);fb.innerHTML=`<strong>答え</strong> <code>${esc(q.ans[0])}</code>　${md(q.e)}`;}
  });
  panel.querySelectorAll(".fill-in").forEach(inp=>inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();check(+inp.closest(".q").dataset.n);}}));
}

let codeQ="",codeFav=false;
function topicPos(cat,title){for(let lv=0;lv<3;lv++){const i=T[cat][lv].findIndex(t=>t.title===title);if(i>=0)return [lv,i];}return null;}
function renderCodes(){
  const cat=state.cat,list=CODES[cat];
  $("#panel").innerHTML=`
    <div><div class="eyebrow">${SUBJ[cat].full} ・ ${list.length}個</div><h2>コード集</h2></div>
    <p class="sub">「〜したい」から探して、コピーして使えるコードです。☆を押すとお気に入りに入ります。</p>
    <div class="cd-tools">
      <input class="gls" id="cdq" type="search" placeholder="やりたいことで探す" autocomplete="off" value="${esc(codeQ)}">
      <button class="btn ${codeFav?"":"ghost"}" id="cdfav" aria-pressed="${codeFav}">★ お気に入りだけ</button>
    </div>
    <div id="cdlist" style="display:flex;flex-direction:column;gap:14px"></div>`;
  const draw=()=>{
    const q=codeQ.trim().toLowerCase();
    const hit=list.filter(s=>(!codeFav||store.fav[s.id])&&(!q||(s.t+s.g+s.memo+s.code).toLowerCase().includes(q)));
    $("#cdlist").innerHTML=hit.length?hit.map(s=>`<section class="cd" data-id="${s.id}">

        <button class="fav" data-fav="${s.id}" aria-pressed="${!!store.fav[s.id]}" aria-label="お気に入り">${store.fav[s.id]?"★":"☆"}</button></div>
      <pre><code>${esc(s.code)}</code></pre>
      <p class="cd-memo"><b>使い方</b> ${md(s.memo)}</p>
      <div class="row">
        <button class="btn" data-copy="${s.id}">コピー</button>
        ${s.pv?`<button class="btn ghost" data-pv="${s.id}">見た目を見る</button>`:""}
        ${s.link&&topicPos(cat,s.link)?`<button class="btn ghost" data-goto="${esc(s.link)}">解説：${esc(s.link)}</button>`:""}
      </div>
      <div class="cd-pv"></div>
    </section>`).join(""):`<div class="empty"><b>見つかりませんでした</b>${codeFav?"☆を押したコードがここに表示されます。":"別の言葉で探してみましょう。"}</div>`;
  };
  $("#cdq").addEventListener("input",e=>{codeQ=e.target.value;draw();});
  $("#cdfav").addEventListener("click",e=>{codeFav=!codeFav;e.currentTarget.setAttribute("aria-pressed",codeFav);e.currentTarget.classList.toggle("ghost",!codeFav);draw();});
  $("#cdlist").addEventListener("click",e=>{
    const f=e.target.closest("[data-fav]");
    if(f){const id=f.dataset.fav;if(store.fav[id])delete store.fav[id];else store.fav[id]=true;save();f.setAttribute("aria-pressed",!!store.fav[id]);f.textContent=store.fav[id]?"★":"☆";if(codeFav)draw();return;}
    const c=e.target.closest("[data-copy]");
    if(c){const s=list.find(x=>x.id===c.dataset.copy);const done=()=>{c.textContent="コピーしました";setTimeout(()=>c.textContent="コピー",1500);};
      const sel=()=>{const r=document.createRange();r.selectNodeContents(c.closest(".cd").querySelector("pre"));const g=getSelection();g.removeAllRanges();g.addRange(r);c.textContent="選択しました（コピーしてください）";};
      try{navigator.clipboard.writeText(s.code).then(done,sel);}catch(err){sel();}return;}
    const p=e.target.closest("[data-pv]");

      const fr=document.createElement("iframe");fr.title=s.t+"のプレビュー";fr.setAttribute("sandbox","allow-scripts");
      fr.srcdoc=PV_BASE+(s.pv===true?s.code:s.pv);box.appendChild(fr);p.textContent="プレビューを閉じる";return;}
    const g=e.target.closest("[data-goto]");
    if(g){const pos=topicPos(cat,g.dataset.goto);state={cat,lv:pos[0],view:pos[1]};render();window.scrollTo({top:0,behavior:"smooth"});}
  });
  draw();
}

function linkTerms(root){
  const list=GLOSS[state.cat]; if(!list||!root) return;
  const terms=list.map(g=>g[0]).filter(t=>t.length>1).sort((a,b)=>b.length-a.length);
  const re=new RegExp(terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"),"g");
  const used=new Set(), nodes=[];
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentNode.closest("code,button")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n=>{
    const t=n.nodeValue; let last=0,m,frag=null; re.lastIndex=0;
    while((m=re.exec(t))){
      if(used.has(m[0])) continue; used.add(m[0]);
      frag=frag||document.createDocumentFragment();
      frag.append(t.slice(last,m.index));
      const b=document.createElement("button"); b.type="button"; b.className="gl"; b.dataset.g=m[0]; b.textContent=m[0];
      frag.append(b); last=m.index+m[0].length;
    }
    if(frag){frag.append(t.slice(last)); n.replaceWith(frag);}
  });
}

/* ===== コードを書いて練習 ===== */
const PV_BASE='<meta charset="utf-8"><style>body{font-family:sans-serif;margin:0;padding:10px;color:#222;background:#fff;line-height:1.6}</style>';
/* JSを別スレッドで実行（2秒で打ち切り） */
function runJS(code){
  return new Promise(res=>{
    const pre='const __o=[];const __f=v=>{if(typeof v==="string")return v;if(v===undefined)return"undefined";try{const s=JSON.stringify(v);return s===undefined?String(v):s;}catch(e){return String(v);}};self.console={log:(...a)=>__o.push(a.map(__f).join(" "))};let __e=null;\ntry{\n';
    const post='\n}catch(e){__e=e.name+": "+e.message;}\npostMessage({out:__o,err:__e});';
    let wk,url,done=false;
    const fin=r=>{if(done)return;done=true;try{wk&&wk.terminate();}catch(e){}try{url&&URL.revokeObjectURL(url);}catch(e){}res(r);};
    try{
      url=URL.createObjectURL(new Blob([pre+code+post],{type:"text/javascript"}));
      wk=new Worker(url);
      wk.onmessage=e=>fin(e.data);
      wk.onerror=e=>{e.preventDefault();fin({out:[],err:(e.message||"エラー").replace(/^Uncaught\s*/,"")});};
      setTimeout(()=>fin({out:[],err:"TIMEOUT"}),2000);
    }catch(e){fin({out:[],err:"このブラウザではコードを実行できませんでした。"});}
  });
}
/* HTMLを操作するJSは、プレビューの中で実行して結果を確かめる */
function runDOM(ex,code,pv){
  return new Promise(res=>{
    const key="k"+Math.random().toString(36).slice(2);
    let done=false;
    const h=e=>{if(e.data&&e.data.k===key)fin(e.data);};
    const fin=r=>{if(done)return;done=true;window.removeEventListener("message",h);res(r);};
    window.addEventListener("message",h);
    const safe=s=>s.replace(/<\/script/gi,"<\\/script");
    pv.setAttribute("sandbox","allow-scripts");
    pv.srcdoc=PV_BASE+ex.html+
      `<script>window.onerror=function(m){parent.postMessage({k:"${key}",err:String(m)},"*");return true;};<\/script>`+
      `<script>${safe(code)}<\/script>`+
      `<script>setTimeout(function(){try{var m=(${ex.test})();parent.postMessage({k:"${key}",r:m},"*");}catch(e){parent.postMessage({k:"${key}",err:String(e&&e.message||e)},"*");}},60);<\/script>`;
    setTimeout(()=>fin({err:"TIMEOUT"}),3000);
  });
}

  const say=(ok,msg)=>{j.hidden=false;j.innerHTML=`<strong class="${ok?"ok":"ng"}">${ok?"正解！":"もう少し"}</strong> ${md(msg)}`;};

  if(kind==="html"||kind==="css"){

      const mf=mustFail(code); if(mf){say(false,mf);return;}
      if(r.r) say(false,r.r); else {say(true,"正しく動きました。プレビューでも試してみましょう。");clear();}
    });
  }else{
    $("#wrun").addEventListener("click",async()=>{
      const code=ta.value,out=$("#wout");
      if(!code.trim()){say(false,"コードを書いてから実行しましょう。");return;}

      const r=await runJS(code);

      if(r.err==="TIMEOUT"){say(false,"2秒以上終わらなかったので止めました。繰り返しの条件が終わらない（無限ループ）になっていないか確認しましょう。");return;}
      if(r.err){say(false,"エラーが出ています。スペルや `( )` `{ }` `\"` の閉じ忘れを見直すと見つかることが多いです。");return;}
      const mf=mustFail(code); if(mf){say(false,mf);return;}
      const ans=await runJS(ex.a),norm=a=>a.map(s=>s.trim()).join("\n");
      if(norm(lines)===norm(ans.out||[])){say(true,"期待どおりの結果が表示されました。");clear();}
      else say(false,`表示された結果が答えと違います。正しい結果は「${(ans.out||[]).join(" / ")}」です。`);
    });
  }
}

/* ===== SQLを書いて練習 ===== */
const SETUP=`
CREATE TABLE members (id INTEGER PRIMARY KEY, name TEXT, age INTEGER, city TEXT);
INSERT INTO members VALUES ${MEM.map(r=>`(${r[0]},'${r[1]}',${r[2]},'${r[3]}')`).join(",")};
CREATE TABLE orders (id INTEGER PRIMARY KEY, member_id INTEGER, item TEXT, price INTEGER, order_date TEXT);
INSERT INTO orders VALUES
 (1,1,'コーヒー豆',1200,'2026-09-01'),(2,2,'マグカップ',1800,'2026-09-03'),
 (3,1,'ドリッパー',2500,'2026-09-10'),(4,4,'コーヒー豆',1200,'2026-09-12'),
 (5,3,'紅茶セット',1500,'2026-09-20'),(6,2,'コーヒー豆',1200,'2026-09-25'),
 (7,6,'マグカップ',1800,'2026-10-02');
`;
let SQL=null, sqlLoading=null;
const sqlIdx={};
function loadSQL(){
  if(SQL) return Promise.resolve(SQL);
  if(sqlLoading) return sqlLoading;
  sqlLoading=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-asm.js";
    s.onload=()=>initSqlJs().then(m=>{SQL=m; res(m);},rej);
    s.onerror=()=>{sqlLoading=null;rej(new Error("load"));};
    document.head.appendChild(s);
  });
  return sqlLoading;
}
function freshDB(){const db=new SQL.Database(); db.run(SETUP); return db;}
function tableHTML(r){
  if(!r) return `<p class="note">結果は0行でした。</p>`;
  return `<div class="tbl"><table><thead><tr>${r.columns.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${r.values.map(row=>`<tr>${row.map(v=>`<td>${v===null?"NULL":esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div><small style="color:var(--muted)">${r.values.length} 行</small>`;
}
function runQ(db,q){const res=db.exec(q); return res.length?res[res.length-1]:null;}
function runSet(q,after){const db=freshDB(); let r=runQ(db,q); if(after) r=runQ(db,after); return r;}
function norm(r,ordered){
  if(!r) return "[]";
  const rows=r.values.map(row=>JSON.stringify(row.map(v=>v===null?null:String(v))));
  if(!ordered) rows.sort();
  return rows.join("|");
}
function renderSQL(){
  const list=SQLW[state.lv];
  const cleared=list.filter(e=>store.sql[e.i]).length;
  $("#panel").innerHTML=`
    <div><div class="eyebrow">データベース ・ ${LV[state.lv]} ・ 実践 ・ ${cleared} / ${list.length} クリア</div><h2>SQLを書いて練習</h2></div>
    <p class="note">ブラウザの中で本物のデータベース（SQLite）が動きます。MySQLとほぼ同じ書き方ですが、一部の関数や型は違います。何を実行しても、問題ごとにデータは元に戻ります。</p>
    <div id="sqlbox"><p class="note">データベースを準備しています…</p></div>`;
  loadSQL().then(drawSQL).catch(()=>{
    $("#sqlbox").innerHTML=`<p class="note">データベースの読み込みに失敗しました。通信状況を確認して、ページを開き直してください。</p>`;
  });
}
function drawSQL(){
  const list=SQLW[state.lv],lv=state.lv;
  if(sqlIdx[lv]==null) sqlIdx[lv]=0;
  const k=sqlIdx[lv],ex=list[k];
  $("#sqlbox").innerHTML=`
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="exlist">${list.map((e,i)=>`<button class="exbtn ${store.sql[e.i]?"done":""}" aria-pressed="${i===k}" data-ex="${i}" aria-label="問題${i+1}">${i+1}</button>`).join("")}</div>
      <div class="q">
        <p class="qt"><span class="qn">問題${k+1}</span>${md(ex.t)}</p>
        <label for="sqlin" class="tname" style="font-family:var(--f-body)">SQLを入力</label>
        <textarea id="sqlin" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="例）SELECT * FROM members;"></textarea>
        <div class="row">
          <button class="btn" id="run">実行して答え合わせ</button>
          <button class="btn ghost" id="hint">ヒント</button>
          <button class="btn ghost" id="show">答えを見る</button>
        </div>
        <div id="hintbox" class="fb" hidden>${md(ex.h)}</div>
        <div id="ansbox" hidden>${answerHTML(ex)}</div>
        <div id="judge" class="fb" hidden></div>
        <div id="out"></div>
      </div>
      <details>
        <summary>使えるテーブルの中身を見る（members / orders）</summary>
        <div style="display:flex;flex-direction:column;gap:6px;margin-top:10px">
          <p class="tname">members（会員）</p>${tableHTML(runQ(freshDB(),"SELECT * FROM members"))}
          <p class="tname">orders（注文）</p>${tableHTML(runQ(freshDB(),"SELECT * FROM orders"))}
        </div>
      </details>
    </div>`;
  $("#sqlbox").querySelectorAll("[data-ex]").forEach(b=>b.addEventListener("click",()=>{sqlIdx[lv]=+b.dataset.ex; drawSQL();}));
  $("#hint").addEventListener("click",()=>$("#hintbox").hidden=!$("#hintbox").hidden);
  $("#show").addEventListener("click",()=>$("#ansbox").hidden=!$("#ansbox").hidden);
  const ta=$("#sqlin");
  ta.addEventListener("keydown",e=>{if(e.key==="Tab"&&!e.shiftKey){e.preventDefault();const s=ta.selectionStart;ta.setRangeText("  ",s,ta.selectionEnd,"end");}});
  $("#run").addEventListener("click",()=>{
    const q=ta.value.trim(), out=$("#out"), j=$("#judge");
    const say=(ok,msg)=>{j.hidden=false;j.innerHTML=`<strong class="${ok?"ok":"ng"}">${ok?"正解！":"もう少し"}</strong> ${md(msg)}`;};
    if(!q){say(false,"SQLを書いてから実行しましょう。"); return;}
    let mine;
    try{mine=runSet(q,ex.after);}catch(err){
      say(false,"SQLの書き方を確認しましょう。スペルや , ' ; を見直すと見つかることが多いです。");
      out.innerHTML=`<p class="err">${esc(err.message)}</p>`; return;
    }
    out.innerHTML=(ex.after?`<p class="sub">実行後に <code>${esc(ex.after)}</code> で確認した結果：</p>`:"")+tableHTML(mine);
    for(const [re,msg] of (ex.must||[])){if(!re.test(q)){say(false,msg);return;}}
    const ok=norm(mine,ex.ordered)===norm(runSet(ex.a,ex.after),ex.ordered);
    if(ok){say(true,"期待どおりの結果が出ました。"); if(!store.sql[ex.i]){store.sql[ex.i]=true; save(); const b=$(`[data-ex="${k}"]`); b&&b.classList.add("done");}}
    else say(false,"結果が答えと違います。列や条件、並び順を見直してみましょう。");
  });
}
